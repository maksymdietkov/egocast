conditions:
  frost:
    intro:
      - weight: 2
        text: "Так, готовься —"
      - weight: 1
        text: "Включаем режим полярника —"
      - weight: 1
        text: "На улице как в холодильнике —"
      - weight: 1
        text: "Сегодня не до шуток —"
    advice:
      - weight: 1
        text: "Одевайся по-настоящему: термуха, свитер, нормальный пуховик.\nЛёгкую курточку сегодня даже не доставай — тут не до моды, тут на выживание."
      - weight: 1
        text: "Тёплый пуховик, перчатки нормальные, не тоненькие, и шапка, которая реально закрывает уши.\nИ да, всё сразу — сегодня без компромиссов."
      - weight: 1
        text: "Шарф, перчатки, шапка — весь зимний набор.\nИ тёплые носки, если хочешь дойти до дома с пальцами на ногах."
      - weight: 1
        text: "Термуха, свитер, пуховик — по полной программе.\nГолая кожа на таком морозе быстро теряет чувствительность."
    sting:
      - weight: 1
        text: "Сегодня точно не день для тонкой курточки."
      - weight: 1
        text: "Мода откладывается до лучших времён."
      - weight: 1
        text: "Пар изо рта пойдёт раньше, чем остынет кофе."

  cold:
    intro:
      - weight: 3
        text: "Кутайся —"
      - weight: 1
        text: "Имей в виду —"
      - weight: 1
        text: "Зима ещё не закончила —"
      - weight: 1
        text: "Сегодня серьёзно —"
    advice:
      - weight: 1
        text: "На улице холодно — бери тёплый пуховик.\nПро перчатки тоже не забывай, а то руки потом сами напомнят."
      - weight: 1
        text: "Хватит нормального пуховика и шарфа.\nСегодня не для курточки, каким бы закалённым ты себя ни считал."
      - weight: 1
        text: "Одевайся слоями: термуха под свитер.\nСверху пуховик, который реально застёгивается до самого верха."
      - weight: 1
        text: "Пуховик, шапка, что-нибудь на шею.\nВетер найдёт любую щель, которую ты забыл закрыть."
    sting:
      - weight: 1
        text: "Кофе спасает. Проверено."
      - weight: 1
        text: "Летнюю курточку сегодня даже не зови."
      - weight: 1
        text: "Уши важнее внешнего вида — надень шапку."

  chilly:
    intro:
      - weight: 2
        text: "Заметно похолодало —"
      - weight: 1
        text: "Слегка пробирает —"
      - weight: 1
        text: "Резко остыло —"
    advice:
      - weight: 1
        text: "Куртка поплотнее или толстый свитер под курткой — самое то.\nГолые руки заноют минут через десять, учти."
      - weight: 1
        text: "Накинь шарф и утеплённую куртку.\nЕсли быстро мёрзнешь — прихвати ещё перчатки."
      - weight: 1
        text: "Тут работает связка «шарф плюс куртка».\nНичего страшного, просто не выходи в футболке."
    sting:
      - weight: 1
        text: "Не мороз, конечно, но уши всё равно поворчат."
      - weight: 1
        text: "Формально ещё не зима. Ветру об этом не сказали."

  cool:
    intro:
      - weight: 2
        text: "В целом терпимо —"
      - weight: 1
        text: "Слегка свежо —"
      - weight: 1
        text: "Ничего критичного —"
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит с запасом.\nМожно ещё шарф, если тебя продувает даже от лёгкого ветра."
      - weight: 1
        text: "Худи или лёгкая куртка — самое то.\nТяжёлый пуховик прибереги на потом, сегодня рано."
      - weight: 1
        text: "Футболка под курткой — рабочая схема.\nПотеплеет — завяжешь на поясе."
    sting:
      - weight: 1
        text: "Это погода для куртки, а не для пуховика. Разница есть."
      - weight: 1
        text: "Настолько комфортно, что забудешь, зачем вообще смотрел прогноз."

  mild:
    intro:
      - weight: 2
        text: "Довольно приятно —"
      - weight: 1
        text: "Лёгкий день —"
      - weight: 1
        text: "Ничего особо планировать не надо —"
    advice:
      - weight: 1
        text: "Хватит лёгкой куртки или рубашки с длинным рукавом.\nСегодня можно не заморачиваться."
      - weight: 1
        text: "Погода для кардигана — просто, спокойно, без драмы.\nТяжёлые слои сегодня не нужны."
      - weight: 1
        text: "Подойдёт всё, что чистое и удобное.\nНа вечер можно прихватить что-то лёгкое, на всякий случай."
    sting:
      - weight: 1
        text: "День, к которому даже погодному приложению нечего добавить."
      - weight: 1
        text: "Лови момент — такие дни выпадают нечасто."

  comfortable:
    intro:
      - weight: 2
        text: "На улице хорошо —"
      - weight: 1
        text: "Почти идеальная погода —"
      - weight: 1
        text: "Прямо как из учебника —"
    advice:
      - weight: 1
        text: "Одевайся сегодня как душе угодно.\nФутболка или лёгкая рубашка — самое то."
      - weight: 1
        text: "Короткий рукав — беспроигрышный вариант.\nМожно взять лёгкий слой на вечер, просто на всякий случай."
      - weight: 1
        text: "Такая погода, что подойдёт вообще всё.\nОшибиться с одеждой сегодня сложно."
    sting:
      - weight: 1
        text: "Где-то сейчас скучает синоптик — сказать ему нечего."
      - weight: 1
        text: "Такой погоды всем вечно не хватает."

  warm:
    intro:
      - weight: 2
        text: "Теплеет —"
      - weight: 1
        text: "Лето на подходе —"
      - weight: 1
        text: "Становится жарковато —"
    advice:
      - weight: 1
        text: "Шорты и футболка — твои лучшие друзья сегодня.\nСолнечные очки тоже не будут лишними."
      - weight: 1
        text: "Только дышащие ткани — хлопок, лён.\nЕсли долго будешь на солнце — возьми кепку."
      - weight: 1
        text: "Светлые цвета, лёгкие ткани, минимум всего.\nСлои прибереги на другой сезон."
    sting:
      - weight: 1
        text: "Не забудь солнцезащитный крем — сам себе потом спасибо скажешь."
      - weight: 1
        text: "Идеальный повод съесть мороженое, если искал причину."

  hot:
    intro:
      - weight: 2
        text: "Ух, ну и жара —"
      - weight: 1
        text: "Настоящее пекло —"
      - weight: 1
        text: "Лето включилось на полную —"
    advice:
      - weight: 1
        text: "Реально жарко — пей побольше воды.\nСамые лёгкие вещи, что есть в шкафу, плюс солнечные очки."
      - weight: 1
        text: "Свободный лён и шляпа с широкими полями.\nКрем от солнца сегодня строго обязателен."
      - weight: 1
        text: "Самая светлая и лёгкая одежда, какая только найдётся.\nТёмные цвета сегодня превратят тебя в гриль, без исключений."
    sting:
      - weight: 1
        text: "Мороженое сегодня почти что полезная еда."
      - weight: 1
        text: "Твоя тень — единственная тень, что у тебя есть, используй с умом."
      - weight: 1
        text: "На асфальте к обеду можно жарить яичницу."

  windy_cold:
    intro:
      - weight: 2
        text: "Кутайся —"
      - weight: 1
        text: "Ветер сегодня настроен серьёзно —"
      - weight: 1
        text: "Холод с характером —"
      - weight: 1
        text: "Ветер нашёл единственное слабое место —"
    advice:
      - weight: 1
        text: "На улице мороз плюс ветер.\nВетрозащитная куртка поверх пуховика сегодня себя окупит."
      - weight: 1
        text: "Обычный пуховик ветер продувает насквозь.\nБери что-то с ветрозащитным верхним слоем."
      - weight: 1
        text: "Застегни всё, заправь всё.\nЛюбая щель — приглашение для ветра, а он такими приглашениями не разбрасывается."
      - weight: 1
        text: "В худи такой холод не перетерпеть.\nВетрозащитный пуховик, нормальные перчатки, шапка, которая не улетит."
    sting:
      - weight: 1
        text: "Предупреждал же — потом не говори, что нет."
      - weight: 1
        text: "Сегодня основной урон наносит именно ветер, а не сам холод."
      - weight: 1
        text: "Причёска после такой прогулки уже не восстановится."
      - weight: 1
        text: "Где-то сейчас чей-то шарф пытается стать воздушным змеем."

  windy_frost:
    intro:
      - weight: 2
        text: "Ощущение — жёстче некуда —"
      - weight: 1
        text: "Это уже серьёзное испытание —"
      - weight: 1
        text: "Природа сегодня выкладывается по полной —"
      - weight: 1
        text: "Территория обморожения —"
    advice:
      - weight: 1
        text: "Любая щель в одежде — находка для ветра.\nЗакрывай всё: высокий воротник, заправленный шарф, перчатки впритык."
      - weight: 1
        text: "Ничего свободного, ничего открытого.\nСегодня режим полного покрытия, без компромиссов."
      - weight: 1
        text: "Лицо, уши, руки — прячь, что можешь.\nОткрытая кожа немеет быстрее, чем кажется."
      - weight: 1
        text: "Тут нужен самый тёплый пуховик, обязательно с ветрозащитой.\nЕсли можешь отложить выход на улицу — отложи."
    sting:
      - weight: 1
        text: "Открытая кожа сегодня не вариант."
      - weight: 1
        text: "Такой холод сам решает, что тебе сегодня надеть."
      - weight: 1
        text: "Лицо онемеет раньше, чем остынет кофе."
      - weight: 1
        text: "Цифра с учётом ветра — не рекомендация, а требование."

  windy_hot:
    intro:
      - weight: 1
        text: "Хоть ветерок спасает —"
      - weight: 1
        text: "Единственный плюс — ветер —"
      - weight: 1
        text: "Жарко, но хотя бы дует —"
      - weight: 1
        text: "Ветер пытается как-то помочь —"
    advice:
      - weight: 1
        text: "Всё равно лёгкие ткани.\nШляпу сегодня, может, и не понадобится — спасибо ветру."
      - weight: 1
        text: "Ветер немного сбивает жару, но она никуда не делась.\nКрем от солнца не пропускай просто потому что стало прохладнее на ощупь."
      - weight: 1
        text: "Свободная дышащая одежда — лучший вариант.\nТолько шляпу держи крепче, ветру она нужна больше, чем тебе."
      - weight: 1
        text: "Ощущается легче, чем должно быть, — спасибо ветру.\nА вот УФ от этого слабее не стал."
    sting:
      - weight: 1
        text: "Ветер — приятный бонус, а не замена крему от солнца."
      - weight: 1
        text: "Ощущается прохладнее, чем есть — солнце в курсе не было."
      - weight: 1
        text: "Наслаждайся ветром, сегодня он тебе подыгрывает."
      - weight: 1
        text: "Держи шляпу крепче. В прямом смысле слова."

  rain:
    intro:
      - weight: 2
        text: "Бери зонт —"
      - weight: 1
        text: "Слегка моросит —"
      - weight: 1
        text: "На улице мокро —"
      - weight: 1
        text: "Небо подтекает —"
    advice:
      - weight: 1
        text: "Лёгкого дождевика или куртки с капюшоном хватит.\nОсобо сложного тут ничего не требуется."
      - weight: 1
        text: "Водонепроницаемая обувь себя оправдает.\nНе доверяй куртке, которая «непромокаемая» только на бирке."
      - weight: 1
        text: "Зонт плюс капюшон — рабочая связка.\nНоски скажут спасибо в любом случае."
      - weight: 1
        text: "Возьми что-нибудь непромокаемое и особо не парься.\nЭто больше раздражает, чем реально опасно."
    sting:
      - weight: 1
        text: "Лужи найдут твои носки. Всегда находят."
      - weight: 1
        text: "Кто-то сегодня точно забыл зонт. Постарайся быть не этим человеком."
      - weight: 1
        text: "Отличный повод притвориться, что тебе есть куда пойти в тепле."
      - weight: 1
        text: "У твоей причёски сегодня свои планы, и они не совпадают с твоими."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это уже не морось —"
      - weight: 1
        text: "Настоящий ливень —"
      - weight: 1
        text: "Держись крепче —"
      - weight: 1
        text: "Небо решило не мелочиться —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, непромокаемая обувь и зонт покрепче.\nПончо сегодня не будет перебором."
      - weight: 1
        text: "Всё водонепроницаемое: куртка, обувь, чехол на сумку, если носишь.\nОбычный зонт сегодня может не выдержать."
      - weight: 1
        text: "Если идёшь пешком — одевайся в полную дождевую броню.\nПоловинчатые меры значат промокнуть наполовину — а толку от этого никакого."
      - weight: 1
        text: "Ботинки, капюшон и сумка, которая переживёт ливень.\nЗамша сегодня точно не вариант."
    sting:
      - weight: 1
        text: "Считай это намёком поработать сегодня из дома."
      - weight: 1
        text: "Даже утки сегодня недовольны."
      - weight: 1
        text: "Зонт сегодня — часть образа, хочешь ты того или нет."
      - weight: 1
        text: "Где-то сейчас чей-то подвал тихо жалеет о жизненных выборах."

  snow:
    intro:
      - weight: 2
        text: "Идёт снег —"
      - weight: 1
        text: "Зимняя сказка, или просто морока —"
      - weight: 1
        text: "Сыплет с неба —"
      - weight: 1
        text: "Кругом бело —"
    advice:
      - weight: 1
        text: "Ботинки с нормальным протектором, тёплые перчатки, шапка.\nСлякоть тебе не друг, каким бы красивым ни казался снег."
      - weight: 1
        text: "Одевайся слоями под непромокаемым пуховиком.\nОбычную обувь смени на что-то с реальным сцеплением."
      - weight: 1
        text: "Тепло с головы до пят — сегодня без исключений.\nХорошие ботинки важнее хорошего пуховика."
      - weight: 1
        text: "Обувь сегодня важнее пуховика.\nУпасть на льду — так себе начало дня."
    sting:
      - weight: 1
        text: "Красиво из окна, уже не так красиво в ботинке."
      - weight: 1
        text: "Кто-то сегодня точно слепит снеговика. Скорее всего, не ты."
      - weight: 1
        text: "Сегодня сцепление важнее стиля, без вариантов."
      - weight: 1
        text: "Тротуары о плане ещё не в курсе."

  storm:
    intro:
      - weight: 2
        text: "Надвигается шторм —"
      - weight: 1
        text: "Сегодня не до прогулок —"
      - weight: 1
        text: "Держись за что-нибудь —"
      - weight: 1
        text: "Небо сегодня разошлось не на шутку —"
    advice:
      - weight: 1
        text: "Если можешь остаться дома — оставайся.\nЕсли нет — нормальная непромокаемая куртка и крепкая обувь, а зонт даже не доставай, всё равно вывернет."
      - weight: 1
        text: "Закрепи всё, надень что-то непромокаемое и ветрозащитное.\nОткрытые зонты сегодня не работают в принципе — ветер побеждает всегда."
      - weight: 1
        text: "Хватай сумку и иди по делу, без задержек на улице.\nЕсли совсем надо быть снаружи — полная непромокаемая экипировка."
      - weight: 1
        text: "Не бери то, что не готов потерять из-за ветра.\nКрепкий капюшон сегодня надёжнее любого зонта."
    sting:
      - weight: 1
        text: "Зонт этого не переживёт. Оставь дома."
      - weight: 1
        text: "Идеальный день, чтобы остаться дома с чаем."
      - weight: 1
        text: "Даже деревьям сегодня несладко."
      - weight: 1
        text: "Природа явно не в настроении для намёков."

expand:
  trigger:
    - "не веришь? вот скучная правда"