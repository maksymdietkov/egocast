conditions:
  frost:
    intro:
      - weight: 2
        text: "Одеваемся потеплее —"
      - weight: 1
        text: "Арктический режим включён —"
      - weight: 1
        text: "Природа открыла морозилку —"
      - weight: 1
        text: "Это не учебная тревога —"
      - weight: 1
        text: "Мороз передаёт привет —"
      - weight: 1
        text: "Коротко о зимнем прогнозе —"
      - weight: 1
        text: "Перед выходом на улицу —"
      - weight: 1
        text: "Сегодня с морозцем —"
      - weight: 1
        text: "Пора проверить гардероб —"
      - weight: 1
        text: "На термометре всё написано —"
    advice:
      - weight: 1
        text: "Надень термобельё, шерстяной свитер и тёплый пуховик.\nКрасивую тонкую куртку оставь для другой погоды."
      - weight: 1
        text: "Выбирай зимнюю куртку, утеплённые перчатки и шапку, закрывающую уши.\nДа, всё сразу — сегодня комплект не делим."
      - weight: 1
        text: "Доставай шарф, варежки, шапку и тёплые носки.\nПальцам ног тоже хочется пережить прогулку с комфортом."
      - weight: 1
        text: "Надень термобельё, флиску и полноценную зимнюю куртку.\nОткрытые участки кожи на морозе быстро теряют чувствительность."
      - weight: 1
        text: "Обувай утеплённые ботинки с цепкой подошвой и свободным носком.\nВ тесной обуви ноги мёрзнут охотнее."
      - weight: 1
        text: "Выбирай брюки на подкладке или поддень кальсоны.\nОдни джинсы с морозом договариваются плохо."
      - weight: 1
        text: "Надень варежки и закрой запястья манжетами.\nМаленькая щель между рукавом и варежкой умеет испортить большую прогулку."
      - weight: 1
        text: "Добавь бафф, который можно натянуть на нос и щёки.\nЕсли он отсыреет от дыхания, замени на сухой."
      - weight: 1
        text: "Под тёплую одежду надень влагоотводящий первый слой.\nНа быстрой ходьбе слегка расстегни молнию, прежде чем вспотеешь."
      - weight: 1
        text: "Для ожидания на улице выбирай длинный пуховик.\nНа остановке собственное отопление работает вполсилы."
    sting:
      - weight: 1
        text: "Сегодня лёгкая куртка остаётся дома."
      - weight: 1
        text: "Мода временно уступает место здравому смыслу."
      - weight: 1
        text: "Пар изо рта появится раньше, чем успеешь пожалеть о выходе."
      - weight: 1
        text: "Морозилка теперь не только на кухне."
      - weight: 1
        text: "Даже за хлебом сегодня лучше собираться по списку."
      - weight: 1
        text: "Собака может неожиданно пересмотреть длину маршрута."
      - weight: 1
        text: "Одеяло приводит всё более убедительные аргументы."
      - weight: 1
        text: "Красивый маршрут через парк подождёт до весны."
      - weight: 1
        text: "План по шагам придётся согласовать со здравым смыслом."
      - weight: 1
        text: "Солнце светит так приветливо, будто не знает, что творится внизу."

  cold:
    intro:
      - weight: 3
        text: "Утепляемся —"
      - weight: 1
        text: "Обрати внимание —"
      - weight: 1
        text: "Зима ещё не попрощалась —"
      - weight: 1
        text: "Сегодня без легкомыслия —"
      - weight: 1
        text: "Прежде чем отправиться по делам —"
      - weight: 1
        text: "Немного подготовки не помешает —"
      - weight: 1
        text: "Вот что у нас с погодой —"
      - weight: 1
        text: "Холод обосновался всерьёз —"
      - weight: 1
        text: "Одеваемся по термометру —"
      - weight: 1
        text: "Пара слов про одежду —"
    advice:
      - weight: 1
        text: "Надень тёплую куртку.\nПерчатки тоже захвати — иначе руки быстро напомнят о них."
      - weight: 1
        text: "Выбирай добротное пальто и шарф.\nДля тонкой ветровки холодновато, даже если характер закалённый."
      - weight: 1
        text: "Под свитер надень термофутболку.\nСверху нужна куртка, которая застёгивается до самого верха."
      - weight: 1
        text: "Надень зимнюю куртку, шапку и что-нибудь на шею.\nВетер найдёт любую оставленную щель."
      - weight: 1
        text: "Обувай ботинки повыше и носки с шерстью.\nГолые щиколотки сегодня могут отдохнуть."
      - weight: 1
        text: "Для долгой прогулки выбирай утеплённые брюки.\nТонкие офисные лучше работают рядом с офисной батареей."
      - weight: 1
        text: "Поверх тёплой флиски надень куртку, которая не продувается.\nОдной мягкости мало, когда поднимается ветер."
      - weight: 1
        text: "Добавь под верхнюю одежду кофту на молнии.\nВ помещении её легко снять до того, как отопление победит."
      - weight: 1
        text: "Для неспешной прогулки поддень утеплённый жилет под свободное пальто.\nРазглядывание витрин греет душу, но не очень греет тело."
      - weight: 1
        text: "Для быстрой ходьбы выбирай дышащий первый слой и утеплённую куртку.\nРасстегни вентиляцию до того, как вспотеешь и начнёшь мёрзнуть на обратном пути."
    sting:
      - weight: 1
        text: "Горячий кофе сейчас очень кстати. Проверено лично."
      - weight: 1
        text: "Летнюю куртку сегодня не звали."
      - weight: 1
        text: "Причёска подождёт — сначала спрячь уши в шапку."
      - weight: 1
        text: "Батарея снова стала местом притяжения всей семьи."
      - weight: 1
        text: "Карманы внезапно стали главным достоинством одежды."
      - weight: 1
        text: "Первый шаг за порог может немного поправить планы."
      - weight: 1
        text: "Столики на улице — для тех, кому ещё есть что доказывать."
      - weight: 1
        text: "Солнечное пятно не комплектуется обогревом."
      - weight: 1
        text: "Свежий воздух сегодня из холодильного отдела."
      - weight: 1
        text: "Свитер со спинки стула наконец-то дождался своего часа."

  chilly:
    intro:
      - weight: 2
        text: "Заметно зябко —"
      - weight: 1
        text: "Бодрит —"
      - weight: 1
        text: "Холодает —"
      - weight: 1
        text: "В воздухе чувствуется холодок —"
      - weight: 1
        text: "Перед тем как выйти —"
      - weight: 1
        text: "Сверимся с прогнозом —"
      - weight: 1
        text: "Сегодня попрохладнее —"
      - weight: 1
        text: "Есть повод утеплиться —"
      - weight: 1
        text: "Посмотрим, что за окном —"
      - weight: 1
        text: "Задержимся у шкафа на минуту —"
    advice:
      - weight: 1
        text: "Надень демисезонное пальто или плотный свитер под куртку.\nБез перчаток руки довольно скоро начнут проситься в карманы."
      - weight: 1
        text: "Выбирай слегка утеплённую куртку и шарф.\nЕсли легко мёрзнешь, прихвати и перчатки."
      - weight: 1
        text: "Надень куртку и закрой шею шарфом.\nНичего экстремального, просто одной футболки маловато."
      - weight: 1
        text: "Выбирай длинные брюки, лонгслив и лёгкое пальто.\nУкороченные штанины лучше оставить для более тёплого дня."
      - weight: 1
        text: "Обувай закрытую обувь и носки, прикрывающие щиколотки.\nНа долгой прогулке эта мелочь заметно добавит уюта."
      - weight: 1
        text: "Для активного дня надень флиску и непродуваемую ветровку.\nСквозь один только пушистый слой ветер проходит без приглашения."
      - weight: 1
        text: "Под свободную верхнюю одежду добавь кардиган.\nЕго легко снять, если водитель автобуса снова включит тропики."
      - weight: 1
        text: "Для энергичной прогулки попробуй тёплый свитшот с утеплённым жилетом.\nЕсли руки быстро мёрзнут, выбирай куртку с рукавами."
      - weight: 1
        text: "Для долгого пребывания на улице поддень тонкое термобельё.\nСтоять на месте холоднее, чем шагать по делам."
      - weight: 1
        text: "Надень худи на молнии под повседневное пальто.\nМежду улицей и тёплыми магазинами молния пригодится чаще, чем кажется."
    sting:
      - weight: 1
        text: "Ещё не мороз, но уши уже не в восторге."
      - weight: 1
        text: "По календарю не зима. Попробуй объяснить это ветру."
      - weight: 1
        text: "Выход на балкон сократился до взгляда из окна."
      - weight: 1
        text: "Тёплая кружка теперь ещё и грелка для рук."
      - weight: 1
        text: "Погода ненавязчиво намекает на суп."
      - weight: 1
        text: "Гулять ещё приятно, но у гардероба появились условия."
      - weight: 1
        text: "На теневой стороне улицы свой прогноз."
      - weight: 1
        text: "Плечи могут незаметно перебраться поближе к ушам."
      - weight: 1
        text: "Ещё пять минут под одеялом уже не выглядят слабостью."
      - weight: 1
        text: "На скамейке быстро выясняется, насколько полезно было идти."

  cool:
    intro:
      - weight: 2
        text: "Вполне неплохо —"
      - weight: 1
        text: "Лёгкая прохлада —"
      - weight: 1
        text: "Ничего страшного —"
      - weight: 1
        text: "Свежо —"
      - weight: 1
        text: "Вот такой прогноз —"
      - weight: 1
        text: "Перед выходом —"
      - weight: 1
        text: "Небольшая подсказка по одежде —"
      - weight: 1
        text: "Для комфортной прогулки —"
      - weight: 1
        text: "Смотрим на градусник —"
      - weight: 1
        text: "Чуть-чуть предусмотрительности —"
    advice:
      - weight: 1
        text: "Надень лёгкую куртку.\nЕсли чувствителен к ветру, добавь тонкий шарф."
      - weight: 1
        text: "Худи или нетолстой куртки вполне хватит.\nТяжёлое пальто пока пусть повисит в шкафу."
      - weight: 1
        text: "Надень футболку под куртку.\nПотеплеет — куртку можно снять и повязать на пояс."
      - weight: 1
        text: "Попробуй тонкий свитер с джинсами или чиносами.\nЕсли собираешься долго сидеть на улице, захвати что-нибудь сверху."
      - weight: 1
        text: "Надень лонгслив и возьми тонкую ветровку.\nНа открытом месте бывает прохладнее, чем у подъезда."
      - weight: 1
        text: "Для неспешной прогулки выбирай кроссовки с носками.\nСандалии тоже вариант, если пальцы ног разделяют твой оптимизм."
      - weight: 1
        text: "К платью или юбке добавь тонкие колготки и кардиган.\nВ тени открытым ногам может стать зябко."
      - weight: 1
        text: "Для быстрой ходьбы надень дышащую футболку и кофту на молнии.\nЛёгкая прохлада в начале лучше, чем перегрев на полпути."
      - weight: 1
        text: "Поверх хлопковой футболки накинь плотную рубашку.\nВ помещении её можно расстегнуть, чтобы не стало жарко."
      - weight: 1
        text: "Выбирай длинные брюки, поло и повседневный пиджак.\nНа вечер пригодится верх, который удобно застегнуть."
    sting:
      - weight: 1
        text: "Куртке уже пора на выход, пальто ещё может подождать."
      - weight: 1
        text: "Достаточно комфортно, чтобы забыть, зачем открывал прогноз."
      - weight: 1
        text: "Как будто у природы убавили отопление на одно деление."
      - weight: 1
        text: "Вполне уважительная причина пойти длинной дорогой."
      - weight: 1
        text: "Пообедать на улице всё ещё хорошая идея."
      - weight: 1
        text: "С выбором одежды сегодня можно справиться без семейного совета."
      - weight: 1
        text: "Свежий воздух с дополнительной свежестью."
      - weight: 1
        text: "Собака не видит ни одной причины сокращать прогулку."
      - weight: 1
        text: "Есть шанс весь день проносить куртку в руках."
      - weight: 1
        text: "Та самая погода, когда один открывает окно, а другой тут же закрывает."

  mild:
    intro:
      - weight: 2
        text: "Вполне приятно —"
      - weight: 1
        text: "Без погодных сложностей —"
      - weight: 1
        text: "Можно обойтись без особых сборов —"
      - weight: 1
        text: "Комфортный прогноз —"
      - weight: 1
        text: "Всё довольно дружелюбно —"
      - weight: 1
        text: "Сегодня попроще —"
      - weight: 1
        text: "Перед тем как отправиться в путь —"
      - weight: 1
        text: "Коротко перед прогулкой —"
      - weight: 1
        text: "Температура идёт навстречу —"
      - weight: 1
        text: "Прогноз на сегодня такой —"
    advice:
      - weight: 1
        text: "Надень лёгкую куртку или футболку с длинным рукавом.\nДолго думать над этим не придётся."
      - weight: 1
        text: "Выбирай кардиган поверх привычной одежды.\nТяжёлые слои сегодня только помешают."
      - weight: 1
        text: "Надень что-нибудь чистое и удобное.\nНа всякий случай захвати лёгкую кофту на потом."
      - weight: 1
        text: "Хлопковая футболка, джинсы и кроссовки подойдут.\nЕсли планы затянутся до вечера, пригодится тонкая куртка."
      - weight: 1
        text: "Выбирай свободную рубашку, у которой удобно закатать рукава.\nЭтого манёвра обычно хватает при переходе из тени на солнце."
      - weight: 1
        text: "Надень повседневное платье и удобные балетки.\nДля долгих посиделок за уличным столиком возьми лёгкую накидку."
      - weight: 1
        text: "Попробуй дышащее поло и тонкие чиносы.\nНа ходу плотные ткани могут оказаться лишними."
      - weight: 1
        text: "Для активного дня надень влагоотводящий верх и брюки, не стесняющие движений.\nРазогреешься и без дополнительного утепления."
      - weight: 1
        text: "Сочетай тонкий джемпер с юбкой или привычными брюками.\nПод него надень футболку, чтобы было что оставить, когда снимешь верх."
      - weight: 1
        text: "Накинь рубашку без подкладки поверх футболки.\nНа ходу носи расстёгнутой, а на остановке застегни."
    sting:
      - weight: 1
        text: "Даже погодному приложению сегодня не к чему придраться."
      - weight: 1
        text: "Пользуйся моментом — такая погода умеет быстро передумать."
      - weight: 1
        text: "Кажется, подобрать одежду получится быстрее, чем найти ключи."
      - weight: 1
        text: "Погода вежливо отказалась быть главным событием дня."
      - weight: 1
        text: "Поход по делам имеет все шансы превратиться в прогулку."
      - weight: 1
        text: "Редкая возможность поговорить о чём-нибудь, кроме температуры."
      - weight: 1
        text: "Скамейка в парке открыла запись на приём."
      - weight: 1
        text: "Отопление, возможно, тоже заслужило небольшой выходной."
      - weight: 1
        text: "У обеденного перерыва появились планы на свежий воздух."
      - weight: 1
        text: "Похоже, природа наконец нашла удобные настройки."

  comfortable:
    intro:
      - weight: 2
        text: "Хорошо на улице —"
      - weight: 1
        text: "Почти идеальная погода —"
      - weight: 1
        text: "Хоть в учебник по погоде —"
      - weight: 1
        text: "За окном всё радует —"
      - weight: 1
        text: "Прогноз без претензий —"
      - weight: 1
        text: "Улица зовёт —"
      - weight: 1
        text: "Градусник настроен дружелюбно —"
      - weight: 1
        text: "Погода подыгрывает —"
      - weight: 1
        text: "Теперь о приятном —"
      - weight: 1
        text: "Сегодня всё по-человечески —"
    advice:
      - weight: 1
        text: "Надень то, в чём тебе удобно.\nФутболка или лёгкая рубашка отлично подойдёт."
      - weight: 1
        text: "Выбирай короткий рукав.\nНа вечер можно оставить под рукой тонкую кофту."
      - weight: 1
        text: "Бери привычный лёгкий комплект.\nСегодня с одеждой трудно промахнуться."
      - weight: 1
        text: "Сочетай хлопковую футболку с чиносами и кроссовками.\nПростой комплект для дня без лишних требований к гардеробу."
      - weight: 1
        text: "Попробуй свободное платье с сандалиями без каблука или кедами.\nВыбирай пару, в которой действительно удобно ходить."
      - weight: 1
        text: "Надень дышащее поло с шортами или тонкими брюками.\nРешай по планам на день, температура спорить не будет."
      - weight: 1
        text: "Выбирай рубашку со льном и закатанными рукавами.\nСвободный крой даст воздуху гулять между тканью и кожей."
      - weight: 1
        text: "Для велосипеда надень лёгкую спортивную футболку и удобный низ.\nОбъёмная толстовка пригодится разве что для позднего возвращения."
      - weight: 1
        text: "Для долгой прогулки на солнце добавь шляпу с полями.\nПриятная температура ничего не говорит о силе ультрафиолета."
      - weight: 1
        text: "Надень майку и захвати лёгкую рубашку поверх.\nОна может выручить там, где кондиционер работает за весь район."
    sting:
      - weight: 1
        text: "Где-то скучает один метеоролог."
      - weight: 1
        text: "Та самая погода, которой всем вечно не хватает."
      - weight: 1
        text: "Длинная дорога домой подала убедительную заявку."
      - weight: 1
        text: "У дивана наконец появился серьёзный конкурент."
      - weight: 1
        text: "Вполне можно опоздать на пять минут и сослаться на хороший день."
      - weight: 1
        text: "Даже ждать кого-то на улице сегодня чуть менее обидно."
      - weight: 1
        text: "Плед для пикника просится обратно в дело."
      - weight: 1
