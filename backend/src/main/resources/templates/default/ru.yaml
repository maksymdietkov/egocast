conditions:
  frost:
    intro:
      - weight: 2
        text: "Так, соберись —"
      - weight: 1
        text: "Режим Арктики включён —"
      - weight: 1
        text: "Природа открыла холодильник —"
      - weight: 1
        text: "Это не шутки —"
    advice:
      - weight: 1
        text: "Одевайся по-настоящему: термобельё, свитер, нормальный зимний пуховик.\nЛёгкую куртку сегодня забудь — это погода для выживания, а не для образа."
      - weight: 1
        text: "Тёплый пуховик, утеплённые перчатки, шапка, которая реально закрывает уши.\nИ да, всё сразу — сегодня без компромиссов."
      - weight: 1
        text: "Шарф, перчатки, шапка — полный зимний комплект.\nТёплые носки тоже, если хочешь сохранить пальцы на ногах."
      - weight: 1
        text: "Базовый слой, средний слой, настоящий пуховик — по полной программе.\nОткрытая кожа теряет чувствительность быстро в такую погоду."
    sting:
      - weight: 1
        text: "Сегодня не тот день для лёгкой курточки."
      - weight: 1
        text: "Мода отменяется до особого распоряжения."
      - weight: 1
        text: "Пар изо рта появится раньше, чем остынет кофе."

  cold:
    intro:
      - weight: 3
        text: "Кутайся —"
      - weight: 1
        text: "Внимание —"
      - weight: 1
        text: "Зима ещё не закончила с нами —"
      - weight: 1
        text: "Сегодня без шуток —"
    advice:
      - weight: 1
        text: "На улице холодно — бери тёплый пуховик.\nПерчатки тоже не пропускай, руки потом спасибо не скажут."
      - weight: 1
        text: "Нормальный пуховик плюс шарф — этого хватит.\nСегодня не для курточки, как бы ты ни был закалён."
      - weight: 1
        text: "Одевайся слоями: термо под свитер.\nСверху пуховик, который реально застёгивается до конца."
      - weight: 1
        text: "Пуховик, шапка, что-то на шею.\nВетер найдёт любую щель, которую ты оставишь открытой."
    sting:
      - weight: 1
        text: "Кофе помогает. Проверено на себе."
      - weight: 1
        text: "Летнюю курточку сегодня не зовут."
      - weight: 1
        text: "Уши важнее образа — надень шапку."

  chilly:
    intro:
      - weight: 2
        text: "Заметно похолодало —"
      - weight: 1
        text: "Слегка бодрит —"
      - weight: 1
        text: "Резко остывает —"
    advice:
      - weight: 1
        text: "Куртка средней плотности или толстый свитер под курткой сработает.\nГолые руки начнут ныть минут через десять."
      - weight: 1
        text: "Накинь шарф и утеплённую куртку.\nПерчатки тоже, если быстро мёрзнешь."
      - weight: 1
        text: "Это территория «шарф плюс куртка».\nНичего драматичного, просто не выходи в футболке."
    sting:
      - weight: 1
        text: "Не мороз, но уши всё равно пожалуются."
      - weight: 1
        text: "Формально ещё не зима. Расскажи это ветру."

  cool:
    intro:
      - weight: 2
        text: "Не так уж плохо —"
      - weight: 1
        text: "Лёгкая прохлада —"
      - weight: 1
        text: "Ничего драматичного —"
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит с головой.\nМожно ещё шарф, если чувствителен к ветру."
      - weight: 1
        text: "Худи или лёгкой куртки достаточно.\nТяжёлый пуховик не нужен — прибереги его на попозже."
      - weight: 1
        text: "Футболка под курткой — рабочий вариант.\nМожно завязать на поясе, когда потеплеет."
    sting:
      - weight: 1
        text: "Погода для куртки, не для пуховика. Разница есть."
      - weight: 1
        text: "Достаточно комфортно, чтобы забыть, что вообще смотрел прогноз."

  mild:
    intro:
      - weight: 2
        text: "Довольно приятно —"
      - weight: 1
        text: "Лёгкая погода —"
      - weight: 1
        text: "Ничего особенного планировать не нужно —"
    advice:
      - weight: 1
        text: "Лёгкой куртки или рубашки с длинным рукавом хватит.\nНе нужно ничего усложнять сегодня."
      - weight: 1
        text: "Погода для кардигана — комфортно, без драмы.\nТяжёлые слои сегодня пропускаем полностью."
      - weight: 1
        text: "Подойдёт всё чистое и удобное.\nМожно взять лёгкий слой на вечер, на всякий случай."
    sting:
      - weight: 1
        text: "Такой день, на который погодном приложению нечего жаловаться."
      - weight: 1
        text: "Наслаждайся — такие дни не часто случаются."

  comfortable:
    intro:
      - weight: 2
        text: "Хорошо на улице —"
      - weight: 1
        text: "Примерно идеальная погода —"
      - weight: 1
        text: "Погода из учебника —"
    advice:
      - weight: 1
        text: "Одевайся сегодня как хочешь.\nФутболка или лёгкая рубашка отлично подойдёт."
      - weight: 1
        text: "Короткий рукав — безопасный выбор.\nМожно захватить лёгкий слой на вечер, на всякий случай."
      - weight: 1
        text: "Это погода-пожатие плечами — подойдёт почти всё.\nРеально неправильных вариантов тут нет."
    sting:
      - weight: 1
        text: "Где-то сейчас скучает синоптик."
      - weight: 1
        text: "Это та погода, которой все жалуются, что не хватает."

  warm:
    intro:
      - weight: 2
        text: "Теплеет —"
      - weight: 1
        text: "Лето стучится —"
      - weight: 1
        text: "Становится жарковато —"
    advice:
      - weight: 1
        text: "Шорты и футболка — твои лучшие друзья сегодня.\nСолнцезащитные очки тоже не помешают."
      - weight: 1
        text: "Только дышащие ткани — хлопок или лён.\nКепка не помешает, если планируешь быть на солнце подольше."
      - weight: 1
        text: "Светлые цвета, лёгкие ткани, всё по-минимуму.\nСлои прибереги на другой сезон."
    sting:
      - weight: 1
        text: "Не забудь солнцезащитный крем — будущий ты скажет спасибо."
      - weight: 1
        text: "Погода для мороженого, если искал повод."

  hot:
    intro:
      - weight: 2
        text: "Ух, жара —"
      - weight: 1
        text: "Настоящее пекло —"
      - weight: 1
        text: "Лето на всю катушку —"
    advice:
      - weight: 1
        text: "Реально жарко — пей побольше воды.\nСамые лёгкие ткани, что есть в шкафу, плюс солнцезащитные очки."
      - weight: 1
        text: "Свободный лён и шляпа с широкими полями.\nСолнцезащитный крем сегодня обязателен, без вариантов."
      - weight: 1
        text: "Самая светлая и лёгкая одежда, что найдётся.\nТёмные цвета сегодня превратят тебя в гриль, без исключений."
    sting:
      - weight: 1
        text: "Мороженое сегодня — почти что здоровое питание."
      - weight: 1
        text: "Твоя тень — единственная тень, которая сегодня есть, используй её с умом."
      - weight: 1
        text: "На асфальте к полудню можно было бы жарить яичницу."

  windy_cold:
    intro:
      - weight: 2
        text: "Кутайся —"
      - weight: 1
        text: "Ветер напрашивается на драку —"
      - weight: 1
        text: "Холод с характером —"
      - weight: 1
        text: "Ветер нашёл твоё единственное слабое место —"
    advice:
      - weight: 1
        text: "На улице мороз и ветер.\nВетрозащитная оболочка поверх пуховика точно окупится."
      - weight: 1
        text: "Ветер продувает обычный пуховик насквозь.\nБери что-то с ветрозащитным внешним слоем."
      - weight: 1
        text: "Застегни всё, заправь всё.\nЛюбая щель — это приглашение для ветра, и он с радостью примет."
      - weight: 1
        text: "Такой холод в худи не перетерпеть.\nВетрозащитный пуховик, нормальные перчатки, шапка, которая не улетит."
    sting:
      - weight: 1
        text: "Я предупреждал, не говори потом, что нет."
      - weight: 1
        text: "Сегодня основной урон наносит именно ветер, а не холод сам по себе."
      - weight: 1
        text: "Причёска после зонта сегодня не переживёт эту прогулку."
      - weight: 1
        text: "Где-то сейчас шарф вот-вот станет воздушным змеем."

  windy_frost:
    intro:
      - weight: 2
        text: "Ощущается по-настоящему жёстко —"
      - weight: 1
        text: "Это уже суровое испытание —"
      - weight: 1
        text: "Природа сегодня реально старается —"
      - weight: 1
        text: "Территория обморожения кожи —"
    advice:
      - weight: 1
        text: "Любая щель в одежде — находка для ветра.\nЗакрой всё: высокий воротник, заправленный шарф, перчатки, которые реально сидят."
      - weight: 1
        text: "Ничего свободного, ничего открытого, ничего незакрытого.\nСегодня погода полного покрытия, без компромиссов."
      - weight: 1
        text: "Лицо, уши, руки — закрывай, что можешь.\nОткрытая кожа может онеметь быстрее, чем ты думаешь."
      - weight: 1
        text: "Тут нужен самый тёплый пуховик, обязательно с ветрозащитным слоем.\nЕсли можешь отложить выход на улицу — отложи."
    sting:
      - weight: 1
        text: "Открытая кожа сегодня не в повестке."
      - weight: 1
        text: "Это тот холод, у которого есть мнение по поводу твоего гардероба."
      - weight: 1
        text: "Лицо онемеет раньше, чем остынет кофе."
      - weight: 1
        text: "Цифра с учётом ветра — это не рекомендация, а требование."

  windy_hot:
    intro:
      - weight: 2
        text: "Хотя бы есть ветерок —"
      - weight: 1
        text: "Единственный плюс — ветер —"
      - weight: 1
        text: "Жарко, но хотя бы движется воздух —"
      - weight: 1
        text: "Ветер пытается помочь —"
    advice:
      - weight: 1
        text: "Всё равно носи лёгкие ткани.\nШляпу сегодня, возможно, получится и не надевать — спасибо ветерку."
      - weight: 1
        text: "Ветер немного сбивает жару, но она никуда не делась.\nСолнцезащитный крем не пропускай просто потому что стало прохладнее на ощупь."
      - weight: 1
        text: "Свободная дышащая одежда — лучший выбор сегодня.\nТолько следи за шляпой — ветру она нужна больше, чем тебе."
      - weight: 1
        text: "Ощущается легче, чем должно быть, спасибо ветру.\nА вот УФ от этого слабее не стал."
    sting:
      - weight: 1
        text: "Ветер — приятное отвлечение, а не замена солнцезащитному крему."
      - weight: 1
        text: "Ощущается прохладнее, чем есть на самом деле — солнце об этом не в курсе."
      - weight: 1
        text: "Наслаждайся ветром, сегодня он тебе делает одолжение."
      - weight: 1
        text: "Держи шляпу крепче. В прямом смысле."

  rain:
    intro:
      - weight: 2
        text: "Бери зонт —"
      - weight: 1
        text: "Немного моросит —"
      - weight: 1
        text: "На улице мокро —"
      - weight: 1
        text: "Небо подтекает —"
    advice:
      - weight: 1
        text: "Лёгкого дождевика или куртки с капюшоном хватит, чтобы остаться сухим.\nНичего сложного сегодня не требуется."
      - weight: 1
        text: "Водонепроницаемая обувь того стоит.\nНе доверяй куртке, которая «водоотталкивающая» только на словах."
      - weight: 1
        text: "Зонт плюс капюшон — хорошая комбинация.\nНоски скажут спасибо в любом случае."
      - weight: 1
        text: "Возьми что-то непромокаемое и не переживай особо.\nЭто больше раздражает, чем реально опасно."
    sting:
      - weight: 1
        text: "Лужи найдут твои носки. Всегда находят."
      - weight: 1
        text: "Где-то там кто-то забыл зонт. Постарайся не быть этим человеком."
      - weight: 1
        text: "Отличная погода, чтобы притвориться, будто есть куда пойти в тепле."
      - weight: 1
        text: "У твоей причёски сегодня свои планы."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это уже не морось —"
      - weight: 1
        text: "Настоящий ливень —"
      - weight: 1
        text: "Держись крепче —"
      - weight: 1
        text: "Небо забило на всякую сдержанность —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, водонепроницаемая обувь и зонт, который выдержит ветер.\nДождевик-пончо сегодня не будет перебором."
      - weight: 1
        text: "Всё водонепроницаемое: куртка, обувь, чехол на сумку, если носишь.\nОбычный зонт может сегодня проиграть эту схватку."
      - weight: 1
        text: "Если идёшь пешком куда-то — одевайся полностью в дождевую экипировку.\nПоловинчатые меры значит промокнуть наполовину, но всё равно неприятно."
      - weight: 1
        text: "Ботинки, капюшон и сумка, которая переживёт ливень.\nСегодня точно не день для замши."
    sting:
      - weight: 1
        text: "Считай это намёком природы поработать сегодня из дома."
      - weight: 1
        text: "Даже утки сегодня не впечатлены."
      - weight: 1
        text: "Твой зонт сегодня стал частью личности."
      - weight: 1
        text: "Где-то сейчас подвал тихо жалеет о своих жизненных выборах."

  snow:
    intro:
      - weight: 2
        text: "Идёт снег —"
      - weight: 1
        text: "Зимняя сказка, или просто неудобство —"
      - weight: 1
        text: "Сыпет с неба —"
      - weight: 1
        text: "Всё белым-бело —"
    advice:
      - weight: 1
        text: "Ботинки с настоящим протектором, утеплённые перчатки и шапка.\nСлякоть тебе не друг, каким бы красивым ни казался снег."
      - weight: 1
        text: "Одевайся слоями под непромокаемым пуховиком.\nПоменяй обычную обувь на что-то с нормальным сцеплением."
      - weight: 1
        text: "Тепло от макушки до пяток сегодня — обязательная программа.\nХорошие ботинки важнее хорошего пуховика сегодня."
      - weight: 1
        text: "Важнее хорошая обувь, чем хороший пуховик.\nПадение на льду — так себе начало дня."
    sting:
      - weight: 1
        text: "Красиво из окна, менее красиво, когда попадает в ботинок."
      - weight: 1
        text: "Кто-то сегодня слепит снеговика. Вероятно, не ты."
      - weight: 1
        text: "Сегодня сцепление важнее стиля, без обсуждений."
      - weight: 1
        text: "Тротуары ещё не в курсе плана."

  storm:
    intro:
      - weight: 2
        text: "Надвигается шторм —"
      - weight: 1
        text: "Сегодня не для прогулок —"
      - weight: 1
        text: "Держись за что-нибудь —"
      - weight: 1
        text: "Небо сегодня в ударе —"
    advice:
      - weight: 1
        text: "Если можешь остаться дома — оставайся.\nЕсли нет — нормальная водонепроницаемая куртка и крепкая обувь, зонт пропускай, его всё равно вывернет наизнанку."
      - weight: 1
        text: "Закрепи всё, надень что-то водонепроницаемое и ветрозащитное.\nОткрытые зонты сегодня полностью пропускаем — ветер побеждает всегда."
      - weight: 1
        text: "Сегодня хватай сумку и иди, без задержек на улице.\nПолностью непромокаемая экипировка, если совсем нужно быть снаружи."
      - weight: 1
        text: "Пропускай всё, что не готов потерять от ветра.\nКрепкий капюшон сегодня надёжнее зонта в любой момент."
    sting:
      - weight: 1
        text: "Твой зонт это не переживёт. Оставь его дома."
      - weight: 1
        text: "Сегодня день для того, чтобы остаться дома с чаем."
      - weight: 1
        text: "Даже деревьям сегодня несладко."
      - weight: 1
        text: "Природа-мать явно не в настроении для тонких намёков."

expand:
  trigger:
    - "не веришь? вот скучная правда"