conditions:
  frost:
    intro:
      - weight: 2
        text: "Эй, там, блядь, минус."
      - weight: 1
        text: "Слушай сюда, долбоёб."
      - weight: 1
        text: "Ну что, самоуверенный хер, вернём тебя в реальность."
      - weight: 1
        text: "Эй, зима сегодня собралась надрать тебе жопу."
      - weight: 1
        text: "Так, долбоящер, сводка погоды."
      - weight: 1
        text: "А теперь внимание, ёбаный ты кадр."
      - weight: 1
        text: "Пару слов, бесстрашный ты еблан."
      - weight: 1
        text: "Уши навострил, говнюк."
      - weight: 1
        text: "Братан, расклад, сука, такой."
      - weight: 1
        text: "Погоди, феерический ты долбоёб."
    advice:
      - weight: 1
        text: "Надень нормальную, блядь, зимнюю куртку, а не ту модную хуйню, которую ты так любишь.\nШапку, перчатки, шарф — всё сразу, не выёбывайся."
      - weight: 1
        text: "Термобельё, свитер, настоящая зимняя куртка — это, нахуй, программа минимум.\nПойдёшь без шапки — отморозишь уши, долбоёб ты законченный."
      - weight: 1
        text: "Сегодня полная экипировка: тёплая куртка, перчатки, шапка на уши.\nТы не бессмертный, блядь, терминатор, обморожению на твои понты похуй."
      - weight: 1
        text: "Одевайся слоями или сиди, нахуй, дома.\nТермоноски тоже надень — не надо морозить пальцы ради образа крутого мудака."
      - weight: 1
        text: "Обувай утеплённые ботинки с цепкой подошвой и одевайся по-зимнему.\nГладкая подошва на мёрзлом тротуаре? Ну давай, познакомь ебало с асфальтом."
      - weight: 1
        text: "Под штаны надень термокальсоны, сверху — тёплую парку.\nВ твоих рваных джинсах, блядь, вентиляционные отверстия, гений."
      - weight: 1
        text: "Поверх флиса и термобелья надень непродуваемую куртку.\nУзнавать, что одежда говно, по сквозняку вдоль позвоночника — удовольствие так себе."
      - weight: 1
        text: "Надень варежки, утеплённую куртку и плотно сидящую шапку.\nГолыми пальцами ты нихуя не докажешь, только прогулку себе испортишь."
      - weight: 1
        text: "К тёплой куртке и утеплённым штанам добавь бафф на шею.\nПрикрой щели у воротника, ходячая ты, блядь, утечка тепла."
      - weight: 1
        text: "Вниз — влагоотводящее термобельё, сверху — несколько тёплых слоёв, которые можно снять.\nРасстегнись до того, как всё пропотеет, мокрый ты засранец."
    sting:
      - weight: 1
        text: "Выйдешь раздетым — отморозишь свою дурную жопу, чемпион."
      - weight: 1
        text: "Сегодня не день мериться крутостью, надень, блядь, куртку."
      - weight: 1
        text: "Повторять не буду, упрямый ты долбоёб."
      - weight: 1
        text: "Твои соски не должны, блядь, стекло резать."
      - weight: 1
        text: "От двери до машины ты, братан, очень спортивно съебался."
      - weight: 1
        text: "Даже твои хуёвые решения сегодня предпочли бы остаться дома."
      - weight: 1
        text: "Причёску проверил трижды, прогноз — ни разу, самовлюблённый ты хер."
      - weight: 1
        text: "Приложение говорит мороз, последняя извилина — шорты, охуенно сложный выбор."
      - weight: 1
        text: "Если бы от нытья становилось теплее, ты бы работал ёбаной котельной."
      - weight: 1
        text: "Свежего воздуха захотел, мудак? Добро пожаловать в морозилку."

  cold:
    intro:
      - weight: 2
        text: "Эй, укутывайся, нахуй."
      - weight: 1
        text: "Внимание, герой, если у тебя кроме понтов ещё и мозги есть."
      - weight: 1
        text: "Слушай, блядь, сюда."
      - weight: 1
        text: "Так, хоть раз сосредоточься, долбоёб."
      - weight: 1
        text: "Братан, включи уже ёбаные мозги."
      - weight: 1
        text: "Ну что, ходячий пиздец."
      - weight: 1
        text: "Расклад такой, хер ты бестолковый."
      - weight: 1
        text: "Эй, перестань на секунду страдать хуйнёй."
      - weight: 1
        text: "Прогноз для тебя, бестолковый засранец."
      - weight: 1
        text: "Так, объясняю по-простому, блядь."
    advice:
      - weight: 1
        text: "Тёплая куртка, без ёбаных отговорок.\nИ перчатки, если не хочешь через час охуевать от боли в руках."
      - weight: 1
        text: "Нормальная куртка и шарф — вот и вся, блядь, задача.\nВ тонкой курточке сегодня делать нехуй, не испытывай судьбу, дурень."
      - weight: 1
        text: "Термокофта, свитер и куртка, которая реально застёгивается.\nНе будь тем долбоёбом, который трясётся на углу и пиздит, что ему нормально."
      - weight: 1
        text: "Куртку, шапку, на шею что-нибудь.\nХолод залезет в каждую щель, которую тебе было лень закрыть, гений хуев."
      - weight: 1
        text: "К тёплой куртке надень утеплённые брюки.\nТонкие чиносы для стояния на остановке — выбор, прямо скажем, хуёвый."
      - weight: 1
        text: "К тёплой одежде добавь закрытую обувь и носки с шерстью.\nЩиколотки прикрой, ёбаная ты фотомодель."
      - weight: 1
        text: "Под непродуваемую куртку надень флиску.\nЧерез крупную вязку ветер свистит только в путь, дырявая она, блядь, зараза."
      - weight: 1
        text: "Для неспешной прогулки выбирай длинную утеплённую куртку.\nТвоя жопа не обязана отдуваться за всех и мёрзнуть в одиночку."
      - weight: 1
        text: "Надень тонкую термокофту, сверху кофту на молнии и куртку.\nСогрелся — расстегни слой, не жди, пока всё, нахуй, пропотеет."
      - weight: 1
        text: "Поверх свитшота надень свободную куртку и добавь лёгкие перчатки.\nРукава пережимают руки — бери размер больше, не изображай долбоёба в вакуумной упаковке."
    sting:
      - weight: 1
        text: "Кофе твою жопу не спасёт, а ёбаная куртка — вполне."
      - weight: 1
        text: "Твоя сраная летняя курточка сегодня остаётся дома, разговор, нахуй, окончен."
      - weight: 1
        text: "Уши мёрзнут первыми, долбоёб, надень ёбаную шапку."
      - weight: 1
        text: "Всем похуй, как героически тебе некомфортно."
      - weight: 1
        text: "Одеваешься на погоду своей мечты, а потом ноешь про настоящую, заебись логика."
      - weight: 1
        text: "Надеюсь, сквозь стучащие зубы ты там спасибо бормочешь, неблагодарный засранец."
      - weight: 1
        text: "Выглянуть в окно — это не температуру, блядь, измерить."
      - weight: 1
        text: "Плейлист выбирал двадцать минут, одевался двенадцать секунд, долбоёб."
      - weight: 1
        text: "Вся твоя зимняя стратегия — быстрее идти? Охуительный план."
      - weight: 1
        text: "В анкете пишешь «люблю природу», а на ебале — «да ну нахуй»."

  chilly:
    intro:
      - weight: 2
        text: "Эй, холодает, блядь."
      - weight: 1
        text: "Свежо, сука, становится, слушай."
      - weight: 1
        text: "Эй, внимание сюда, блядь."
      - weight: 1
        text: "Братан, маленькое, сука, предупреждение."
      - weight: 1
        text: "Так, рассеянный ты засранец."
      - weight: 1
        text: "Одна полезная мысль для твоей дурной башки."
      - weight: 1
        text: "Эй, отложи уже ёбаный телефон."
      - weight: 1
        text: "Давай тебя соберём, говнюк."
      - weight: 1
        text: "Так, сегодняшняя, блядь, сводка."
      - weight: 1
        text: "Минуту внимания, выдающийся ты мудак."
    advice:
      - weight: 1
        text: "Нормальная куртка, а если тонкая — под неё плотный свитер, вот и всё.\nПойдёшь с голыми руками — через десять минут начнёшь скулить, как мелкая сучка."
      - weight: 1
        text: "Шарф и настоящая куртка, а не эта хлипкая хуета вместо ветровки.\nРуки мёрзнут — надевай перчатки, долбоёб, тут не диссертацию защищать."
      - weight: 1
        text: "Шарф сегодня в тему, ничего, блядь, сложного — только не выходи в одной футболке.\nВыйдешь — обосру от души."
      - weight: 1
        text: "Надень свитшот под лёгкую утеплённую куртку.\nСогрелся — расстегнись, а не маринуйся в собственном ёбаном поту."
      - weight: 1
        text: "Надень длинные брюки и закрытую обувь с носками.\nНехуй устраивать щиколоткам отдельную прогулку на свежем воздухе."
      - weight: 1
        text: "Надень флиску, а сверху непродуваемую куртку.\nЧерез голый флис ветер пройдёт как к себе, нахуй, домой."
      - weight: 1
        text: "Под куртку надень лонгслив и худи на молнии.\nКапюшон держи наготове, если уши начнут возмущаться этой хуйнёй."
      - weight: 1
        text: "Под рубашку надень тонкое термобельё, сверху — плотную рубашку-куртку.\nДля быстрой ходьбы съёмные слои лучше одного потного ёбаного кокона."
      - weight: 1
        text: "Если собираешься сидеть на улице, надень плотный джемпер и лёгкое пальто.\nПерестал двигаться — остываешь, бестолковый ты хер."
      - weight: 1
        text: "Выбирай куртку с прилегающими манжетами и застёгивающимся воротником.\nОставишь всё нараспашку — считай, купил платную вентиляцию пузу, долбоёб."
    sting:
      - weight: 1
        text: "Не мороз, но ушам всё равно напинают, смирись, блядь."
      - weight: 1
        text: "Объясни ветру, что «вообще-то ещё не зима», умник хуев, посмотрим, насколько ему не похуй."
      - weight: 1
        text: "Даже мурашки на твоей коже лучше тебя в обстановке разбираются, долбоёб."
      - weight: 1
        text: "Конечно, закажи ещё пива на улице, вдруг к следующему подключат ёбаное отопление."
      - weight: 1
        text: "Солнце сегодня чисто для красоты, доверчивый ты засранец."
      - weight: 1
        text: "Ты сказал «на пять минут» сорок, блядь, минут назад."
      - weight: 1
        text: "Стоять с кислым ебалом и обнимать себя — смелая замена прогнозу погоды."
      - weight: 1
        text: "Слова кореша «там заебись» — это не гарантийный талон."
      - weight: 1
        text: "Поздравляю, превратил нормальную прогулку в личную, блядь, трагедию."
      - weight: 1
        text: "Три зарядки взял, кофту — нет, охуенно подготовился, долбоёб."

  cool:
    intro:
      - weight: 2
        text: "Погода ничего, но слушай, блядь, сюда."
      - weight: 1
        text: "Слегка прохладно, так что внимание, долбоёб."
      - weight: 1
        text: "Так, только без спектакля, маленький ты засранец."
      - weight: 1
        text: "Братан, держи ёбаное обновление."
      - weight: 1
        text: "Пару слов, нерешительный ты хер."
      - weight: 1
        text: "Так, соберись уже, блядь."
      - weight: 1
        text: "Эй, подключись на секунду, долбоящер."
      - weight: 1
        text: "Давай определимся, привередливый ты мудак."
      - weight: 1
        text: "Так, немного подсказок твоей бестолковой жопе."
      - weight: 1
        text: "Ежедневная сводка, ёб твою мать."
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит.\nШарф по желанию, долбоёб, ты не через ёбаную Сибирь пешком идёшь."
      - weight: 1
        text: "Худи или лёгкая куртка — за глаза.\nТяжёлое пальто оставь дома, король драмы, никто твою жопу замораживать не собирается."
      - weight: 1
        text: "Футболка под куртку — готово.\nСтанет тепло — повяжи куртку на пояс, попробуй вести себя как взрослый, блядь, человек."
      - weight: 1
        text: "Надень лонгслив, чиносы и кроссовки.\nМерзлявый — добавь тонкую кофту, своё-то тело ты, блядь, знаешь."
      - weight: 1
        text: "Поверх хлопковой футболки накинь расстёгнутую плотную рубашку.\nВ тени застегни её вместо объявления ёбаной климатической катастрофы."
      - weight: 1
        text: "Надень тонкий джемпер и обычные брюки.\nТермобельё не нужно, если ты не собрался стоять, блядь, столбом."
      - weight: 1
        text: "Для велосипеда надень дышащую ветровку поверх тонкой термокофты.\nНа подъёмах расстёгивайся, пока спина не превратилась в ёбаное болото."
      - weight: 1
        text: "Поверх рубашки с коротким рукавом надень кардиган.\nВ помещении сними его, упрямый ты хер, он для этого и расстёгивается."
      - weight: 1
        text: "Надень лёгкий свитшот, джинсы и носки.\nГолые щиколотки не обязательны, даже если у манекена в магазине так, долбоёб."
      - weight: 1
        text: "Если будешь сидеть на улице, надень тонкую флиску поверх футболки.\nСтул в кафе вырабатывает ровно нихуя тепла."
    sting:
      - weight: 1
        text: "Погода для куртки, а не для ёбаной полярной экспедиции, научись различать."
      - weight: 1
        text: "Настолько комфортно, что нехуй было вообще спрашивать меня, что надеть."
      - weight: 1
        text: "Ты бутерброд, блядь, и то с большими муками выбирал."
      - weight: 1
        text: "Погода ведёт себя адекватно, попробуй и ты, нахуй."
      - weight: 1
        text: "Где-то собака уже готова гулять и ждёт, пока твоя жопа определится."
      - weight: 1
        text: "Четыре погодных приложения проверил в надежде, что одно тебя оденет, ленивый ты хуй."
      - weight: 1
        text: "В шкафу двенадцать вариантов, и только ты — тринадцатая, блядь, проблема."
      - weight: 1
        text: "Такими темпами твои планы на прогулку скоро станут историческим пиздежом."
      - weight: 1
        text: "Чтобы мусор вынести, ёбаный показ мод не нужен."
      - weight: 1
        text: "Дверь ещё открывается, долбоёб, попробуй."

  mild:
    intro:
      - weight: 2
        text: "Заебись денёк, не усложняй."
      - weight: 1
        text: "Погода простая, так что слушай, блядь."
      - weight: 1
        text: "Вообще не о чем париться, ёб твою мать."
      - weight: 1
        text: "Ну что, любимое ты ходячее несчастье."
      - weight: 1
        text: "Братан, обстановка такая."
      - weight: 1
        text: "Время сводки, нетерпеливый ты хер."
      - weight: 1
        text: "Давай уже вытащим твою жопу на улицу."
      - weight: 1
        text: "Секунду, рассеянный ты мудак."
      - weight: 1
        text: "Так, долбоёб, делаем следующее."
      - weight: 1
        text: "Слово твоему любимому засранцу."
    advice:
      - weight: 1
        text: "Лёгкая куртка или длинный рукав — всё, блядь.\nХватит переспрашивать, сам знаешь, как одеться, бесполезный ты умник хуев."
      - weight: 1
        text: "Погода для кардигана, без ёбаной драмы.\nВсё тяжёлое барахло оставь в шкафу, там ему и место."
      - weight: 1
        text: "Сегодня сойдёт любая чистая, блядь, одежда.\nНа потом захвати лёгкую кофту, так, на всякий случай, умник."
      - weight: 1
        text: "Надень хлопковую футболку, чиносы и удобные кроссовки.\nНе надо выбирать обувь, которую захочется содрать к хуям на половине прогулки."
      - weight: 1
        text: "Поверх футболки накинь тонкую рубашку.\nСогреешься — закатай рукава, приспособишься как-нибудь, засранец."
      - weight: 1
        text: "Выбирай дышащее поло и лёгкие брюки.\nТолстую флиску прибереги для погоды, когда она реально, блядь, нужна."
      - weight: 1
        text: "Надень свободную рубашку с длинным рукавом и джинсы.\nОставь себе место двигаться, не надо наряжаться ёбаной сарделькой."
      - weight: 1
        text: "Надень влагоотводящую футболку и эластичные прогулочные брюки.\nСобрался в гору — обойдись без плотного хлопка, который копит твой ёбаный пот."
      - weight: 1
        text: "Поверх майки надень тонкий джемпер, вниз — привычные штаны.\nВ помещении джемпер сними, прежде чем начнёшь хуесосить отопление."
      - weight: 1
        text: "Выбирай футболку, укороченные брюки и кеды с носками.\nНовую дубовую обувь разносишь в другой раз, охотник за ёбаными мозолями."
    sting:
      - weight: 1
        text: "Сегодня даже мне до тебя, блядь, доебаться не с чем."
      - weight: 1
        text: "Наслаждайся хорошей погодой, везучий ты засранец, надолго этой хуйни не хватит."
      - weight: 1
        text: "В кои-то веки прогноз проще твоего ёбаного заказа на обед."
      - weight: 1
        text: "Идеальная погода для прогулки, которую ты откладываешь с ёбаного февраля."
      - weight: 1
        text: "Попробуй просто порадоваться, не выясняя сразу, когда всё закончится, тревожный ты хер."
      - weight: 1
        text: "Диван уже достаточно попользовался твоей жопой."
      - weight: 1
