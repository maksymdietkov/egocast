      - weight: 1
        text: "Куртка с капюшоном, которая реально не пропускает воду, плюс шапка.\nМожешь остаться дома — оставайся, нахуй, дома."
      - weight: 1
        text: "Всё непромокаемое: куртка, обувь, чехол на рюкзак.\nПромокнуть и замёрзнуть — сочетание хуёвое, поверь."
      - weight: 1
        text: "Под непромокаемые верхние штаны надень термокальсоны и тёплые брюки.\nНаружные штанины оставь поверх ботинок, нехуй устраивать в них водосток."
      - weight: 1
        text: "Надень влагоотводящее термобельё, флиску и куртку с проклеенными швами.\nОставь место двигаться и не сминай утеплитель, набитый ты засранец."
      - weight: 1
        text: "Выбирай утеплённые непромокаемые перчатки с длинными манжетами под рукавами дождевика.\nСухую сменную пару упакуй герметично, онемевшие руки, блядь, бесполезны."
      - weight: 1
        text: "Надень тонкую шерстяную шапку под капюшон с жёстким козырьком.\nНастрой боковой обзор, машины не остановятся из-за твоих ёбаных шор."
      - weight: 1
        text: "Обувай просторные непромокаемые ботинки с глубоким протектором и носки с шерстью.\nСтоячую воду обходи, одежда не отменяет ёбаную яму, которой не видно."
      - weight: 1
        text: "Выбирай утеплённую непромокаемую куртку с высоким воротником и закрытой молнией.\nНачало сильно трясти — ищи укрытие, это не ёбаный кастинг на выносливость."
      - weight: 1
        text: "Поверх тёплой одежды надень яркий дождевой комплект со светоотражающими вставками.\nСделай так, чтобы тебя было видно сквозь брызги, неконтрастный ты долбоёб."
    sting:
      - weight: 1
        text: "Остаться дома сейчас выглядит очень умным решением, гений хуев."
      - weight: 1
        text: "Замшевая обувь остаётся дома, без ёбаных обсуждений."
      - weight: 1
        text: "Замёрзший, промокший и упрямый, охуенный набор, чемпион."
      - weight: 1
        text: "Входная дверь ещё никогда не приводила таких, блядь, убедительных аргументов."
      - weight: 1
        text: "К значку этой погоды нужны средний палец и ёбаная кнопка возврата денег."
      - weight: 1
        text: "Офисная батарея сейчас станет всеобщим, блядь, источником душевной поддержки."
      - weight: 1
        text: "Каждое рукопожатие сегодня — будто здороваешься с ёбаным торговцем рыбой."
      - weight: 1
        text: "В карманах откуда-то холодный суп, невезучий ты мудак."
      - weight: 1
        text: "Этот жизнерадостный шагомер сегодня может заткнуться нахуй."
      - weight: 1
        text: "Кто сказал, что это закаляет характер, пусть выйдет и закалит себе что-нибудь, блядь, сам."

  snow:
    intro:
      - weight: 2
        text: "Снег, блядь, идёт, слушай."
      - weight: 1
        text: "Валит нехило, так что внимание, нахуй."
      - weight: 1
        text: "Там всё белое, блядь, долбоёб."
      - weight: 1
        text: "Братан, держи ёбаную сводку."
      - weight: 1
        text: "Эй, сосредоточься, безрассудный ты засранец."
      - weight: 1
        text: "Так, пару слов перед выходом, долбоёб."
      - weight: 1
        text: "Давай разберёмся с твоей хуйнёй."
      - weight: 1
        text: "Так, рассеянный ты мудак."
      - weight: 1
        text: "Короткая сводка для твоей бестолковой жопы."
      - weight: 1
        text: "Слушай внимательно, самоуверенный ты хер."
    advice:
      - weight: 1
        text: "Непромокаемые ботинки с нормальным сцеплением, утеплённые перчатки и шапка.\nСлякоть — мерзкая ёбаная жижа, как бы красиво она ни выглядела, долбоёб."
      - weight: 1
        text: "Надень несколько тёплых слоёв под непромокаемую куртку.\nИ обуйся в то, что, блядь, держится за землю."
      - weight: 1
        text: "Одевайся тепло и непромокаемо, начиная с ботинок.\nЭта красота быстро станет слякотью, не порть хорошую обувь за нехуй делать."
      - weight: 1
        text: "Под зимние брюки с защитой от воды надень термокальсоны.\nПодбери болтающиеся штанины, пока они не собрали половину ёбаной улицы."
      - weight: 1
        text: "Надень носки с шерстью и просторные утеплённые ботинки.\nОставь пальцам место, пережимать их до онемения — самому себе, блядь, гадить."
      - weight: 1
        text: "Под верхнюю куртку надень влагоотводящее термобельё и флиску.\nЧистишь снег — открой вентиляцию, пока не вспотел как ёбаный конь."
      - weight: 1
        text: "Под регулируемый капюшон натяни плотно сидящую шапку на уши.\nПеред входом стряхни снег, если не хочешь ёбаный ледяной душ за шиворот."
      - weight: 1
        text: "Надень утеплённые варежки с длинными манжетами поверх рукавов.\nБудешь возиться со снегом — возьми сухую пару, мокрые руки за труды — награда хуёвая."
      - weight: 1
        text: "Поверх тёплых слоёв надень яркую одежду со светоотражающими деталями.\nДай водителям шанс заметить тебя сквозь снег, замаскированный ты еблан."
      - weight: 1
        text: "Для глубокого снега надень защитные гамаши поверх непромокаемых ботинок.\nЗастегни нормально, пока каждый шаг не начал набивать обувь ёбаным льдом."
    sting:
      - weight: 1
        text: "Через окно красиво, а в ботинке — хуета, долбоёб."
      - weight: 1
        text: "Сегодня сцепление важнее стиля, без ёбаных споров."
      - weight: 1
        text: "Тротуар всё ещё скользкий, блядь, гений, смотри под ноги, пока ебалом в асфальт не приехал."
      - weight: 1
        text: "Под невинным белым бугорком может быть бордюр, собачье говно или твоё следующее хуёвое решение."
      - weight: 1
        text: "Поздравляю, вместо машины у тебя теперь ёбаные раскопки."
      - weight: 1
        text: "Первый снежок — дружба, снежок за шиворот — уже ёбаное объявление войны."
      - weight: 1
        text: "По следам ты увереннее в себе, чем позволяет твоё чувство равновесия, блядь."
      - weight: 1
        text: "Приятный хруст под ногами, а следом сосед кого-то кроет хуями, красота."
      - weight: 1
        text: "У снеговика вместо мозгов морковка, а подготовился он всё равно лучше твоей жопы."
      - weight: 1
        text: "Лопата у двери, ленивый ты хер, взглядом дорожку не расчистишь."

  storm:
    intro:
      - weight: 2
        text: "Ёбаная буря надвигается, слушай."
      - weight: 1
        text: "Сегодня не день для прогулочек, блядь, долбоёб."
      - weight: 1
        text: "Держись за что-нибудь, ёб твою мать."
      - weight: 1
        text: "Братан, отнесись к этой хуйне серьёзно."
      - weight: 1
        text: "Так, соберись, безрассудный ты засранец."
      - weight: 1
        text: "Эй, держи ёбаный инструктаж."
      - weight: 1
        text: "Слушай внимательно, упрямый ты хер."
      - weight: 1
        text: "Прежде чем натворишь хуйни, мудак."
      - weight: 1
        text: "Так, вытащи голову из жопы."
      - weight: 1
        text: "Вот что тебе нужно, блядь, знать."
    advice:
      - weight: 1
        text: "Можешь — сиди, нахуй, дома, серьёзно.\nНе можешь — непромокаемая куртка, крепкая обувь, зонт оставь дома."
      - weight: 1
        text: "Закрепи своё барахло и надень непродуваемую непромокаемую одежду.\nРаскрытый зонт разъебёт, не будь долбоёбом."
      - weight: 1
        text: "Собирай вещи и двигай — нехуй сегодня торчать на улице.\nЕсли уж совсем надо выйти, защищайся от воды с головы до ног."
      - weight: 1
        text: "Надень дождевую куртку по размеру с регулируемым капюшоном и надёжно сидящую обувь.\nУслышишь гром — иди в капитальное здание или закрытую машину, а не под ёбаное дерево."
      - weight: 1
        text: "Если выход неизбежен, надень непромокаемые брюки и ботинки с глубоким протектором.\nУвидишь затопление — разворачивайся, одежда не превращает тебя в ёбаный спасательный катер."
      - weight: 1
        text: "Надень яркую верхнюю одежду со светоотражающими деталями и нескользкую обувь.\nДержись подальше от дорожных брызг и движущихся машин, хрен тебя заметишь."
      - weight: 1
        text: "Надень непромокаемую куртку с капюшоном, плотными манжетами и убранными шнурками.\nОбходи строительные леса и болтающиеся вывески, куртка от падающей хуйни не спасает."
      - weight: 1
        text: "Поверх быстросохнущей футболки и слоёв по температуре надень дышащую штормовую куртку.\nДо выхода проверь местные предупреждения, а не свой ёбаный осмотр из окна."
      - weight: 1
        text: "Обувай надёжно сидящие ботинки и надевай дождевик с капюшоном, не закрывающим обзор.\nОставь руки свободными для равновесия, телефон хоть раз может заткнуться нахуй."
      - weight: 1
        text: "Надень непромокаемую одежду по размеру, без свободных накидок и свисающих шарфов.\nНе суйся на открытые гребни и к воде, искатель ёбаных приключений."
    sting:
      - weight: 1
        text: "Твой зонт эту хуйню не переживёт, оставь его, нахуй, дома, гений."
      - weight: 1
        text: "Сегодня день из серии «сиди, нахуй, дома с чаем», улови намёк."
      - weight: 1
        text: "Мать-природа сегодня явно охуенно не в духе."
      - weight: 1
        text: "Твоя садовая мебель, похоже, решила налетать себе ёбаные бонусные мили."
      - weight: 1
        text: "Мусорный бак уже на полпути по улице и живёт свою лучшую ёбаную жизнь."
      - weight: 1
        text: "Этот раскат грома только что закончил твой спор «да не так уж там и хуёво»."
      - weight: 1
        text: "Деревья и без тебя машут вовсю, нехуй им махать в ответ."
      - weight: 1
        text: "Колокольчик на балконе превратился в ёбаную сигнализацию."
      - weight: 1
        text: "Кто предложил выпить на крыше, пусть объяснит свой ёбаный ход мыслей в помещении."
      - weight: 1
        text: "Даже камера дверного звонка выглядит так, будто хочет уволиться нахуй."

