conditions:
  frost:
    intro:
      - weight: 2
        text: "Так, бля, слушай сюда —"
      - weight: 1
        text: "Э, гений, проснись —"
      - weight: 1
        text: "Короче, реальность такая —"
      - weight: 1
        text: "Бля, зима не шутит сегодня —"
    advice:
      - weight: 1
        text: "Надевай нормальную куртку, а не эту тряпку для понтов.\nШапка, перчатки, шарф — всё сразу, бля, без обсуждений."
      - weight: 1
        text: "Термуха, свитер, нормальный пуховик — это минимум.\nБез шапки мозги свои простудишь первым делом, дебил."
      - weight: 1
        text: "Полный комплект сегодня: куртка, перчатки, шапка на уши.\nТы не супергерой, обморожение тебя не пощадит, умник."
      - weight: 1
        text: "Одевайся по-человечески или сиди дома, нахуй.\nИ носки тёплые — не геройствуй с пальцами, кретин."
    sting:
      - weight: 1
        text: "Выйдешь раздетым — сам виноват будешь, чемпион."
      - weight: 1
        text: "Не тот день, чтоб понты кидать. Куртку надень, бля."
      - weight: 1
        text: "Я два раза повторять не буду, гений."

  cold:
    intro:
      - weight: 2
        text: "Э, утепляйся давай —"
      - weight: 1
        text: "Слыш, качок —"
      - weight: 1
        text: "Так, слушай —"
      - weight: 1
        text: "Короче, внимание —"
    advice:
      - weight: 1
        text: "Тёплая куртка — не обсуждается.\nПерчатки тоже, руки сам потом вспомнишь, бля."
      - weight: 1
        text: "Нормальная куртка и шарф. Всё, больше ничего не надо.\nВетровка не прокатит, не испытывай судьбу, дурак."
      - weight: 1
        text: "Термуха, свитер, куртка, которая реально застёгивается.\nНе будь тем клоуном, который трясётся на остановке."
      - weight: 1
        text: "Куртка, шапка, что-то на шею.\nХолод найдёт любую дырку, которую ты полениться закрыть."
    sting:
      - weight: 1
        text: "Кофе тебя не спасёт, бля, куртка спасёт."
      - weight: 1
        text: "Летнюю курточку сегодня дома оставь. Разговор окончен."
      - weight: 1
        text: "Уши мёрзнут первыми, тупица — шапку надень."

  chilly:
    intro:
      - weight: 2
        text: "Холодает, слушай —"
      - weight: 1
        text: "Слегка свежо, внимание —"
      - weight: 1
        text: "Э, не отвлекайся —"
    advice:
      - weight: 1
        text: "Приличная куртка или толстый свитер под неё. Вот и всё.\nГолыми руками через десять минут ныть начнёшь, гарантирую."
      - weight: 1
        text: "Шарф и нормальная куртка, не эта ветровка твоя.\nПерчатки, если мёрзнешь быстро, гений, не парься особо."
      - weight: 1
        text: "Погода для шарфа. Ничего драматичного, просто не вылезай в футболке.\nЯ осуждать буду, обещаю."
    sting:
      - weight: 1
        text: "Не мороз, но уши всё равно поныть успеют. Терпи."
      - weight: 1
        text: "Скажи ветру, что 'технически ещё не зима'. Посмотрим, как он отреагирует."

  cool:
    intro:
      - weight: 2
        text: "Неплохо, но слушай —"
      - weight: 1
        text: "Прохладно, внимание —"
      - weight: 1
        text: "Короче, ничего страшного —"
    advice:
      - weight: 1
        text: "Лёгкая куртка — и норм.\nШарф по желанию, гений, ты там не помрёшь."
      - weight: 1
        text: "Худи или лёгкая куртка, этого хватит.\nТёплую куртку побереги, не нужна она тебе, драматург."
      - weight: 1
        text: "Футболка под куртку — и порядок.\nЗавяжешь на поясе, если потеплеет, как взрослый человек."
    sting:
      - weight: 1
        text: "Погода для куртки. Не для пуховика. Разницу выучи."
      - weight: 1
        text: "Настолько комфортно, что у тебя не было повода это проверять."

  mild:
    intro:
      - weight: 2
        text: "Норм денёк, не выёбывайся —"
      - weight: 1
        text: "Лёгкая погода, слушай —"
      - weight: 1
        text: "Короче, не парься —"
    advice:
      - weight: 1
        text: "Лёгкая куртка или длинный рукав, вот и всё.\nХватит спрашивать, ты сам знаешь, как одеваться, гений."
      - weight: 1
        text: "Погода для кардигана. Ноль драмы.\nТяжёлые шмотки оставь в шкафу, где им место."
      - weight: 1
        text: "Что чистое — то и надевай сегодня.\nЛёгкий слой на вечер прихвати, на всякий, умник."
    sting:
      - weight: 1
        text: "Даже мне сегодня не на что орать на тебя."
      - weight: 1
        text: "Наслаждайся, бля, это ненадолго, как обычно."

  comfortable:
    intro:
      - weight: 2
        text: "Хорошо на улице, не проёби —"
      - weight: 1
        text: "Лучше погоды не бывает —"
      - weight: 1
        text: "Образцовая погода, слушай —"
    advice:
      - weight: 1
        text: "Одевайся как хочешь, мне всё равно.\nФутболка норм, сегодня моя помощь тебе не нужна."
      - weight: 1
        text: "Короткий рукав — без проблем.\nЛёгкий слой на вечер прихвати, не будь идиотом насчёт этого."
      - weight: 1
        text: "Любой вариант сработает. Доверься себе.\nНеправильного ответа тут нет, впервые за долгое время."
    sting:
      - weight: 1
        text: "Где-то метеорологу сегодня адски скучно."
      - weight: 1
        text: "Та самая погода, которой все ноют, что мало бывает."

  warm:
    intro:
      - weight: 2
        text: "Теплеет, слушай внимательно —"
      - weight: 1
        text: "Лето стучится, гений —"
      - weight: 1
        text: "Припекает уже —"
    advice:
      - weight: 1
        text: "Шорты и футболка, тут и думать нечего, умник.\nОчки солнечные не помешают."
      - weight: 1
        text: "Только дышащая ткань — хлопок, лён, что угодно.\nКепку, если надолго выходишь, башку не сожги, дурак."
      - weight: 1
        text: "Светлые цвета, лёгкая ткань, всё по-минимуму.\nСлои сегодня дома посидят."
    sting:
      - weight: 1
        text: "Без крема от солнца завтра ныть будешь. Я предупредил, бля."
      - weight: 1
        text: "Погода для мороженого, если тебе нужно было разрешение, клоун."

  hot:
    intro:
      - weight: 2
        text: "Бля, ну и жара — слушай сюда —"
      - weight: 1
        text: "Пекло сегодня, внимание —"
      - weight: 1
        text: "Полное лето врубилось, гений —"
    advice:
      - weight: 1
        text: "Пей воду или отключишься, сам выбирай.\nСамое лёгкое, что есть, плюс очки — не обсуждается."
      - weight: 1
        text: "Лён свободный, шляпа с полями, не упирайся.\nКрем от солнца обязателен, а не по желанию."
      - weight: 1
        text: "Самые светлые, самые лёгкие шмотки, что есть.\nТёмные цвета — и к обеду ты зажаришься, без вариантов."
    sting:
      - weight: 1
        text: "Мороженое сегодня — практически лекарство."
      - weight: 1
        text: "Твоя тень — единственная тень, что у тебя будет. Используй её."
      - weight: 1
        text: "Асфальт к полудню яичницу пожарит, не драматизируй, когда сам поджаришься."

  windy_cold:
    intro:
      - weight: 2
        text: "Э, ветер реально борзеет —"
      - weight: 1
        text: "Холод с характером, слушай —"
      - weight: 1
        text: "Это не мягкий холод, бля —"
    advice:
      - weight: 1
        text: "Мороз плюс ветер, гений — обычная куртка не спасёт.\nБери что-то с ветрозащитой поверх."
      - weight: 1
        text: "Ветер пробивает обычную куртку насквозь.\nВетрозащитная оболочка, нормальные перчатки, шапка, которая не улетит."
      - weight: 1
        text: "Застегнись, заправься, закрой каждую дырку.\nВетер найдёт любую твою лень, дебил."
    sting:
      - weight: 1
        text: "Потом не плачь, я говорил застегнуться."
      - weight: 1
        text: "Сегодня вред наносит ветер, а не холод. Уважай это."
      - weight: 1
        text: "Твой шарф сейчас улетит как воздушный змей, держи крепче."

  windy_frost:
    intro:
      - weight: 2
        text: "Это пиздец жёстко, слушай —"
      - weight: 1
        text: "Природа реально старается сегодня, внимание —"
      - weight: 1
        text: "Кожа отмерзает на улице —"
    advice:
      - weight: 1
        text: "Любую дырку в твоей одежде ветер найдёт, дебил.\nВысокий воротник, шарф заправь, перчатки по размеру."
      - weight: 1
        text: "Ничего свободного, ничего открытого, ничего голого.\nПолное укрытие или сиди дома, твой выбор."
      - weight: 1
        text: "Закрой лицо и руки, не упирайся.\nГолая кожа немеет быстрее, чем думаешь, гений."
    sting:
      - weight: 1
        text: "У этого холода есть мнение насчёт твоих шмоток. Прислушайся."
      - weight: 1
        text: "Лицо онемеет раньше, чем кофе остынет, тупица."
      - weight: 1
        text: "Цифра про ветрочувствительность — не предложение, а предупреждение."

  windy_hot:
    intro:
      - weight: 2
        text: "Хоть ветерок есть, слушай —"
      - weight: 1
        text: "Жарко, но движется воздух, внимание —"
      - weight: 1
        text: "Ветер пытается тебе помочь —"
    advice:
      - weight: 1
        text: "Всё равно лёгкое надевай, не расслабляйся.\nШапку можно пропустить разок, скажи спасибо ветру."
      - weight: 1
        text: "Ветер смягчает жару, но она всё ещё есть, гений.\nКрем от солнца не пропускай, просто потому что прохладнее кажется."
      - weight: 1
        text: "Свободное и дышащее — вот правильный выбор.\nСледи за шапкой — ветер хочет её больше, чем ты."
    sting:
      - weight: 1
        text: "Ветерок — не замена крему от солнца, дурак."
      - weight: 1
        text: "Кажется прохладнее, чем есть на самом деле, не ведись."
      - weight: 1
        text: "Держи шапку. Я серьёзно, буквально."

  rain:
    intro:
      - weight: 2
        text: "Зонт бери, слушай —"
      - weight: 1
        text: "Моросит немного, внимание —"
      - weight: 1
        text: "Небо протекает, гений —"
    advice:
      - weight: 1
        text: "Лёгкий дождевик или куртка с капюшоном, этого хватит.\nБез понтов, не парься особо."
      - weight: 1
        text: "Непромокаемая обувь того стоит, поверь мне.\nЭта твоя 'водоотталкивающая' куртка тебя не спасёт."
      - weight: 1
        text: "Зонт и капюшон — хорошая связка.\nНоски потом спасибо скажут, обещаю."
    sting:
      - weight: 1
        text: "Лужи найдут твои носки, всегда находят, дебил."
      - weight: 1
        text: "Не будь тем клоуном, что забыл зонт."
      - weight: 1
        text: "Твои волосы сегодня сами решат, как им быть. Смирись."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это не морось, слушай сюда —"
      - weight: 1
        text: "Нормальный ливень, гений —"
      - weight: 1
        text: "Небо забило на тонкости —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, непромокаемые ботинки, крепкий зонт.\nДождевик поверх — не перебор сегодня, не спорь."
      - weight: 1
        text: "Всё водонепроницаемое — куртка, обувь, чехол на сумку.\nОбычный зонт эту битву проиграет."
      - weight: 1
        text: "Если куда-то идёшь пешком — полный комплект от дождя.\nПоловинчатые меры = наполовину мокрый и несчастный, дебил."
    sting:
      - weight: 1
        text: "Поработай из дома сегодня, просто говорю."
      - weight: 1
        text: "Даже уткам сегодня не нравится, гений."
      - weight: 1
        text: "Твой зонт сегодня — вся твоя личность. Смирись."

  snow:
    intro:
      - weight: 2
        text: "Снег валит, слушай —"
      - weight: 1
        text: "Сыплет вовсю, внимание —"
      - weight: 1
        text: "Бело на улице, гений —"
    advice:
      - weight: 1
        text: "Непромокаемые ботинки с нормальным протектором, тёплые перчатки, шапка.\nСлякоть тебе не друг, как бы красиво снег ни выглядел, дебил."
      - weight: 1
        text: "Слои под непромокаемой курткой.\nОбычную обувь смени на что-то с реальным сцеплением."
      - weight: 1
        text: "Тепло и сухо от щиколоток и выше.\nКрасивый снег быстро превращается в кашу и убивает обувь."
    sting:
      - weight: 1
        text: "Красиво из окна, не очень — в твоём ботинке, тупица."
      - weight: 1
        text: "Снеговика кто-то слепит. Не ты, скорее всего."
      - weight: 1
        text: "Сегодня сцепление важнее стиля, без споров."

  storm:
    intro:
      - weight: 2
        text: "Шторм надвигается, слушай —"
      - weight: 1
        text: "Не день для прогулок, гений —"
      - weight: 1
        text: "Держись за что-нибудь —"
    advice:
      - weight: 1
        text: "Сиди дома, если можешь, серьёзно.\nЕсли нет — непромокаемая куртка, крепкая обувь, зонт даже не доставай."
      - weight: 1
        text: "Закрепи всё, одень ветро- и водонепроницаемое.\nОткрытый зонт сегодня проиграет всегда, дебил."
      - weight: 1
        text: "Хватай сумку и вперёд, не задерживайся на улице.\nПолная защита от воды, если совсем надо выйти."
    sting:
      - weight: 1
        text: "Твой зонт это не переживёт. Оставь дома, гений."
      - weight: 1
        text: "День для того, чтоб сидеть дома с чаем. Намёк понял?"
      - weight: 1
        text: "Мать-природа сегодня явно не в настроении миндальничать."

expand:
  trigger:
    - "не веришь мне? вот скучная правда, гений"