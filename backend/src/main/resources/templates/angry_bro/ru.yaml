      - weight: 1
        text: "К полной зимней экипировке добавь прилегающие защитные очки.\nЗащити глаза от летящего снега и следи за запотеванием, чтобы не ослепнуть к хуям."
      - weight: 1
        text: "Надень просторную утеплённую куртку, закрой стыки у воротника, рукавов и голенищ.\nКожа немеет или белеет — иди греться в помещение, не геройствуй, долбоёб."
    sting:
      - weight: 1
        text: "Холод считает твой наряд ёбаной глупостью, прислушайся."
      - weight: 1
        text: "Ебало онемеет быстрее, чем кофе остынет, долбоёб."
      - weight: 1
        text: "Цифра «ощущается как» — не ёбаная рекомендация, а предупреждение."
      - weight: 1
        text: "Твоя репутация крутого парня подождёт где-нибудь с ёбаным отоплением."
      - weight: 1
        text: "Срезать через открытое поле сейчас — идея охуенно хуёвая."
      - weight: 1
        text: "Даже ёбаный снег пытается съебаться боком."
      - weight: 1
        text: "За превращение дороги домой в ёбаный курс выживания медаль не дадут."
      - weight: 1
        text: "Этой метеостанции положена, блядь, доплата за вредность."
      - weight: 1
        text: "Пёс разок глянул на улицу и внезапно оценил ёбаный ковёр."
      - weight: 1
        text: "Кто назвал эту улицу Солнечной, тот сегодня может идти нахуй."

  windy_hot:
    intro:
      - weight: 2
        text: "Хоть какой-то ёбаный ветер есть, слушай."
      - weight: 1
        text: "Жара адская, но хотя бы воздух шевелится, внимание."
      - weight: 1
        text: "Ветер как может спасает твою потную жопу."
      - weight: 1
        text: "Братан, держи ёбаный инструктаж."
      - weight: 1
        text: "Эй, внимание, разморённый ты засранец."
      - weight: 1
        text: "Так, пару слов, долбоёб."
      - weight: 1
        text: "Прежде чем куда-то попрёшься, беспечный ты хер."
      - weight: 1
        text: "Давай тебя соберём, умник хуев."
      - weight: 1
        text: "Прогноз погоды, ёб твою мать, уши открыл."
      - weight: 1
        text: "Так, вот что тебе нужно, блядь, знать."
    advice:
      - weight: 1
        text: "Всё равно надевай лёгкую одежду, не борзей.\nМожет, сегодня и без шляпы обойдёшься, скажи ёбаному ветерку спасибо."
      - weight: 1
        text: "Ветер немного помогает, но всё ещё жарко, блядь, долбоёб.\nНе забивай на солнцезащитный крем только потому, что приятно обдувает."
      - weight: 1
        text: "Свободное и дышащее — вот правильная, блядь, тактика.\nШляпу придерживай, ветер собирается её спиздить."
      - weight: 1
        text: "Надень лёгкую рубашку с UPF-защитой и просторные тонкие брюки.\nПрикрывать кожу всё ещё важно, когда солнце ведёт себя как настырный ёбаный мудак."
      - weight: 1
        text: "К летней одежде добавь прилегающие очки с УФ-защитой.\nПеску в воздухе похуй, сколько стоили твои контактные линзы."
      - weight: 1
        text: "Надень вентилируемую шляпу с регулируемым ремешком под подбородком.\nЗакрепи её заранее, чтобы потом не гоняться за этой сукой между машин."
      - weight: 1
        text: "Для быстрой прогулки надень быстросохнущую спортивную футболку и эластичные шорты.\nПот быстро испаряется, так что пей воду до того, как во рту станет, блядь, наждачка."
      - weight: 1
        text: "Выбирай сандалии с надёжными ремешками или дышащие кроссовки с тонкими носками.\nБолтающиеся шлёпки для пыльных неровных дорожек — хуёвый выбор."
      - weight: 1
        text: "Для велосипеда надень лёгкую рубашку и закрепи её полы.\nДержи болтающуюся ткань подальше от цепи, долбоёб ты механический."
      - weight: 1
        text: "Надень дышащую футболку и шорты по размеру, без свисающих завязок.\nЗастегни карманы, пока порыв ветра не раздал твои ёбаные вещи прохожим."
    sting:
      - weight: 1
        text: "Ёбаный ветерок солнцезащитный крем не заменяет, долбоёб."
      - weight: 1
        text: "Кажется прохладнее, чем есть на самом деле, не ведись на эту хуйню."
      - weight: 1
        text: "Держи свою ёбаную шляпу, я серьёзно."
      - weight: 1
        text: "Природа включила фен и назвала это, блядь, проветриванием."
      - weight: 1
        text: "У твоего пикника теперь есть приправа, которая прилетает по воздуху, заебись."
      - weight: 1
        text: "Пустой пакет от чипсов сегодня прошёл больше, чем твоя ленивая жопа."
      - weight: 1
        text: "Удачи выглядеть загадочно с собственными ёбаными волосами во рту."
      - weight: 1
        text: "Зонт у кафе издаёт звуки, которых в ёбаной рекламе не было."
      - weight: 1
        text: "Заказал холодный кофе, а чек бесплатно доставили в соседний, блядь, район."
      - weight: 1
        text: "Твоё пляжное полотенце, похоже, забронировало отдельный ёбаный отпуск."

  rain:
    intro:
      - weight: 2
        text: "Хватай ёбаный зонт, слушай."
      - weight: 1
        text: "Моросит, так что внимание, блядь."
      - weight: 1
        text: "Небо нас обоссывает, долбоёб."
      - weight: 1
        text: "Братан, держи ёбаную сводку погоды."
      - weight: 1
        text: "Эй, пару слов перед выходом, говнюк."
      - weight: 1
        text: "Так, соберись на секунду, рассеянный ты засранец."
      - weight: 1
        text: "Давай разберёмся, бестолковый ты хер."
      - weight: 1
        text: "Ежедневная сводка, нетерпеливый мудак."
      - weight: 1
        text: "Так, расклад следующий, умник хуев."
      - weight: 1
        text: "Слушай внимательно, выдающийся ты ходячий пиздец."
    advice:
      - weight: 1
        text: "Лёгкого дождевика или куртки с капюшоном хватит.\nНичего навороченного, не надо усложнять эту хуйню."
      - weight: 1
        text: "Непромокаемая обувь того стоит, поверь.\nА куртка, которая «слегка отталкивает воду», твою мокрую жопу не спасёт."
      - weight: 1
        text: "Зонт и капюшон — надёжная связка.\nЕсли не тащишься от мокрых носков, соберись уже, блядь."
      - weight: 1
        text: "Поверх обычной одежды надень непромокаемую куртку с регулируемым капюшоном.\nНе перекрывай боковой обзор, тебе ещё ёбаные машины видеть."
      - weight: 1
        text: "Выбирай быстросохнущие брюки, которые не волочатся по земле.\nМыть тротуар джинсами — способ, прямо скажем, долбоёбский."
      - weight: 1
        text: "Надень дождевую куртку и обувь с цепкой подошвой.\nНа мокрой плитке тебе прилетит по жопе быстрее, чем от обиженного вышибалы."
      - weight: 1
        text: "Для быстрой ходьбы надень дышащий дождевик поверх тонкой кофты.\nСогрелся — открой вентиляцию, не вари себя как ёбаный пельмень."
      - weight: 1
        text: "Для неспешной прогулки выбирай непромокаемый плащ до колен.\nСоберёшься сесть на мокрую лавку — пусть хоть твою ёбаную задницу прикрывает."
      - weight: 1
        text: "Для велосипеда надень непромокаемые штаны поверх одежды и затяни манжеты куртки.\nУбери свободную ткань от цепи, долбоёб ты педальный."
      - weight: 1
        text: "Обувай ботинки повыше, а штанины оставляй поверх голенищ.\nНе направляй воду прямиком в обувь, сантехник ты хуев."
    sting:
      - weight: 1
        text: "В лужах промочишь носки, они всегда, блядь, это делают, долбоёб."
      - weight: 1
        text: "Не будь тем ёбаным клоуном, который забыл зонт."
      - weight: 1
        text: "Твоей причёске сегодня пиздец, смирись."
      - weight: 1
        text: "Сейчас автобус познакомит твои брюки со всем содержимым ёбаной канавы."
      - weight: 1
        text: "Пёс запланировал отряхнуться прямо возле твоего чистого, блядь, белья."
      - weight: 1
        text: "Прогноз сказал «дождь», а твоя дурная башка услышала «необязательно»."
      - weight: 1
        text: "Уткам заебись, самодовольные непромокаемые засранки."
      - weight: 1
        text: "Этому бумажному пакету из магазина осталось жить минуты три, блядь."
      - weight: 1
        text: "Один раз очки протёр, и небо сразу начало, сука, плеваться."
      - weight: 1
        text: "К каждой открытой двери машины теперь прилагается бесплатная вода на яйца."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это не ёбаная морось, слушай."
      - weight: 1
        text: "Там настоящий, блядь, ливень, долбоёб."
      - weight: 1
        text: "У неба совсем, нахуй, крышу сорвало."
      - weight: 1
        text: "Братан, отнесись к этой хуйне серьёзно."
      - weight: 1
        text: "Так, держи инструктаж, безрассудный ты хер."
      - weight: 1
        text: "Эй, прекращай страдать хуйнёй и слушай."
      - weight: 1
        text: "Пару слов перед выходом, дубина."
      - weight: 1
        text: "Так, упрямый ты засранец, сосредоточься."
      - weight: 1
        text: "Вот с чем ты имеешь дело, ёб твою мать."
      - weight: 1
        text: "Десять ёбаных секунд внимания."
    advice:
      - weight: 1
        text: "Полноценный дождевик, непромокаемые ботинки и нормальный зонт.\nПончо сегодня тоже не перебор, так что не выёбывайся."
      - weight: 1
        text: "Всё, блядь, непромокаемое: куртка, обувь, сумка.\nОбычному зонтику сейчас знатно напинают по жопе."
      - weight: 1
        text: "Собрался куда-то пешком — надевай полный ёбаный комплект от дождя.\nСделаешь на отъебись — будешь мокрый и несчастный, долбоёб."
      - weight: 1
        text: "Надень непромокаемую куртку с капюшоном, проклеенными швами и закрытой планкой молнией.\nПланку застегни, эта полоска висит не для ёбаной красоты."
      - weight: 1
        text: "Поверх быстросохнущих брюк натяни непромокаемые штаны.\nШтанины оставь снаружи ботинок, если не собираешься собирать в них, блядь, осадки."
      - weight: 1
        text: "Выбирай непромокаемую обувь с глубоким протектором и надёжной фиксацией.\nЗатопленные места обходи, никакие ботинки не делают твою жопу водонепроницаемой."
      - weight: 1
        text: "Под регулируемый дождевой капюшон надень кепку с козырьком.\nУбери ткань с глаз, чтобы видеть, куда ты, нахуй, наступаешь."
      - weight: 1
        text: "Надень дышащую непромокаемую куртку поверх влагоотводящей футболки.\nПроветрись под укрытием, пока пот не закончил работу ёбаного дождя."
      - weight: 1
        text: "Если придётся стоять на улице, выбирай длинный дождевик с застёжками внахлёст.\nТелефон убери в гермочехол, мокрый карман — не ёбаная страховка."
      - weight: 1
        text: "У дорог надевай яркую непромокаемую одежду со светоотражающими деталями.\nДай водителям шанс заметить тебя сквозь брызги, мокрый ты ёбаный ниндзя."
    sting:
      - weight: 1
        text: "Поработай сегодня из дома, ёб твою мать, просто мысль."
      - weight: 1
        text: "Даже уток эта хуйня уже заебала, долбоёб."
      - weight: 1
        text: "Твой ёбаный зонт сегодня работает больше тебя."
      - weight: 1
        text: "Водосток звучит так, будто подавился ёбаным диваном."
      - weight: 1
        text: "Поздравляю, везучий засранец, у тебя теперь выход прямо к воде."
      - weight: 1
        text: "Курьеру за этот пиздец полагаются соответствующие чаевые."
      - weight: 1
        text: "Небо, похоже, нашло режим ёбаной мойки высокого давления."
      - weight: 1
        text: "В твою пятиминутную прогулку теперь входит ёбаное полоскание."
      - weight: 1
        text: "Коврик у кафе впитал столько страданий, что может написать ёбаный роман."
      - weight: 1
        text: "Для твоего драматичного взгляда в окно наконец нашёлся подходящий, блядь, саундтрек."

  rain_cold:
    intro:
      - weight: 2
        text: "И холодно, и мокро, долбоёб, слушай."
      - weight: 1
        text: "Ледяной дождь и прочая хуета, внимание."
      - weight: 1
        text: "Эй, небо ссыт ледяной водой."
      - weight: 1
        text: "Братан, докладываю про этот ёбаный расклад."
      - weight: 1
        text: "Эй, соберись, беспечный ты засранец."
      - weight: 1
        text: "Так, пару слов тебе, говно вместо мозгов."
      - weight: 1
        text: "Перед выходом вбей это в свою ёбаную башку."
      - weight: 1
        text: "Ну что, ходячая хуёвая идея."
      - weight: 1
        text: "Прогноз погоды, унылый ты хер."
      - weight: 1
        text: "Слушай внимательно, ёб твою мать, это важно."
    advice:
      - weight: 1
        text: "Непромокаемая куртка поверх тёплой кофты и ёбаная шапка.\nОбувь с нормальной подошвой, кеды промокнут за пять минут, гений хуев."
      - weight: 1
        text: "Тёплая куртка с капюшоном и зонт, не спорь.\nПромокнуть и замёрзнуть — хуёвый способ проверить себя на прочность."
      - weight: 1
        text: "Надень несколько тёплых слоёв под что-то реально непромокаемое.\nБрось сухие носки в сумку, если не любишь хлюпать весь день, как долбоёб."
      - weight: 1
        text: "Надень термобельё с шерстью, флиску и дождевую куртку с проклеенными швами.\nДля активной ходьбы не надевай хлопковую майку, эта сука долго остаётся мокрой и холодной."
      - weight: 1
        text: "Поверх тёплых прогулочных брюк натяни непромокаемые штаны.\nМокрые джинсы на коленях — ёбаная пытка, которую можно не устраивать."
      - weight: 1
        text: "Обувай утеплённые непромокаемые ботинки с цепкой подошвой.\nПохолодает — смотри, нет ли льда, протектор не ёбаное защитное поле."
      - weight: 1
        text: "Выбирай утеплённые перчатки с защитой от воды, манжеты убери под рукава дождевика.\nПусть вода стекает снаружи, а не заливает тебе ёбаные ладони, как вёдра."
      - weight: 1
        text: "Надень тонкую шапку под правильно отрегулированный непромокаемый капюшон.\nОставь глазам обзор, тебе ещё ёбаные лужи обходить."
      - weight: 1
        text: "Выбирай куртку с синтетическим утеплителем и непромокаемым верхом.\nПеред выходом проверь застёжки, открытая молния пускает всю затею по пизде."
      - weight: 1
        text: "Надень флисовый бафф и заправь его под высокий воротник дождевой куртки.\nНамокнет — замени, холодная мокрая тряпка на шее помогает примерно нихуя."
    sting:
      - weight: 1
        text: "Мокрые носки в такой холод — особая разновидность долбоебизма."
      - weight: 1
        text: "Твою тонкую курточку не звали, как и твои ёбаные понты."
      - weight: 1
        text: "После этого — горячий чай, ты заслужил, с натяжкой, блядь."
      - weight: 1
        text: "Погода как наступить в говно, одновременно отвечая на ёбаный рабочий звонок."
      - weight: 1
        text: "Та капля за шиворот явно прошла ёбаную снайперскую подготовку."
      - weight: 1
        text: "Ключи выбрали охуенный момент поиграть в прятки, мелкие ублюдки."
      - weight: 1
        text: "Приложение пишет «автобус прибывает», что, видимо, переводится как «иди нахуй»."
      - weight: 1
        text: "Природа не выбрала между «мерзко» и «полный пиздец» и выдала оба варианта."
      - weight: 1
        text: "Кто оставил дверь магазина открытой, тот заслужил подробный разбор с хуями."
      - weight: 1
        text: "Мокрый рукав после мытья рук теперь кажется ёбаной демоверсией."

  heavy_rain_cold:
    intro:
      - weight: 2
        text: "Холодина пиздец и льёт, слушай."
      - weight: 1
        text: "Это не морось, долбоёб."
      - weight: 1
        text: "Небо ебанулось, и вдобавок мороз."
      - weight: 1
        text: "Братан, включай, блядь, голову."
      - weight: 1
        text: "Эй, расклад такой, безрассудный ты засранец."
      - weight: 1
        text: "Так, слушай внимательно, долбоёб."
      - weight: 1
        text: "Краткий инструктаж для твоей неподготовленной жопы."
      - weight: 1
        text: "Перед выходом, упрямый ты хер."
