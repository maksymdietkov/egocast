conditions:
  frost:
    intro:
      - weight: 2
        text: "Так, блядь, уши развесь — мороз ебашит —"
      - weight: 1
        text: "Эй, ты, морозоустойчивый долбоёб —"
      - weight: 1
        text: "Ну что, блядь, реальность тебе сейчас по ебалу даст —"
      - weight: 1
        text: "Зима сегодня не шутит, а жёстко ебёт —"
    advice:
      - weight: 1
        text: "Надень нормальную куртку, а не эту тряпку для понтов, ебанат.\nШапка, перчатки, шарф — всё сразу, блядь, без торга."
      - weight: 1
        text: "Термуха, свитер, нормальный пуховик — это, блядь, минимум.\nВыйдешь без шапки — заморозишь последние мозги, тупой ты хрен."
      - weight: 1
        text: "Полный комплект: куртка, перчатки и шапка на уши.\nОбморожение не ебёт, какой ты там герой, долбоёб."
      - weight: 1
        text: "Одевайся нормально или сиди дома нахуй.\nИ тёплые носки надень — не надо геройски проёбывать пальцы, дебил."
    sting:
      - weight: 1
        text: "Выйдешь раздетым — сам себе морозом яйца отморозишь, мудак."
      - weight: 1
        text: "Не тот день, чтобы выпендриваться. Натяни куртку, блядь."
      - weight: 1
        text: "Я второй раз повторять не стану, тупорылый."

  cold:
    intro:
      - weight: 2
        text: "Утепляйся, блядь, пока яйца не отвалились —"
      - weight: 1
        text: "Слышь, ледяной Рэмбо, не тупи —"
      - weight: 1
        text: "Так, блядь, включи голову на секунду —"
      - weight: 1
        text: "Внимание сюда, мать твою —"
    advice:
      - weight: 1
        text: "Тёплая куртка — без вариантов, блядь.\nПерчатки тоже надень, не жди, пока руки отвалятся, дебил."
      - weight: 1
        text: "Нормальная куртка и шарф — вот и вся наука.\nВетровка ни хрена не спасёт, не испытывай судьбу, долбоёб."
      - weight: 1
        text: "Термуха, свитер и куртка, которая застёгивается, блядь.\nНе будь тем жалким клоуном, который трясётся на остановке."
      - weight: 1
        text: "Куртка, шапка и что-нибудь на шею.\nХолод найдёт каждую щель, которую ты, ленивый хрен, проебал."
    sting:
      - weight: 1
        text: "Кофе тебя не спасёт, блядь. Куртка — спасёт."
      - weight: 1
        text: "Летнюю куртёшку оставь дома, нахуй. Тема закрыта."
      - weight: 1
        text: "Уши мёрзнут первыми, тупой ты ублюдок. Надень шапку."

  chilly:
    intro:
      - weight: 2
        text: "Холодок подкрался, блядь, не расслабляйся —"
      - weight: 1
        text: "Свеженько так, что твой понт быстро сдохнет —"
      - weight: 1
        text: "Эй, башкой подумай, прежде чем выйти —"
    advice:
      - weight: 1
        text: "Нормальная куртка или толстый свитер под неё — и не выдумывай херни.\nЧерез десять минут без перчаток начнёшь скулить, как побитый пёс."
      - weight: 1
        text: "Шарф и куртку надень, а не эту жалкую ветровочку.\nЕсли быстро мёрзнешь — перчатки тоже, долбаёб, это не ракетостроение."
      - weight: 1
        text: "Погода для шарфа, блядь. Не арктическая экспедиция, но в футболке не выпендривайся.\nБудешь выглядеть как конченый идиот."
    sting:
      - weight: 1
        text: "Не арктика, но уши всё равно будут ныть. Потерпи, мать твою."
      - weight: 1
        text: "Скажи ветру, что «формально ещё не зима». Пусть он тебя нахуй пошлёт."

  cool:
    intro:
      - weight: 2
        text: "На улице терпимо, но не тупи —"
      - weight: 1
        text: "Слегка прохладно, включай мозги, блядь —"
      - weight: 1
        text: "Ничего катастрофического, не начинай цирк —"
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит, блядь.\nШарф по желанию — не сдохнешь ты там, паникёр хренов."
      - weight: 1
        text: "Худи или лёгкая куртка — за глаза.\nТяжёлый пуховик оставь в шкафу, не будь ебанутым драматургом."
      - weight: 1
        text: "Футболка под куртку — и готово.\nПотеплеет — повяжешь её на пояс, как взрослый, а не как истеричный долбоёб."
    sting:
      - weight: 1
        text: "Куртка, не пуховик, блядь. Научись отличать."
      - weight: 1
        text: "На улице так комфортно, что ты зря донимал всех этим вопросом, чудо ебанутое."

  mild:
    intro:
      - weight: 2
        text: "День нормальный, не выёбывайся —"
      - weight: 1
        text: "Погода спокойная, блядь, слушай сюда —"
      - weight: 1
        text: "Да не парься ты, мать твою —"
    advice:
      - weight: 1
        text: "Лёгкая куртка или длинный рукав — и хватит мудрить.\nЗадолбал спрашивать: сам знаешь, как одеваться, тупой ты гений."
      - weight: 1
        text: "Погода для кардигана. Ноль драмы, блядь.\nТяжёлые шмотки оставь в шкафу, не тащи на себе весь гардероб, придурок."
      - weight: 1
        text: "Надевай что чистое — сегодня почти всё сойдёт.\nНа вечер кинь лёгкую кофту, если не хочешь потом скулить, умник хренов."
    sting:
      - weight: 1
        text: "Даже мне сегодня не за что орать на тебя, а это, блядь, достижение."
      - weight: 1
        text: "Наслаждайся, пока можешь. Такая погода долго не держится, нахуй."

  comfortable:
    intro:
      - weight: 2
        text: "На улице кайф, только не обосрись —"
      - weight: 1
        text: "Погода почти идеальная, блядь — не испорти момент —"
      - weight: 1
        text: "Вот это погода, слушай сюда, чудо природы —"
    advice:
      - weight: 1
        text: "Одевайся как хочешь, мне вообще похуй.\nФутболки хватит — сегодня даже такой долбоёб справится."
      - weight: 1
        text: "Короткий рукав — без проблем.\nНа вечер прихвати лёгкую кофту, не тупи по этому поводу, блядь."
      - weight: 1
        text: "Подойдёт почти всё. Хоть раз доверься своей башке.\nТут сложно ошибиться, но я в тебя всё равно не до конца верю."
    sting:
      - weight: 1
        text: "Где-то метеоролог сейчас от скуки яйца себе чешет."
      - weight: 1
        text: "Это та самая погода, про которую вы ноете, что её вечно нет, блядь."

  warm:
    intro:
      - weight: 2
        text: "Теплеет, блядь, не надевай на себя весь шкаф —"
      - weight: 1
        text: "Лето уже ломится в дверь, шевели мозгами —"
      - weight: 1
        text: "Припекает, мать твою —"
    advice:
      - weight: 1
        text: "Шорты и футболка, тут даже последний долбоёб разберётся.\nСолнечные очки тоже не помешают, блядь."
      - weight: 1
        text: "Только дышащая ткань — хлопок, лён, что угодно.\nЕсли надолго выходишь, надень кепку, не поджарь свою башку, ебанат."
      - weight: 1
        text: "Светлые цвета, лёгкая ткань — всё по минимуму.\nСлои одежды сегодня нахуй не нужны."
    sting:
      - weight: 1
        text: "Без солнцезащитного крема завтра будешь выть, как сука. Я предупредил, блядь."
      - weight: 1
        text: "Погода для мороженого. Если тебе нужно разрешение, клоун ты ебаный."

  hot:
    intro:
      - weight: 2
        text: "Блядь, ну и пекло — слушай сюда —"
      - weight: 1
        text: "Сегодня жара ебёт без смазки, внимание —"
      - weight: 1
        text: "Лето врубило режим «сдохни», долбоёб —"
    advice:
      - weight: 1
        text: "Пей воду, а то вырубишься нахуй — сам выбирай.\nНадевай самое лёгкое и очки: это, блядь, не обсуждается."
      - weight: 1
        text: "Свободный лён, шляпа с полями — не упирайся, ебанат.\nСолнцезащитный крем обязателен, а не по настроению."
      - weight: 1
        text: "Самые светлые и лёгкие шмотки, какие есть.\nВ тёмном к обеду запечёшься, как курица, долбоёб."
    sting:
      - weight: 1
        text: "Мороженое сегодня почти что реанимация, блядь."
      - weight: 1
        text: "Твоя тень — единственное укрытие, которое тебе светит. Пользуйся, ебанат."
      - weight: 1
        text: "Асфальт к полудню яичницу пожарит. Не удивляйся, если сам поджаришься, идиот."

  windy_cold:
    intro:
      - weight: 2
        text: "Ветер сегодня охуел в край —"
      - weight: 1
        text: "Холод с характером, блядь, слушай сюда —"
      - weight: 1
        text: "Это не прохлада, это ветер ебёт по полной —"
    advice:
      - weight: 1
        text: "Мороз и ветер, долбоёб: обычная куртка тебя не спасёт.\nНадень сверху нормальную ветрозащиту, не экономь на мозгах."
      - weight: 1
        text: "Ветер пробивает обычную куртку насквозь, нахуй.\nНужна ветрозащитная верхняя одежда, нормальные перчатки и шапка, которая не улетит."
      - weight: 1
        text: "Застегнись, заправься и закрой все щели, блядь.\nВетер найдёт каждую дыру, которую ты по лени оставил, кретин."
    sting:
      - weight: 1
        text: "Потом не ной, что замёрз, я велел застегнуться, блядь."
      - weight: 1
        text: "Сегодня тебя вымораживает ветер, а не просто холод. Не будь идиотом."
      - weight: 1
        text: "Шарф сейчас улетит нахуй, как воздушный змей. Держи его."

  windy_frost:
    intro:
      - weight: 2
        text: "На улице лютый пиздец, слушай сюда —"
      - weight: 1
        text: "Природа сегодня решила тебя добить, блядь —"
      - weight: 1
        text: "Мороз такой, что кожу нахуй отрывает —"
    advice:
      - weight: 1
        text: "Ветер найдёт любую щель в твоей одежде, тупорылый.\nВоротник повыше, шарф заправь, перчатки надень нормальные."
      - weight: 1
        text: "Ничего распахнутого, свободного или голого, блядь.\nЗакрой всё как следует или сиди дома нахуй — выбор за тобой."
      - weight: 1
        text: "Закрой лицо и руки, не выпендривайся, ебанат.\nОткрытая кожа немеет быстрее, чем твоя башка соображает."
    sting:
      - weight: 1
        text: "Даже морозу не нравится твой прикид. Прислушайся, блядь."
      - weight: 1
        text: "Морда онемеет раньше, чем кофе остынет, тупой ублюдок."
      - weight: 1
        text: "Ощущаемая температура — это не рекомендация, а предупреждение, блядь."

  windy_hot:
    intro:
      - weight: 2
        text: "Хоть ветер есть, а то было бы совсем пиздец —"
      - weight: 1
        text: "Жарко, но воздух шевелится, не тупи —"
      - weight: 1
        text: "Ветер пытается спасти твою задницу —"
    advice:
      - weight: 1
        text: "Всё равно надевай лёгкое, не охуевай от самоуверенности.\nКепку можно снять, если ветер помогает, но голову не теряй."
      - weight: 1
        text: "Ветер чуть спасает, но жара никуда не делась, долбоёб.\nКрем не пропускай только потому, что тебе кажется прохладнее."
      - weight: 1
        text: "Свободная дышащая одежда — вот что надо, блядь.\nСледи за кепкой: ветер хочет её утащить нахуй."
    sting:
      - weight: 1
        text: "Ветерок не заменяет солнцезащитный крем, тупой ты ублюдок."
      - weight: 1
        text: "Кажется прохладнее, чем есть на самом деле. Не ведись, блядь."
      - weight: 1
        text: "Держи кепку крепче. Я, мать твою, буквально."

  rain:
    intro:
      - weight: 2
        text: "Зонт хватай, блядь, и слушай сюда —"
      - weight: 1
        text: "Немного моросит, но не тупи —"
      - weight: 1
        text: "Небо протекает, ебанат —"
    advice:
      - weight: 1
        text: "Лёгкий дождевик или куртка с капюшоном — хватит за глаза.\nБез понтов, блядь, не усложняй простую хрень."
      - weight: 1
        text: "Непромокаемая обувь реально спасает, поверь.\nТвоя «водоотталкивающая» куртка промокнет к чертям, долбоёб."
      - weight: 1
        text: "Зонт плюс капюшон — нормальная комбинация.\nНоски потом скажут спасибо, если ты не проебёшь этот совет."
    sting:
      - weight: 1
        text: "Лужи обязательно найдут твои носки, долбоёб. У них на тебя зуб."
      - weight: 1
        text: "Не будь тем конченым клоуном, который забыл зонт."
      - weight: 1
        text: "С волосами сегодня будет полный бардак. Смирись, нахуй."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это уже не морось, а дождь ебашит стеной —"
      - weight: 1
        text: "Ливень хлещет как из ведра, блядь —"
      - weight: 1
        text: "Небо окончательно охуело —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, непромокаемые ботинки и крепкий зонт.\nНадеть сверху ещё и пончо — не перебор, не спорь, блядь."
      - weight: 1
        text: "Всё водонепроницаемое: куртка, обувь, чехол на сумку.\nОбычный зонт проиграет эту битву к херам собачьим."
      - weight: 1
        text: "Если идёшь пешком — облачайся в полный дождевой комплект.\nПолумеры оставят тебя мокрым и злым, тупой ты кусок мяса."
    sting:
      - weight: 1
        text: "Сиди сегодня дома и работай оттуда, нахуй, если можешь."
      - weight: 1
        text: "Даже утки охренели от этой погоды, а ты собрался гулять, гений."
      - weight: 1
        text: "Сегодня зонт — вся твоя личность. Жалкое зрелище, блядь."
  rain_cold:
    intro:
      - weight: 2
        text: "Холодно и мокро, блядь, слушай сюда —"
      - weight: 1
        text: "Небо ссыт ледяной водой, ебанат —"
      - weight: 1
        text: "Сырость с холодом — худшая хуйня, не тупи —"
    advice:
      - weight: 1
        text: "Непромокаемая куртка поверх тёплого слоя и шапка, блядь.\nОбувь нужна с нормальной подошвой, кеды промокнут за пять минут, гений."
      - weight: 1
        text: "Тёплая куртка с капюшоном и зонт, и не выёбывайся.\nСырость на холоде — так долбоёбы и сваливаются с температурой."
      - weight: 1
        text: "Одевайся слоями и накинь что-то реально непромокаемое.\nКинь в сумку сухие носки, если не хочешь хлюпать весь день."
    sting:
      - weight: 1
        text: "Мокрые ноги в такой холод — отдельный вид тупости."
      - weight: 1
        text: "Тонкая куртка сегодня нахуй не нужна, и твои понты тоже."
      - weight: 1
        text: "Горячий чай в конце пути ты заслужил. Еле-еле."

  heavy_rain_cold:
    intro:
      - weight: 2
        text: "Ливень и холод, блядь, слушай сюда —"
      - weight: 1
        text: "Это не морось, долбоёб —"
      - weight: 1
        text: "Небо охуело, и ещё морозит в придачу —"
    advice:
      - weight: 1
        text: "Полный непромокаемый комплект: куртка, тёплый слой под ней, ботинки, блядь.\nОбычный зонт сложится как дешёвый шезлонг."
      - weight: 1
        text: "Куртка с капюшоном, которая реально держит воду, и шапка.\nЕсли можно не выходить — сиди дома нахуй."
      - weight: 1
        text: "Всё непромокаемое: куртка, обувь, чехол на сумку.\nПромокнуть до нитки на холоде — хуже не придумаешь, поверь."
    sting:
      - weight: 1
        text: "Сидеть дома сегодня умнее всего, что ты задумал, гений."
      - weight: 1
        text: "Замшевые туфли остаются дома. Без обсуждений, блядь."
      - weight: 1
        text: "Мокрый, замёрзший и упрямый — шикарное сочетание, чемпион."
  snow:
    intro:
      - weight: 2
        text: "Снег валит, блядь, смотри под ноги —"
      - weight: 1
        text: "Сыплет так, что скоро хрен дорогу увидишь —"
      - weight: 1
        text: "На улице белым-бело, ебанат —"
    advice:
      - weight: 1
        text: "Непромокаемые ботинки с цепким протектором, тёплые перчатки и шапка.\nСлякоть тебя сожрёт, долбоёб, как бы красиво снег ни выглядел."
      - weight: 1
        text: "Надень слои под непромокаемую куртку, блядь.\nПереобуйся в обувь с нормальным сцеплением, а не в эти скользкие говнодавы."
      - weight: 1
        text: "Сохрани ноги в тепле и сухости, начиная со щиколоток.\nКрасивый снег быстро превращается в грязное месиво и убивает обувь, нахуй."
    sting:
      - weight: 1
        text: "Из окна красиво, а в ботинке — мокрый пиздец, тупица."
      - weight: 1
        text: "Снеговика слепит кто-нибудь другой. Ты, скорее всего, и это проебёшь."
      - weight: 1
        text: "Сегодня сцепление важнее стиля, блядь. Не устраивай модный показ на льду."

  storm:
    intro:
      - weight: 2
        text: "Шторм надвигается, блядь, шевели задницей —"
      - weight: 1
        text: "Это не день для прогулок, тупой ты герой —"
      - weight: 1
        text: "Держись за что-нибудь, мать твою —"
    advice:
      - weight: 1
        text: "Если можешь — сиди дома, серьёзно, нахуй.\nЕсли выйти необходимо: непромокаемая куртка, крепкая обувь, зонт даже не раскрывай."
      - weight: 1
        text: "Закрепи всё, надень ветро- и водонепроницаемое, блядь.\nОткрытый зонт тут сложится к чертям, не будь долбоёбом."
      - weight: 1
