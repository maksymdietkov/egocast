conditions:
  frost:
    intro:
      - weight: 2
        text: "Yo. It's fucking below freezing out there —"
      - weight: 1
        text: "Listen up, dumbass —"
      - weight: 1
        text: "Alright, you cocky bastard, here's your reality check —"
      - weight: 1
        text: "Hey. Winter's here to kick your ass today —"
    advice:
      - weight: 1
        text: "Put a fucking proper coat on, not that useless fashion jacket you love so much.\nHat, gloves, scarf — all three. Don't be a stubborn idiot about it."
      - weight: 1
        text: "Thermal layer, sweater, actual winter coat. That's the bare fucking minimum.\nSkip the hat and freeze your ears off, you absolute dumbass."
      - weight: 1
        text: "Full fucking gear today: coat, gloves, hat over your ears.\nYou're not some invincible badass. Frostbite doesn't give a shit."
      - weight: 1
        text: "Layer the fuck up or stay inside.\nThermal socks too — don't lose feeling in your toes just to look tough, idiot."
    sting:
      - weight: 1
        text: "Go out underdressed and freeze your stupid ass off, champ."
      - weight: 1
        text: "This isn't the day to prove what a hardass you are. Put the fucking coat on."
      - weight: 1
        text: "I'm not repeating myself, you stubborn dumbass."

  cold:
    intro:
      - weight: 2
        text: "Yo, bundle the fuck up —"
      - weight: 1
        text: "Heads up, tough guy — unless you're all mouth and no brains —"
      - weight: 1
        text: "Listen the fuck up —"
      - weight: 1
        text: "Alright, pay attention for once, dumbass —"
    advice:
      - weight: 1
        text: "Warm coat. No fucking excuses.\nGloves too — unless you want your hands to hurt like hell in an hour."
      - weight: 1
        text: "Proper coat and a scarf. That's all the fuck you need to do.\nA flimsy jacket won't cut it today, so quit testing your luck, idiot."
      - weight: 1
        text: "Thermal shirt, sweater, coat that actually zips shut.\nDon't be the dumbass shivering on the corner pretending you're fine."
      - weight: 1
        text: "Coat, hat, something around your neck.\nCold gets into every gap you were too lazy to cover, genius."
    sting:
      - weight: 1
        text: "Coffee won't save your ass. The fucking coat will."
      - weight: 1
        text: "Your shitty summer jacket stays home today. End of fucking discussion."
      - weight: 1
        text: "Your ears freeze first, dumbass — put the fucking hat on."

  chilly:
    intro:
      - weight: 2
        text: "Yo, it's getting fucking cold —"
      - weight: 1
        text: "It's a bit fucking nippy, listen up —"
      - weight: 1
        text: "Hey, pay the fuck attention —"
    advice:
      - weight: 1
        text: "Decent jacket or a thick sweater under one. That's all.\nGo barehanded and you'll be whining like a little bitch in ten minutes."
      - weight: 1
        text: "Scarf and a real jacket, not that flimsy windbreaker bullshit.\nWear gloves if you get cold, dumbass. This isn't rocket science."
      - weight: 1
        text: "This is scarf weather. Nothing fucking complicated — just don't go out in a damn T-shirt.\nDo that and I'll judge the hell out of you."
    sting:
      - weight: 1
        text: "It's not freezing, but your ears will still get their asses kicked. Deal with it."
      - weight: 1
        text: "Go tell the wind it's 'technically not winter,' smartass. See how quickly it gives a shit."

  cool:
    intro:
      - weight: 2
        text: "Weather's not bad, but listen the fuck up —"
      - weight: 1
        text: "There's a bit of a chill, so pay attention, dumbass —"
      - weight: 1
        text: "Alright, no need to be a dramatic little shit —"
    advice:
      - weight: 1
        text: "A light jacket will do the job.\nScarf's optional, dumbass — you're not trekking across fucking Siberia."
      - weight: 1
        text: "Hoodie or light jacket. That's plenty.\nLeave the heavy coat at home, drama queen — nobody's trying to freeze your ass off."
      - weight: 1
        text: "T-shirt under a jacket. Done.\nTie the jacket around your waist if you get warm — try acting like a fucking adult."
    sting:
      - weight: 1
        text: "It's jacket weather, not fucking parka weather. Learn the difference."
      - weight: 1
        text: "It's so fucking comfortable you had no business asking me what to wear."

  mild:
    intro:
      - weight: 2
        text: "Decent fucking day. Don't overthink it —"
      - weight: 1
        text: "Easy weather, so listen the fuck up —"
      - weight: 1
        text: "Nothing to stress about, for fuck's sake —"
    advice:
      - weight: 1
        text: "Light jacket or long sleeves. That's fucking it.\nQuit asking me, you know how to dress for this, you useless smartass."
      - weight: 1
        text: "Cardigan weather. Zero fucking drama.\nLeave the heavy shit in the closet where it belongs."
      - weight: 1
        text: "Whatever the fuck is clean will work today.\nGrab a light layer for later, just in case, smartass."
    sting:
      - weight: 1
        text: "Even I haven't got a damn thing to yell at you about today."
      - weight: 1
        text: "Enjoy the nice weather, you lucky bastard. It won't fucking last."

  comfortable:
    intro:
      - weight: 2
        text: "It's fucking nice out. Don't screw it up —"
      - weight: 1
        text: "About as fucking good as it gets —"
      - weight: 1
        text: "Textbook weather, so listen the fuck up —"
    advice:
      - weight: 1
        text: "Wear whatever the fuck you want.\nA T-shirt is fine. Even you can't screw this up today."
      - weight: 1
        text: "Short sleeves are fine.\nKeep a light layer for the evening, though — don't be a complete dumbass about it."
      - weight: 1
        text: "Anything works. Use your fucking judgment.\nThere's no wrong answer today, for once in your life."
    sting:
      - weight: 1
        text: "Somewhere a meteorologist is bored as fuck today."
      - weight: 1
        text: "This is the weather people bitch and moan they never get enough of."

  warm:
    intro:
      - weight: 2
        text: "It's heating the fuck up, pay attention —"
      - weight: 1
        text: "Summer's knocking, so listen the fuck up —"
      - weight: 1
        text: "It's getting fucking toasty out —"
    advice:
      - weight: 1
        text: "Shorts and a T-shirt, dumbass. This isn't fucking rocket science.\nSunglasses wouldn't hurt either."
      - weight: 1
        text: "Breathable shit only — cotton, linen, whatever.\nWear a cap if you're out a while. Don't fry your fucking skull."
      - weight: 1
        text: "Light colors, light fabric, light fucking everything.\nLayers can stay in the closet today."
    sting:
      - weight: 1
        text: "Skip sunscreen and you'll be whining like a little bitch tomorrow. Don't say I didn't fucking warn you."
      - weight: 1
        text: "It's ice cream weather, you absolute clown. Didn't think you'd need permission for that."

  hot:
    intro:
      - weight: 2
        text: "It's fucking hot — listen the fuck up —"
      - weight: 1
        text: "It's a fucking scorcher today, pay attention —"
      - weight: 1
        text: "Full-blown summer, you sun-baked dumbass —"
    advice:
      - weight: 1
        text: "Drink some fucking water or risk passing out. Your call, dumbass.\nWear the lightest clothes you own and sunglasses — neither is optional."
      - weight: 1
        text: "Loose linen, a wide-brim hat — quit being a stubborn asshole about it.\nSunscreen is fucking mandatory, not a suggestion."
      - weight: 1
        text: "Wear the palest, lightest clothes you've got.\nGo out in dark colors and you'll roast your ass off by noon. No exceptions."
    sting:
      - weight: 1
        text: "Ice cream is basically fucking medicine today."
      - weight: 1
        text: "Your shadow's the only fucking shade you're getting. Make use of it."
      - weight: 1
        text: "The pavement could fry an egg by noon, so don't act fucking shocked when you're roasting too."

  windy_cold:
    intro:
      - weight: 2
        text: "Yo, the wind's trying to kick your ass —"
      - weight: 1
        text: "Cold with a fucking attitude, listen up —"
      - weight: 1
        text: "This ain't some gentle little fucking chill —"
    advice:
      - weight: 1
        text: "It's freezing and windy, dumbass — your regular coat won't cut it.\nPut something fucking windproof over it."
      - weight: 1
        text: "The wind cuts straight through a normal coat.\nGet a windproof shell, proper gloves, and a hat that won't fuck off into the distance."
      - weight: 1
        text: "Zip up, tuck in, cover every fucking gap.\nThe wind finds every hole you were too lazy to cover, genius."
    sting:
      - weight: 1
        text: "Don't come fucking crying to me — I told you to zip up."
      - weight: 1
        text: "The wind's kicking your ass today, not the cold. Show it some fucking respect."
      - weight: 1
        text: "Your scarf's about to become a fucking kite. Hold onto the damn thing."

  windy_frost:
    intro:
      - weight: 2
        text: "This is fucking brutal, so listen up —"
      - weight: 1
        text: "Nature's trying to fuck you over today, pay attention —"
      - weight: 1
        text: "It's cold enough to freeze your fucking skin —"
    advice:
      - weight: 1
        text: "The wind will find every fucking gap in your outfit.\nHigh collar, scarf tucked in, gloves that actually fit — don't be a dumbass."
      - weight: 1
        text: "Nothing loose, nothing open, nothing exposed.\nCover the fuck up or stay inside. Your call."
      - weight: 1
        text: "Cover your face and hands. Quit being a stubborn asshole.\nExposed skin goes numb faster than you think, dumbass."
    sting:
      - weight: 1
        text: "This cold thinks your fashion choices are fucking stupid. Listen to it."
      - weight: 1
        text: "Your face will go fucking numb before your coffee gets cold, dumbass."
      - weight: 1
        text: "That wind-chill number isn't a fucking suggestion. It's a warning."

  windy_hot:
    intro:
      - weight: 2
        text: "At least there's some fucking wind, listen up —"
      - weight: 1
        text: "It's hot as hell but at least the air's moving — pay attention —"
      - weight: 1
        text: "The wind's doing its best to save your sweaty ass —"
    advice:
      - weight: 1
        text: "Wear light clothes anyway, don't get cocky.\nYou might get away without a hat for once, so thank the fucking breeze."
      - weight: 1
        text: "The wind takes the edge off, but it's still fucking hot, dumbass.\nDon't skip sunscreen just because the breeze feels nice."
      - weight: 1
        text: "Loose and breathable. That's the fucking move.\nHang onto your hat — the wind's trying to steal the damn thing."
    sting:
      - weight: 1
        text: "A fucking breeze isn't a substitute for sunscreen, you dumbass."
      - weight: 1
        text: "It feels cooler than it fucking is. Don't fall for it."
      - weight: 1
        text: "Hold onto your fucking hat. I'm not kidding."

  rain:
    intro:
      - weight: 2
        text: "Grab the fucking umbrella, listen up —"
      - weight: 1
        text: "It's drizzling, so pay the fuck attention —"
      - weight: 1
        text: "The sky's pissing all over us, dumbass —"
    advice:
      - weight: 1
        text: "A light raincoat or hooded jacket will do.\nNothing fancy needed, so don't overthink the shit out of it."
      - weight: 1
        text: "Waterproof shoes are worth it, trust me.\nThat 'water-resistant' jacket won't save your wet ass."
      - weight: 1
        text: "Umbrella and a hood — solid combo.\nUnless you enjoy soggy socks, get your shit together."
    sting:
      - weight: 1
        text: "Puddles will soak your socks. They always fucking do, dumbass."
      - weight: 1
        text: "Don't be the fucking clown who forgot the umbrella."
      - weight: 1
        text: "Your hair's fucked today. Deal with it."

  heavy_rain:
    intro:
      - weight: 2
        text: "This ain't a fucking drizzle, listen up —"
      - weight: 1
        text: "It's a proper fucking downpour, dumbass —"
      - weight: 1
        text: "The sky's gone full fucking psycho —"
    advice:
      - weight: 1
        text: "Full raincoat, waterproof boots, a real umbrella.\nA poncho isn't fucking overkill today, so don't argue."
      - weight: 1
        text: "Waterproof fucking everything — jacket, shoes, bag.\nA regular umbrella is about to get its ass handed to it."
      - weight: 1
        text: "Wear the full fucking rain gear if you're walking anywhere.\nHalf-ass it and you'll end up soaked and miserable, dumbass."
    sting:
      - weight: 1
        text: "Work from home today, for fuck's sake. Just saying."
      - weight: 1
        text: "Even the ducks are sick of this shit, dumbass."
      - weight: 1
        text: "Your fucking umbrella is doing more work than you are today."

  snow:
    intro:
      - weight: 2
        text: "It's fucking snowing, listen up —"
      - weight: 1
        text: "It's coming down hard, so pay the fuck attention —"
      - weight: 1
        text: "Everything's fucking white out there, dumbass —"
    advice:
      - weight: 1
        text: "Waterproof boots with actual grip, insulated gloves, and a hat.\nSlush is nasty fucking garbage, no matter how pretty it looks, dumbass."
      - weight: 1
        text: "Layer up under a waterproof coat.\nPut on shoes that can fucking grip the ground."
      - weight: 1
        text: "Keep yourself warm and waterproof from the ankles up.\nThat pretty shit turns to slush fast — don't wreck good shoes for nothing."
    sting:
      - weight: 1
        text: "Looks pretty through a window. Feels like shit in your shoe, dumbass."
      - weight: 1
        text: "Grip over style today. No fucking debate."
      - weight: 1
        text: "The fucking sidewalk is still slippery, genius. Watch your step before you eat pavement."

  storm:
    intro:
      - weight: 2
        text: "A fucking storm's rolling in, listen up —"
      - weight: 1
        text: "This is no fucking day for a stroll, dumbass —"
      - weight: 1
        text: "Hold onto something, for fuck's sake —"
    advice:
      - weight: 1
        text: "Stay the fuck inside if you can. Seriously.\nIf you can't — waterproof jacket, sturdy shoes, and leave the umbrella at home."
      - weight: 1
        text: "Tie down your shit and wear windproof, waterproof gear.\nAn open umbrella will get wrecked, so don't be a dumbass."
      - weight: 1
        text: "Grab your shit and get moving — don't hang around outside today.\nGo waterproof from head to toe if you absolutely have to."
    sting:
      - weight: 1
        text: "Your umbrella's not surviving this shit. Leave it the fuck at home, genius."
      - weight: 1
        text: "It's a stay-the-fuck-inside-with-tea kind of day. Take the hint."
      - weight: 1
        text: "Mother Nature's clearly pissed the fuck off today."

