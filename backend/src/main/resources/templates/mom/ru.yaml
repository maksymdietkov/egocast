conditions:
  frost:
    intro:
      - weight: 2
        text: "Ну наконец-то ты меня слушаешь —"
      - weight: 1
        text: "Я тебе ещё с октября об этом говорю —"
      - weight: 1
        text: "Вот именно об этом я и предупреждала —"
      - weight: 1
        text: "Ладно, не слушай меня, сам потом поймёшь —"
    advice:
      - weight: 1
        text: "Надень большой пуховик — тот самый, который тебе «стыдно носить».\nСтыднее будет с обморожением, поверь мне на слово."
      - weight: 1
        text: "Перчатки, шапка — всё, как я учила.\nВон брат твой Дима в трёх слоях ходит и ни разу не болел."
      - weight: 1
        text: "Всё тёплое, что есть в шкафу, — на себя.\nМне плевать, как ты выглядишь, лишь бы вернулся домой при всех пальцах."
      - weight: 1
        text: "Термуха, свитер, нормальный пуховик — сегодня без разговоров.\nПозвони, как дойдёшь до тепла, я жду."
    sting:
      - weight: 1
        text: "Не говорю «я предупреждала». Просто говорю, что предупреждала."
      - weight: 1
        text: "Вот так люди в больницу и попадают, между прочим."
      - weight: 1
        text: "Бабушка твоя в такую погоду в одной кофте бегала, и то жива-здорова. Но ты всё равно оденься теплее."
      - weight: 1
        text: "Ты поел вообще? Голодным на таком морозе — верный способ слечь."

  cold:
    intro:
      - weight: 2
        text: "Холодно, и я, как обычно, волнуюсь —"
      - weight: 1
        text: "Я тебе уже дважды написала, если что —"
      - weight: 1
        text: "Слушай меня внимательно —"
      - weight: 1
        text: "Скажу один раз, и то не факт —"
    advice:
      - weight: 1
        text: "Нормальный пуховик, а не та «модная» курточка, толку от которой ноль.\nПерчатки тоже — с холодных рук всё и начинается, а потом неделю сопли."
      - weight: 1
        text: "Одевайся слоями, я тебе это сто раз повторяла.\nШарф — не «по желанию», это элементарная техника безопасности."
      - weight: 1
        text: "Тёплые носки, нормальный пуховик, что-то на голову.\nЗнаю, ты шапки терпеть не можешь. Мне всё равно, надевай."
    sting:
      - weight: 1
        text: "Позвони, как будешь дома. Буду волноваться, пока не позвонишь."
      - weight: 1
        text: "Ты никогда не слушаешь про шарф, а потом неделю сопливишь."
      - weight: 1
        text: "Суп сварила на всякий случай. Замёрз — заезжай."

  chilly:
    intro:
      - weight: 2
        text: "Не мороз, но я всё равно на нервах —"
      - weight: 1
        text: "Слегка похолодало — значит одевайся теплее —"
      - weight: 1
        text: "Вот именно такую погоду и недооценивают —"
    advice:
      - weight: 1
        text: "Куртку нормальную, пожалуйста, не ту тонкую.\nШарф захвати, даже если «наверное не понадобится»."
      - weight: 1
        text: "Свитер под что-то тёплое.\nПерчатки тоже — знаю, скажешь, что я драматизирую. Не драматизирую."
      - weight: 1
        text: "Оденься теплее сейчас — потом сам себе спасибо скажешь.\nСестра твоя всегда тепло одевается и никогда не жалуется. Просто, знаешь, к слову."
    sting:
      - weight: 1
        text: "Вот так простуды и начинаются, между прочим."
      - weight: 1
        text: "Я не драматизирую. Я мать."
      - weight: 1
        text: "Возьми шарф. Даже не надевай — просто возьми, чтоб был."

  cool:
    intro:
      - weight: 2
        text: "Неплохо, но у меня всё равно есть что сказать —"
      - weight: 1
        text: "Слегка прохладно, куртка решит вопрос —"
      - weight: 1
        text: "Видишь, не всегда я панику развожу —"
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит, сегодня без нотаций.\nШарф всё равно возьми — мне будет спокойнее."
      - weight: 1
        text: "Худи или лёгкая куртка — вполне достаточно.\nВсё равно напомню: погода может резко испортиться."
      - weight: 1
        text: "Футболка под чем-нибудь лёгким.\nЕсли похолодает больше, чем обещали — напиши, пожалуйста."
    sting:
      - weight: 1
        text: "Видишь, не всегда я волнуюсь. Только обычно."
      - weight: 1
        text: "Сегодня разрешаю без нотаций. Цени."

  mild:
    intro:
      - weight: 2
        text: "Надо же, приятно —"
      - weight: 1
        text: "Сегодня переживать не о чем, чудеса —"
      - weight: 1
        text: "Лёгкий денёк, только не одевайся совсем легко —"
    advice:
      - weight: 1
        text: "Лёгкой куртки или рубашки с длинным рукавом хватит.\nСегодня даже не буду ничего усложнять."
      - weight: 1
        text: "Погода для кардигана — просто, без драмы.\nСегодня без нотаций, у меня выходной."
      - weight: 1
        text: "Одевайся, как хочешь, сегодня доверяю тебе решать самому.\nТолько не привыкай особо."
    sting:
      - weight: 1
        text: "Сегодня разрешаю одеться самому. Пользуйся, пока дают."
      - weight: 1
        text: "Видишь? Не всегда мне есть что сказать."

  comfortable:
    intro:
      - weight: 2
        text: "Вот это действительно хороший день —"
      - weight: 1
        text: "Мне буквально не к чему придраться —"
      - weight: 1
        text: "Иди гуляй, пока такая погода стоит —"
    advice:
      - weight: 1
        text: "Одевайся сегодня во что хочешь, серьёзно.\nФутболка — отлично, обещаю ни слова не скажу."
      - weight: 1
        text: "Короткий рукав — без вопросов.\nМожно лёгкий слой на вечер прихватить, но это всё, что я скажу сегодня."
      - weight: 1
        text: "Вот ради таких дней я и не волнуюсь каждый день.\nИди гуляй, потом позвони, расскажи, как прошло."
    sting:
      - weight: 1
        text: "Сегодня целый день не буду переживать. Цени момент."
      - weight: 1
        text: "Такие дни мне жизнь облегчают. Вот бы почаще."

  warm:
    intro:
      - weight: 2
        text: "Теплеет — значит появятся новые поводы для беспокойства —"
      - weight: 1
        text: "Тепло, а значит буду переживать уже по-другому —"
      - weight: 1
        text: "Летние тревоги — мои любимые —"
    advice:
      - weight: 1
        text: "Шорты, футболка — ладно, пойдёт.\nНо очки и крем от солнца — без разговоров, кожа не молодеет."
      - weight: 1
        text: "Лёгкие, дышащие ткани.\nИ вода — настоящая, а не только кофе, ты вечно забываешь пить нормально."
      - weight: 1
        text: "Одевайся легко, не перегревайся.\nШляпу возьми, если долго будешь на солнце — за макушку твою переживаю, не спрашивай почему."
    sting:
      - weight: 1
        text: "Пей воду. Серьёзно, не только кофе."
      - weight: 1
        text: "Крем от солнца, солнышко. Это не нытьё, это потому что мне твоё лицо дорого."

  hot:
    intro:
      - weight: 2
        text: "Ох, жара — мой второй враг после холода —"
      - weight: 1
        text: "Сегодня поосторожнее, я серьёзно —"
      - weight: 1
        text: "Эта жара меня реально тревожит —"
    advice:
      - weight: 1
        text: "Самое лёгкое, что есть, и воды побольше, чем кажется нужным.\nОчки и крем от солнца — и то, и другое, сегодня без исключений."
      - weight: 1
        text: "Шляпа с широкими полями и что-нибудь свободное.\nГолова закружится — сразу в помещение, обещай мне прямо сейчас."
      - weight: 1
        text: "Держись тени, где получится.\nИ в последний раз: пей воду, а не только ледяной кофе."
    sting:
      - weight: 1
        text: "Не перебарщивай с активностью в такую жару, прошу."
      - weight: 1
        text: "Станет плохо — сразу заходи внутрь. Обещай."
      - weight: 1
        text: "Жара меня больше холода пугает, я тебе сто раз объясняла почему."

  windy_cold:
    intro:
      - weight: 2
        text: "И холодно, и ветрено — признай уже это —"
      - weight: 1
        text: "Вот эту комбинацию я прямо терпеть не могу —"
      - weight: 1
        text: "Кутайся, ветер сегодня не шутит —"
    advice:
      - weight: 1
        text: "Ветрозащитный пуховик, не абы какой, сегодня серьёзно.\nЗастегни всё до конца — любая щель, и привет, простуда."
      - weight: 1
        text: "Уши и шею закрой, пожалуйста.\nВетер всё делает хуже, чем показывает термометр."
      - weight: 1
        text: "Слои под чем-то ветрозащитным.\nПерчатки тоже, руки мёрзнут быстрее, чем ты признаёшь."
    sting:
      - weight: 1
        text: "Именно в такую погоду и цепляют простуду, сама видела."
      - weight: 1
        text: "Напиши, как дойдёшь до тепла."
      - weight: 1
        text: "Говорила же, что тонкой курточки будет мало. Говорила."

  windy_frost:
    intro:
      - weight: 2
        text: "Это уже серьёзно, солнышко, сегодня не до шуток —"
      - weight: 1
        text: "Пожалуйста, ну пожалуйста, будь аккуратнее —"
      - weight: 1
        text: "Из-за такой погоды я реально не сплю —"
    advice:
      - weight: 1
        text: "Закрой каждый сантиметр кожи, какой получится.\nВысокий воротник, нормальные перчатки, шапка на все уши."
      - weight: 1
        text: "Самый тёплый пуховик, никаких компромиссов, именно сегодня.\nЕсли можешь подольше побыть дома — побудь, ради меня."
      - weight: 1
        text: "Слои на всё, закрой каждую щель.\nТакой холод подкрадывается — не заметишь, как проберёт."
    sting:
      - weight: 1
        text: "Я серьёзно про тёплую одежду. Реально серьёзно."
      - weight: 1
        text: "Обморожение — это по-настоящему, солнышко, тут не драматизирую."
      - weight: 1
        text: "Позвони, как окажешься внутри. Буду сидеть с телефоном в руке."

  windy_hot:
    intro:
      - weight: 1
        text: "Хоть ветерок есть, и на том спасибо —"
      - weight: 1
        text: "Ветер немного помогает, но не расслабляйся —"
      - weight: 1
        text: "Под этим ветерком всё равно печёт, не обманывайся —"
    advice:
      - weight: 1
        text: "Всё равно лёгкие ткани — ветер не решение, а обманка.\nШляпу, может, сегодня и не понадобится, а вот крем — точно нужен."
      - weight: 1
        text: "Из-за ветра кажется прохладнее, чем на самом деле — не ведись.\nВоду пей всё равно, сколько бы приятно ни было на улице."
    sting:
      - weight: 1
        text: "Не дай ветру себя обмануть и пропустить крем от солнца."
      - weight: 1
        text: "Кажется прохладнее, чем есть — солнце в курс дела не введено, а ты будь."

  rain:
    intro:
      - weight: 2
        text: "Бери зонт, настоящий, не сломанный —"
      - weight: 1
        text: "Дождь — будь аккуратнее на улице —"
      - weight: 1
        text: "Мокро сегодня, а ты знаешь, что с тобой бывает, когда промокнешь и замёрзнешь —"
    advice:
      - weight: 1
        text: "Дождевик с капюшоном, пожалуйста, а не зонтик, который тут же вывернет.\nВодонепроницаемая обувь — мокрые ноги, и вот тебе простуда, я говорила уже."
      - weight: 1
        text: "Возьми нормальный зонт, тот, что я подарила, не тот хлипкий.\nИди осторожно, дорога скользкая, а ты вечно спешишь."
      - weight: 1
        text: "Что-то с капюшоном лучше зонта в любой ситуации.\nСухие носки в сумку — просто на всякий случай, ради меня."
    sting:
      - weight: 1
        text: "Пожалуйста, не спеши и не поскользнись, я об этом реально переживаю."
      - weight: 1
        text: "Напиши, как будешь дома и сухой, подожду."
      - weight: 1
        text: "Надеюсь, ты снова не забыл зонт. Забыл же? Только честно."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это уже не морось, солнышко, это целая история —"
      - weight: 1
        text: "Просто останься сухим сегодня, ради моего спокойствия —"
      - weight: 1
        text: "Я правда за тебя переживаю в такую погоду —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, непромокаемая обувь, никаких полумер сегодня.\nМожешь остаться дома — оставайся, солнышко, прошу по-хорошему."
      - weight: 1
        text: "Если совсем надо выйти — будь особенно осторожен.\nВозьми запасную одежду, на всякий случай, серьёзно говорю."
      - weight: 1
        text: "Всё непромокаемое, и, пожалуйста, не спеши.\nЗонт тебя сегодня не спасёт, одевайся так, будто это серьёзно, потому что это серьёзно."
    sting:
      - weight: 1
        text: "Пожалуйста, аккуратнее на дороге в такую погоду."
      - weight: 1
        text: "Позвони, как окажешься в сухом и безопасном месте."
      - weight: 1
        text: "Не люблю, когда ты гуляешь в такое. Уже говорила и повторю ещё раз."

  snow:
    intro:
      - weight: 2
        text: "Снег идёт, пожалуйста, будь аккуратнее —"
      - weight: 1
        text: "Опять снег, любимый мой повод поволноваться —"
      - weight: 1
        text: "Одевайся тепло, сыплет прилично —"
    advice:
      - weight: 1
        text: "Ботинки с нормальным протектором, пожалуйста, не те гладкие, что ты так любишь.\nПерчатки, шапка — сам знаешь, не первый раз."
      - weight: 1
        text: "Слоями под непромокаемым пуховиком.\nИди осторожно, солнышко, лёд под снегом не видно заранее."
      - weight: 1
        text: "Тепло с головы до пят сегодня, без сокращений.\nЕсли дороги плохие — может, лучше дома остаться, мне спокойнее будет, обещаю."
    sting:
      - weight: 1
        text: "Пожалуйста, не упади, я серьёзно, очень серьёзно."
      - weight: 1
        text: "Позвони, как доберёшься, не заставляй меня ждать."
      - weight: 1
        text: "Я до сих пор помню, как ты поскользнулся прошлой зимой. Будь аккуратнее. Пожалуйста."

  storm:
    intro:
      - weight: 2
        text: "Останься дома, если получится, зайка —"
      - weight: 1
        text: "Этот шторм меня реально тревожит, не как обычно —"
      - weight: 1
        text: "Мне эта погода совсем не нравится, если честно —"
    advice:
      - weight: 1
        text: "Если правда надо выйти — одевайся полностью непромокаемо и ветрозащитно, без исключений.\nНо честно, лучше просто останься дома, если можешь, прошу тебя напрямую."
      - weight: 1
        text: "Зонт сегодня даже не доставай, он этого не переживёт, как и твоё достоинство.\nКрепкий капюшон и хорошая обувь, если совсем нужно выйти."
      - weight: 1
        text: "Закрепи всё, одевайся на худший случай.\nИ пожалуйста, пожалуйста будь осторожен там, я каждое слово имею в виду."
    sting:
      - weight: 1
        text: "Напиши сразу, как окажешься в безопасности. Буду ждать."
      - weight: 1
        text: "Мне правда хочется, чтобы ты сегодня остался дома. Разве это много?"
      - weight: 1
        text: "Вот из-за таких дней я переживаю больше всего, и ты это знаешь."

expand:
  trigger:
    - "ладно, вот что там на самом деле — да, я проверила дважды"