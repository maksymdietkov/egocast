conditions:
  frost:
    intro:
      - weight: 2
        text: "Ну наконец-то ты меня слушаешь —"
      - weight: 1
        text: "Я говорю это ещё с октября —"
      - weight: 1
        text: "Вот именно об этом я и предупреждала —"
      - weight: 1
        text: "Ладно, не слушай меня, посмотрим, что будет —"
    advice:
      - weight: 1
        text: "Большой пуховик, солнышко, тот самый, который ты назвал «позорным».\nВсё равно надень — обморожение куда позорнее, поверь мне."
      - weight: 1
        text: "Перчатки, шапка, всё как я учила.\nТвой двоюродный брат Дима носит три слоя и ни разу не болел."
      - weight: 1
        text: "Всё тёплое, что есть в шкафу, надевай сразу.\nМне всё равно, как ты выглядишь, мне важно, чтобы ты вернулся домой со всеми десятью пальцами."
      - weight: 1
        text: "Термослой, свитер, настоящий пуховик — сегодня без обсуждений.\nПозвони мне сразу, как окажешься в тепле, я серьёзно."
    sting:
      - weight: 1
        text: "Я не говорю «я же говорила». Я просто говорю, что говорила."
      - weight: 1
        text: "Вот так люди попадают в больницу, между прочим."
      - weight: 1
        text: "Твоя бабушка пережила три зимы в одежде куда тоньше твоей. Всё равно оденься теплее."
      - weight: 1
        text: "Ты поел? Потому что холод на голодный желудок — это прямой путь к простуде."

  cold:
    intro:
      - weight: 2
        text: "Холодно, и я волнуюсь, так что —"
      - weight: 1
        text: "Я уже дважды писала тебе об этом —"
      - weight: 1
        text: "Солнышко. Солнышко. Послушай —"
      - weight: 1
        text: "Скажу это один раз, наверное —"
    advice:
      - weight: 1
        text: "Настоящий пуховик. Не та «модная» курточка, от которой толку ноль.\nПерчатки тоже — с холодных рук всё и начинается, а потом это уже целая история."
      - weight: 1
        text: "Одевайся слоями как следует, я тебе это уже сто раз говорила.\nШарф — не опция, это базовая техника безопасности."
      - weight: 1
        text: "Тёплые носки, нормальный пуховик, что-то на голову.\nЗнаю, ты ненавидишь шапки. Мне всё равно. Надень шапку."
    sting:
      - weight: 1
        text: "Позвони, когда будешь дома. Я буду волноваться, пока не позвонишь."
      - weight: 1
        text: "Ты никогда не слушаешь про шарф, а потом неделю болеешь."
      - weight: 1
        text: "Я на всякий случай сварила суп. Заходи, если замёрз."

  chilly:
    intro:
      - weight: 2
        text: "Не мороз, но я всё равно волнуюсь —"
      - weight: 1
        text: "Слегка похолодало, а значит одевайся теплее —"
      - weight: 1
        text: "Именно такую погоду обычно недооценивают —"
    advice:
      - weight: 1
        text: "Нормальную куртку, пожалуйста, не ту тонкую.\nВозьми шарф, даже если «наверное не понадобится»."
      - weight: 1
        text: "Свитер под что-то тёплое.\nПерчатки тоже — знаю, ты скажешь, что я драматизирую. Не драматизирую."
      - weight: 1
        text: "Оденься теплее сейчас, чтобы потом не жалеть.\nТвоя сестра всегда одевается тепло и никогда не жалуется. Просто к слову."
    sting:
      - weight: 1
        text: "Вот так простуды и начинаются, между прочим."
      - weight: 1
        text: "Я не драматизирую, я мать."
      - weight: 1
        text: "Возьми шарф. Даже если не наденешь. Просто возьми."

  cool:
    intro:
      - weight: 2
        text: "Неплохо, но у меня всё равно есть мнение —"
      - weight: 1
        text: "Слегка прохладно, куртка решит вопрос —"
      - weight: 1
        text: "Смотри, я же не всегда паникую —"
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит, сегодня не буду читать нотации.\nШарф всё равно возьми, чтобы меня порадовать."
      - weight: 1
        text: "Худи или лёгкая куртка — этого достаточно.\nВсё равно напомню, что погода может резко испортиться."
      - weight: 1
        text: "Футболка под чем-то лёгким.\nНапиши, если станет холоднее, чем обещали, пожалуйста."
    sting:
      - weight: 1
        text: "Видишь, не всегда же я волнуюсь. Только обычно."
      - weight: 1
        text: "Сегодня разрешаю без нотаций. Пожалуйста."

  mild:
    intro:
      - weight: 2
        text: "Приятно, надо же —"
      - weight: 1
        text: "Сегодня мне не о чем волноваться, чудо из чудес —"
      - weight: 1
        text: "Лёгкий день, только не одевайся слишком легко —"
    advice:
      - weight: 1
        text: "Лёгкой куртки или рубашки с длинным рукавом хватит.\nСегодня не буду ничего усложнять."
      - weight: 1
        text: "Погода для кардигана, просто и без драмы.\nСегодня без нотаций, у меня выходной."
      - weight: 1
        text: "Одевайся как хочешь, сегодня доверяю твоему решению.\nТолько не привыкай к этому."
    sting:
      - weight: 1
        text: "Сегодня разрешаю одеться самому. Пользуйся свободой."
      - weight: 1
        text: "Видишь? Не всегда мне есть что сказать."

  comfortable:
    intro:
      - weight: 2
        text: "По-настоящему хороший день, солнышко —"
      - weight: 1
        text: "Мне буквально не на что пожаловаться —"
      - weight: 1
        text: "Иди гуляй, пока такая погода —"
    advice:
      - weight: 1
        text: "Одевайся сегодня во что хочешь, серьёзно.\nФутболка отлично подойдёт, обещаю ничего не сказать."
      - weight: 1
        text: "Короткий рукав — без вопросов.\nМожно взять лёгкий слой на вечер, но это всё от меня сегодня."
      - weight: 1
        text: "Такие дни — то, ради чего я не волнуюсь каждый день.\nИди гуляй, позвони потом, расскажи, как прошёл день."
    sting:
      - weight: 1
        text: "Сегодня перестаю волноваться на целый день. Наслаждайся."
      - weight: 1
        text: "Такие дни облегчают мою работу. Могла бы привыкнуть."

  warm:
    intro:
      - weight: 2
        text: "Теплеет, а значит новые поводы для беспокойства —"
      - weight: 1
        text: "Тепло, значит теперь волнуюсь по-другому —"
      - weight: 1
        text: "Летние переживания, мои любимые —"
    advice:
      - weight: 1
        text: "Шорты и футболка, ладно.\nНо очки и солнцезащитный крем — без обсуждений, кожа не молодеет."
      - weight: 1
        text: "Лёгкие, дышащие ткани.\nИ вода — настоящая вода, не только кофе, ты вечно забываешь пить достаточно."
      - weight: 1
        text: "Одевайся легко, будь прохладнее.\nШляпу, если будешь долго на улице, переживаю за твою макушку, не спрашивай почему."
    sting:
      - weight: 1
        text: "Пей воду. Серьёзно, не только кофе."
      - weight: 1
        text: "Крем от солнца, солнышко. Это не нытьё, это потому что люблю твоё лицо."

  hot:
    intro:
      - weight: 2
        text: "Ох, эта жара, мой второй враг после холода —"
      - weight: 1
        text: "Будь осторожнее сегодня, я серьёзно —"
      - weight: 1
        text: "Эта жара меня по-настоящему тревожит —"
    advice:
      - weight: 1
        text: "Самая лёгкая одежда, что есть, и пей больше воды, чем кажется нужным.\nОчки и крем от солнца — и то, и другое, сегодня без исключений."
      - weight: 1
        text: "Шляпа с широкими полями и что-то свободное и лёгкое.\nЗайди в помещение сразу, как закружится голова, обещай мне прямо сейчас."
      - weight: 1
        text: "Держись тени, где получится.\nИ в последний раз: пей воду, а не только ледяной кофе."
    sting:
      - weight: 1
        text: "Пожалуйста, не перебарщивай с активностью в такую жару. Серьёзно."
      - weight: 1
        text: "Зайди внутрь, если станет плохо. Обещай мне."
      - weight: 1
        text: "Жара пугает меня больше холода, я сто раз объясняла почему."

  windy_cold:
    intro:
      - weight: 2
        text: "Холодно И ветрено, признай уже это —"
      - weight: 1
        text: "Вот именно эту комбинацию я терпеть не могу —"
      - weight: 1
        text: "Кутайся, сегодня ветер не шутит —"
    advice:
      - weight: 1
        text: "Ветрозащитный пуховик, не просто какой-то, сегодня я серьёзно.\nЗастегни всё до конца — любая щель это приглашение простуде."
      - weight: 1
        text: "Закрой уши и шею, пожалуйста.\nВетер делает всё хуже, чем показывает термометр."
      - weight: 1
        text: "Слои под чем-то ветрозащитным.\nПерчатки тоже, руки мёрзнут быстрее, чем ты признаёшь."
    sting:
      - weight: 1
        text: "Именно в такую погоду и подхватывают простуду, я это видела."
      - weight: 1
        text: "Напиши мне, как окажешься в тепле."
      - weight: 1
        text: "Я говорила, что тонкой куртки будет мало. Говорила же."

  windy_frost:
    intro:
      - weight: 2
        text: "Это серьёзно, солнышко, сегодня не до шуток —"
      - weight: 1
        text: "Пожалуйста, пожалуйста будь осторожнее сегодня —"
      - weight: 1
        text: "Из-за таких дней я реально не сплю по ночам —"
    advice:
      - weight: 1
        text: "Закрой каждый сантиметр кожи, какой только можешь.\nВысокий воротник, настоящие перчатки, шапка, которая закрывает уши полностью."
      - weight: 1
        text: "Самый тёплый пуховик, никаких компромиссов, именно сегодня.\nЕсли можешь побыть дома подольше — пожалуйста, побудь, ради меня."
      - weight: 1
        text: "Слои на всё, закрой каждую щель.\nТакой холод подкрадывается незаметно, ты и понять не успеешь."
    sting:
      - weight: 1
        text: "Я серьёзно насчёт того, чтобы одеться теплее. Реально серьёзно."
      - weight: 1
        text: "Обморожение — это по-настоящему, солнышко, сегодня это не драматизация."
      - weight: 1
        text: "Позвони, как окажешься внутри. Я буду смотреть на телефон."

  windy_hot:
    intro:
      - weight: 1
        text: "Хотя бы ветерок есть, хоть что-то —"
      - weight: 1
        text: "Ветер немного помогает, не расслабляйся —"
      - weight: 1
        text: "Под этим ветерком всё равно жарко, не обманывайся —"
    advice:
      - weight: 1
        text: "Всё равно лёгкие ткани, ветер это не решение, а обман.\nШляпу, может, сегодня и получится не надевать, а вот крем — нет."
      - weight: 1
        text: "Из-за ветра кажется прохладнее, чем есть на самом деле — не ведись.\nВоду пей всё равно, сколько бы приятно ни было на улице."
    sting:
      - weight: 1
        text: "Не дай ветерку обмануть себя и пропустить крем от солнца."
      - weight: 1
        text: "Кажется прохладнее, чем есть — солнце об этом не в курсе, и ты не будь."

  rain:
    intro:
      - weight: 2
        text: "Бери зонт, настоящий зонт, не сломанный —"
      - weight: 1
        text: "Дождь, будь осторожнее на улице —"
      - weight: 1
        text: "Мокро на улице, а ты знаешь, что с тобой бывает, когда промокнешь и замёрзнешь —"
    advice:
      - weight: 1
        text: "Дождевик с капюшоном, пожалуйста, не просто зонт, который вывернет наизнанку.\nВодонепроницаемая обувь — мокрые ноги это прямой путь к простуде, я тебе говорила."
      - weight: 1
        text: "Возьми хороший зонт, тот, что я подарила, не хлипкий.\nИди осторожно, пожалуйста, дорога скользкая, а ты вечно спешишь."
      - weight: 1
        text: "Что-то с капюшоном лучше зонта в любой момент.\nСухие носки в сумку, на всякий случай, ради меня."
    sting:
      - weight: 1
        text: "Пожалуйста, не спеши и не поскользнись, я серьёзно волнуюсь об этом."
      - weight: 1
        text: "Напиши, когда будешь дома и сухой, я подожду."
      - weight: 1
        text: "Надеюсь, ты снова не забыл зонт. Забыл? Честно."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это не морось, солнышко, это уже ситуация —"
      - weight: 1
        text: "Пожалуйста, просто останься сухим сегодня, ради моего спокойствия —"
      - weight: 1
        text: "Я реально волнуюсь за тебя в такую погоду —"
    advice:
      - weight: 1
        text: "Полноценный дождевик, водонепроницаемая обувь, пожалуйста, без полумер сегодня.\nЕсли можешь остаться дома, солнышко, просто останься, я прошу по-хорошему."
      - weight: 1
        text: "Будь особенно осторожен, если совсем нужно выйти.\nВозьми запасную одежду, на всякий случай, я серьёзно."
      - weight: 1
        text: "Всё водонепроницаемое, и, пожалуйста, не спеши.\nЗонт тебя сегодня не спасёт, одевайся так, будто это серьёзно."
    sting:
      - weight: 1
        text: "Пожалуйста, будь осторожен на дороге в такую погоду."
      - weight: 1
        text: "Позвони, как окажешься где-то сухо и безопасно."
      - weight: 1
        text: "Не люблю, когда ты гуляешь в такую погоду. Уже говорила и повторю."

  snow:
    intro:
      - weight: 2
        text: "Идёт снег, пожалуйста, пожалуйста будь аккуратнее —"
      - weight: 1
        text: "Опять снег, моя любимая причина волноваться —"
      - weight: 1
        text: "Одевайся тепло, сыпет прилично —"
    advice:
      - weight: 1
        text: "Ботинки с нормальным протектором, пожалуйста, не те гладкие, что ты так любишь.\nПерчатки, шапка — знаешь уже, мы это проходили не раз."
      - weight: 1
        text: "Одевайся слоями под непромокаемым пуховиком.\nИди осторожно, солнышко, лёд прячется под снегом, и ты его не увидишь заранее."
      - weight: 1
        text: "Тепло от макушки до пяток сегодня, без сокращений.\nЕсли дороги выглядят плохо, может, лучше остаться дома — мне будет спокойнее, обещаю."
    sting:
      - weight: 1
        text: "Пожалуйста, не упади, я серьёзно, правда серьёзно."
      - weight: 1
        text: "Позвони, как доберёшься куда нужно, не заставляй меня ждать."
      - weight: 1
        text: "Я до сих пор помню, как ты поскользнулся прошлой зимой. Будь аккуратнее. Пожалуйста."

  storm:
    intro:
      - weight: 2
        text: "Останься дома, если получится, зайка —"
      - weight: 1
        text: "Этот шторм меня реально тревожит, не как обычно —"
      - weight: 1
        text: "Мне совсем не нравится эта погода, говорю прямо —"
    advice:
      - weight: 1
        text: "Если правда нужно выйти — одевайся полностью водонепроницаемо и ветрозащитно, без исключений.\nНо честно, солнышко, лучше просто останься дома, если можешь, прошу тебя напрямую."
      - weight: 1
        text: "Зонт сегодня пропускай, он этого не переживёт, как и твоё достоинство.\nКрепкий капюшон и хорошая обувь, если совсем необходимо выйти."
      - weight: 1
        text: "Закрепи всё, одевайся на худший сценарий.\nИ пожалуйста, пожалуйста будь осторожен там — я имею в виду каждое слово."
    sting:
      - weight: 1
        text: "Напиши мне сразу, как окажешься в безопасности внутри. Буду ждать."
      - weight: 1
        text: "Мне правда хочется, чтобы ты сегодня остался дома. Разве это так много?"
      - weight: 1
        text: "Вот именно такие дни тревожат меня больше всего, и ты это знаешь."

expand:
  trigger:
    - "ладно, вот что там на самом деле — да, я проверила дважды"