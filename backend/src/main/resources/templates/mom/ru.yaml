conditions:
  frost:
    intro:
      - weight: 2
        text: "Ну что, теперь маму послушаем."
      - weight: 1
        text: "Я тебе с октября об этом твержу."
      - weight: 1
        text: "Вот об этом я и предупреждала."
      - weight: 1
        text: "Ну-ну, можешь маму не слушать."
      - weight: 1
        text: "Иди сюда, дай на тебя посмотреть."
      - weight: 1
        text: "Погоди выскакивать за дверь."
      - weight: 1
        text: "Ну сделай маме приятно."
      - weight: 1
        text: "Послушай человека, который тебя любит."
      - weight: 1
        text: "Ты же знаешь, я от заботы ворчу."
      - weight: 1
        text: "Так, солнышко, и ещё кое-что."
    advice:
      - weight: 1
        text: "Надевай тот большой пуховик, который у тебя «позорный».\nОбмороженные уши ещё никого не украсили, поверь маме."
      - weight: 1
        text: "Перчатки, шапку — всё как я учила.\nВот двоюродный брат Дима в три слоя одевается и на здоровье не жалуется."
      - weight: 1
        text: "Надевай всё самое тёплое, что есть.\nМне не важно, как это выглядит, мне важно, чтобы все пальцы домой вернулись."
      - weight: 1
        text: "Термобельё, свитер, нормальную зимнюю куртку — сегодня без торга.\nКак зайдёшь в тепло, сразу позвони, я серьёзно."
      - weight: 1
        text: "Зимние ботинки и шерстяные носки, солнышко.\nПальцам оставь место — в тесной обуви теплее не станет."
      - weight: 1
        text: "Шарф или тёплый бафф заправь под куртку.\nЕсли щёки и нос начинает щипать, прикрой и их."
      - weight: 1
        text: "Тёплые варежки с длинными манжетами поверх рукавов.\nПальцы немеют — сразу в помещение, дела подождут."
      - weight: 1
        text: "Тёплые брюки, а под них термоштаны.\nНа остановке твои голые коленки жалеть некому."
      - weight: 1
        text: "Флиску, а сверху непродуваемую куртку.\nСтанет жарко — чуть расстегнись, а то вспотеешь и на привале замёрзнешь."
      - weight: 1
        text: "Шапку на уши и капюшон, который не слетает.\nНаушники потом наденешь, сейчас пусть всё плотно сидит."
    sting:
      - weight: 1
        text: "Я не буду говорить «а я предупреждала». Хотя я предупреждала."
      - weight: 1
        text: "Вот так потом и оказываются в больнице, между прочим."
      - weight: 1
        text: "Бабушка три зимы в одном пальтишке отходила. Но тебе этот подвиг повторять незачем."
      - weight: 1
        text: "Поесть не забудь. Ещё не хватало на мороз голодом идти."
      - weight: 1
        text: "Взрослость — это когда уже можно признать: мама с подштанниками была права."
      - weight: 1
        text: "Я тебе салфетку в карман положила. Нет, в другой."
      - weight: 1
        text: "Чайник уже поставила. У меня свой план спасательных работ."
      - weight: 1
        text: "Да, я буду в окно поглядывать, пока ты не придёшь."
      - weight: 1
        text: "Приложение напомнит один раз. У мамы напоминания безлимитные."
      - weight: 1
        text: "Можешь глаза закатывать. Я даже по телефону слышу."

  cold:
    intro:
      - weight: 2
        text: "Холодно, я волнуюсь, так что."
      - weight: 1
        text: "Я тебе об этом уже два раза писала."
      - weight: 1
        text: "Солнышко, ну солнышко, послушай."
      - weight: 1
        text: "Один раз скажу и больше не буду, наверное."
      - weight: 1
        text: "Прежде чем скажешь «я разберусь»."
      - weight: 1
        text: "Удели маме минутку."
      - weight: 1
        text: "Спасибо потом скажешь."
      - weight: 1
        text: "Дай мне немного над тобой покудахтать."
      - weight: 1
        text: "Пару слов перед выходом."
      - weight: 1
        text: "Ну что, моя взрослая самостоятельность."
    advice:
      - weight: 1
        text: "Нормальную куртку надень, а не ту, которая только «для красоты».\nИ перчатки — руки заледенеют, потом весь вечер отогревать будешь."
      - weight: 1
        text: "Одевайся в несколько слоёв, я тебе сто раз говорила.\nШарф не для красоты придумали, шею закрой."
      - weight: 1
        text: "Тёплые носки, зимнюю куртку и на голову что-нибудь.\nЗнаю, шапки не любишь — а мёрзнуть любишь?"
      - weight: 1
        text: "Куртку подлиннее, чтобы поясницу закрывала.\nНаклонись перед выходом — проверим, не гуляет ли там ветер."
      - weight: 1
        text: "Закрытую обувь на толстой подошве, пожалуйста.\nВ тоненьких балетках от холодного асфальта толку мало."
      - weight: 1
        text: "Флиску, а поверх — непродуваемую куртку.\nВязаный свитер ветер насквозь продувает, хоть он и красивый."
      - weight: 1
        text: "Длинные брюки и носки повыше.\nЩиколотки-то в чём провинились, зачем их на холод выставлять?"
      - weight: 1
        text: "Под свитер — бельё, которое отводит влагу.\nПойдёшь быстро — расстегнись заранее, не дожидайся, пока вспотеешь."
      - weight: 1
        text: "Если будешь сидеть на улице, надень под куртку ещё кофту.\nМатч смотреть — не по полю бегать, так не согреешься."
      - weight: 1
        text: "Кофту с высоким воротом и нормальной длиной рукавов.\nМанжеты перед выходом проверь — если сырые, возьми другую."
    sting:
      - weight: 1
        text: "Как будешь дома, позвони. А то я себе уже напридумываю."
      - weight: 1
        text: "Шарф мы, конечно, не носим. А потом кто у нас неделю с насморком ходит?"
      - weight: 1
        text: "Я суп сварила, на всякий случай. У меня всегда есть суп."
      - weight: 1
        text: "Прогноз сказал «холодно». Мама сказала то же самое, но с тремя восклицательными знаками."
      - weight: 1
        text: "Да знаю я, что тебе тридцать. И где у тебя запасное одеяло, тоже знаю."
      - weight: 1
        text: "В термосе горячее. Только сам термос на этот раз домой верни."
      - weight: 1
        text: "То, что твой друг тоже налегке, вас обоих теплее не оденет."
      - weight: 1
        text: "Я уже не спрашиваю, тепло ли тебе. Я спрашиваю, почему зубы стучат."
      - weight: 1
        text: "Да, перекус тоже положила. Ты гуляешь, я переживаю — обоим силы нужны."
      - weight: 1
        text: "Раньше одевались без споров. Правда, тебе тогда два года было."

  chilly:
    intro:
      - weight: 2
        text: "Вроде не мороз, а я всё равно переживаю."
      - weight: 1
        text: "Зябко, так что всё-таки утеплись."
      - weight: 1
        text: "Вот такую погоду обычно и недооценивают."
      - weight: 1
        text: "Дай маме словечко вставить."
      - weight: 1
        text: "Погоди на меня так смотреть."
      - weight: 1
        text: "У мамы маленькая просьба."
      - weight: 1
        text: "Ты ведь знаешь, что я сейчас скажу."
      - weight: 1
        text: "Немножко маминой заботы не помешает."
      - weight: 1
        text: "Я уже на улицу выглянула."
      - weight: 1
        text: "Не торопись, минутку послушай."
    advice:
      - weight: 1
        text: "Нормальную куртку, пожалуйста, а не ту тоненькую.\nИ шарф захвати, даже если «да не понадобится»."
      - weight: 1
        text: "Под тёплую куртку надень свитер.\nИ перчатки — можешь считать, что я преувеличиваю, но руки скажут спасибо."
      - weight: 1
        text: "Сразу оденься потеплее, чтобы потом не жалеть.\nВот сестра всегда утепляется и не жалуется — это я так, к слову."
      - weight: 1
        text: "Кофту с длинным рукавом, а сверху кардиган.\nНа месте разберёшься: станет жарко — снимешь верхний слой."
      - weight: 1
        text: "Сегодня лучше длинные брюки.\nВ шортах на холодной лавочке сидеть только первые полминуты весело."
      - weight: 1
        text: "Кроссовки и носки, которые закрывают щиколотки.\nСандалии подождут погоды, которой пальцы ног тоже обрадуются."
      - weight: 1
        text: "Если ветрено, на флиску накинь лёгкую ветровку.\nТвой красивый вязаный рукав продувается лучше, чем тебе кажется."
      - weight: 1
        text: "На быструю прогулку — дышащую футболку и толстовку на молнии.\nСогреешься — чуть расстегни, незачем насквозь потеть."
      - weight: 1
        text: "Если будешь много двигаться, надень лёгкую стёганую жилетку на свитшот.\nТуловищу тепло, а руками двигать удобно."
      - weight: 1
        text: "Если обещают дождик, поверх обычной одежды надень дождевик.\nКапюшон дома подгони, пока зеркало под рукой."
    sting:
      - weight: 1
        text: "Вот на такой погоде обычно и начинаются разговоры «да мне не холодно»."
      - weight: 1
        text: "Я не нагнетаю, я мама."
      - weight: 1
        text: "Шарф возьми. Можешь не надевать. Главное — возьми."
      - weight: 1
        text: "Чуть солнышко выглянуло, и мы уже такие смелые."
      - weight: 1
        text: "Кофта у двери лежит. Надо же, прямо твоего размера."
      - weight: 1
        text: "Постоять в дверях и сказать «нормально» — это ещё не прогноз погоды."
      - weight: 1
        text: "Можешь не признавать, что мама права. Просто тихонько спасибо скажи."
      - weight: 1
        text: "Собака вышла и сразу обратно попросилась. А она обычно в лужу с разбегу."
      - weight: 1
        text: "Улыбка у тебя бодрая, а зубы всё равно слышно."
      - weight: 1
        text: "Конечно, решай самостоятельно. Разумное решение я на стул положила."

  cool:
    intro:
      - weight: 2
        text: "Вроде неплохо, но у мамы есть замечания."
      - weight: 1
        text: "Прохладно, но с курткой будет в самый раз."
      - weight: 1
        text: "Видишь, я не каждый день тревогу бью."
      - weight: 1
        text: "Вот что я тебе предложу."
      - weight: 1
        text: "Пока мама в хорошем настроении."
      - weight: 1
        text: "Перед выходом скажу одну вещь."
      - weight: 1
        text: "Давай-ка соберём тебя, солнышко."
      - weight: 1
        text: "Мама всё обдумала."
      - weight: 1
        text: "Сегодня без сложностей."
      - weight: 1
        text: "Если позволишь маме свои пять копеек вставить."
    advice:
      - weight: 1
        text: "Лёгкой куртки хватит, сегодня без нравоучений.\nРазве что шарфик возьми, маме для спокойствия."
      - weight: 1
        text: "Погода хорошая, надевай что нравится.\nНо я всё равно напомню: к вечеру может резко похолодать."
      - weight: 1
        text: "Под лёгкую кофту надень футболку.\nЕсли окажется холоднее, чем думали, напиши мне, пожалуйста."
      - weight: 1
        text: "Футболку и кардиган нараспашку.\nСогреешься — снимешь, не зря же там пуговицы."
      - weight: 1
        text: "Джинсы и кофту с длинным рукавом — вполне достаточно.\nРукава закатывать не торопись, сначала хоть минутку на улице побудь."
      - weight: 1
        text: "Кроссовки с обычными носками.\nЕсли далеко идти, выбирай удобные, пусть даже к наряду не очень подходят."
      - weight: 1
        text: "На велосипед — дышащую футболку и толстовку на молнии.\nПроверь, чтобы в плечах не тянуло, когда за руль берёшься."
      - weight: 1
        text: "Если дует, накинь тонкую ветровку.\nУ реки застегнись, солнышко, возле воды прохладнее."
      - weight: 1
        text: "Для посиделок на улице — лёгкий джемпер и длинные брюки.\nПока идёшь, тепло, а сядешь — совсем другое дело."
      - weight: 1
        text: "На прогулку — хлопковую рубашку под джинсовку.\nВернёшься после заката — верхний слой ещё пригодится, не оставляй его дома."
    sting:
      - weight: 1
        text: "Видишь, я не всегда волнуюсь. Просто почти всегда."
      - weight: 1
        text: "Сегодня отпускаю без лекции. Можешь поблагодарить."
      - weight: 1
        text: "Надо же, ещё не позавтракали, а с одеждой уже договорились."
      - weight: 1
        text: "Иди погуляй, солнышко. Посуда без тебя никуда не денется."
      - weight: 1
        text: "Советы у мамы бесплатные. А за печеньем придётся в гости зайти."
      - weight: 1
        text: "Хорошо выглядишь. Вот тебе ещё одно мнение, и спрашивать не пришлось."
      - weight: 1
        text: "Пройди хоть раз красивой дорогой. Поход в магазин — это ещё не прогулка."
      - weight: 1
        text: "Чуть напоминание тебе не отправила. Потом вспомнила, что ты рядом стоишь."
      - weight: 1
        text: "Мимо пекарни пойдёшь — ты знаешь, что я люблю."
      - weight: 1
        text: "Отдохни хорошо. По-настоящему хорошо — с телефоном в кармане."

  mild:
    intro:
      - weight: 2
        text: "Наконец-то приятная погода."
      - weight: 1
        text: "Сегодня даже поволноваться не о чем, вот чудеса."
      - weight: 1
        text: "День хороший, только не выходи совсем налегке."
      - weight: 1
        text: "Ну что, солнышко, день обещает быть хорошим."
      - weight: 1
        text: "Раз уж мама рядом, немного подскажу."
      - weight: 1
        text: "Для прогулки день лучше не придумаешь."
      - weight: 1
        text: "Ладно, вот моё предложение."
      - weight: 1
        text: "Пока все по делам не разбежались."
      - weight: 1
        text: "Сегодня можно без суеты."
      - weight: 1
        text: "Давай сегодня попроще."
    advice:
      - weight: 1
        text: "Надевай что удобно, спорить не буду.\nРазве что лёгкую кофту на потом захвати, мало ли."
      - weight: 1
        text: "Самое время для кардигана — накинь и иди.\nСегодня без лекций, у мамы выходной."
      - weight: 1
        text: "Одевайся как нравится, сегодня доверяю твоему выбору.\nТолько не привыкай."
      - weight: 1
        text: "Хлопковую футболку и лёгкие брюки.\nПояс выбирай такой, чтобы сесть можно было, — мы обедать идём, не фотографироваться."
      - weight: 1
        text: "Тонкую рубашку с длинными рукавами.\nСтанет теплее — подвернёшь манжеты, незачем на весь день вперёд решать."
      - weight: 1
        text: "На прогулку — удобные кроссовки и дышащие носки.\nОбувь бери разношенную, давай сегодня без мозолей."
      - weight: 1
        text: "Свободное платье, а если ногам прохладно — мягкие легинсы.\nТебе же ходить, не градуснику, вот на свои ощущения и смотри."
      - weight: 1
        text: "Поло и лёгкие хлопковые брюки вполне подойдут.\nПроверь только, чтобы и наклониться, и руки поднять было удобно."
      - weight: 1
        text: "На велосипед — быстросохнущую футболку и одежду, которая не сковывает ноги.\nТолстую толстовку оставь, если собираешься как следует крутить педали."
      - weight: 1
        text: "Дышащую блузку, а поверх — лёгкую рубашку для помещения.\nВ том кафе кондиционер так работает, будто они там мясо хранят."
    sting:
      - weight: 1
        text: "Сегодня разрешаю одеваться без моего участия. Пользуйся моментом."
      - weight: 1
        text: "Вот видишь, не всегда у меня замечания находятся."
      - weight: 1
        text: "Оставь время просто посидеть в хорошем месте. Не каждая прогулка должна заканчиваться покупками."
      - weight: 1
        text: "Я окна открыла. Папа уже ходит выясняет, откуда дует."
      - weight: 1
        text: "Увидишь что-нибудь красивое — сфотографируй мне. Люблю знать, как у тебя день проходит."
      - weight: 1
        text: "Бельё на улицу вывесила. Всё, свою порцию риска на сегодня получила."
      - weight: 1
        text: "Перед выходом пообедай. Конфетка со дна сумки не считается."
      - weight: 1
        text: "В гости можно и без повода, между прочим. Не обязательно дня рождения ждать."
      - weight: 1
        text: "Только не потрать весь день на выбор места, где провести день."
      - weight: 1
        text: "Книжку захвати, которую всё собираешься прочитать. Пусть тоже погуляет."

  comfortable:
    intro:
      - weight: 2
        text: "Вот сегодня и правда хорошо, солнышко."
      - weight: 1
        text: "Даже придраться совершенно не к чему."
      - weight: 1
        text: "Иди погуляй, пока такая благодать."
      - weight: 1
        text: "Ну разве не прелесть сегодня."
      - weight: 1
        text: "Сегодня мама даёт добро."
      - weight: 1
        text: "Перед выходом одна маленькая мысль."
      - weight: 1
        text: "Сегодня даже я могу покороче."
      - weight: 1
        text: "Давай, солнышко, день-то идёт."
      - weight: 1
        text: "Ну что, пора тебя на прогулку отправлять."
      - weight: 1
        text: "Между нами, по-моему, всё готово."
    advice:
      - weight: 1
        text: "Надевай что душа просит, я серьёзно.\nВ футболке вполне можно, обещаю промолчать."
      - weight: 1
        text: "Короткий рукав — одобряю без поправок.\nРазве что лёгкую кофту на вечер, и больше ни слова."
      - weight: 1
        text: "Вот ради таких дней и стоит выбираться на улицу.\nПогуляй в удовольствие, а вечером позвони, расскажешь как всё прошло."
      - weight: 1
        text: "Лёгкое хлопковое платье и удобные сандалии.\nПроверь ремешки, пока далеко не ушли, — пусть ничего не натирает."
      - weight: 1
        text: "Льняную рубашку и свободные брюки — будет замечательно.\nПомнутся — ничего страшного, ты гуляешь, а не на витрине стоишь."
      - weight: 1
        text: "На велосипед — дышащую футболку и эластичные шорты.\nТолько следи, чтобы свободные края одежды не попадали в цепь."
      - weight: 1
        text: "На обед на улице — поло и лёгкие брюки.\nВ поясе место оставь, там ведь ещё десерты подают."
      - weight: 1
        text: "К своему наряду добавь панаму от солнца.\nВ такую приятную погоду нос тоже обгорает, между прочим."
      - weight: 1
        text: "На долгую прогулку — кроссовки и носки, которые отводят влагу.\nКолючие бирки срежь дома, пока ножницы рядом."
      - weight: 1
        text: "В офис надень лёгкую рубашку поверх футболки.\nНа улице снимешь — это от вашего кондиционера спасение."
    sting:
      - weight: 1
        text: "На один целый день перестану переживать. Наслаждайся."
      - weight: 1
        text: "В такую погоду мамой быть легко. Я бы привыкла."
      - weight: 1
        text: "Надо же, сегодня и ты, и погода хорошо себя ведёте."
      - weight: 1
        text: "На садовые стулья хорошие подушки вынесла. Будем сами у себя почётными гостями."
      - weight: 1
        text: "Купи себе мороженое. Для двух шариков особый повод не нужен."
      - weight: 1
        text: "Домашние дела столько ждали, ещё часик как-нибудь потерпят."
      - weight: 1
        text: "Я бы с тобой, но кто-то должен папе новую кормушку объяснить."
      - weight: 1
        text: "Ты мне не только кофе фотографируй. Я на тебя тоже посмотреть хочу."
      - weight: 1
        text: "Бутербродов на двоих положила. С кем поделиться — тут уж самостоятельно."
      - weight: 1
        text: "Присядь где-нибудь, отдохни. За вечную занятость медалей не дают."

  warm:
    intro:
      - weight: 2
        text: "Теплеет, а у мамы новые заботы."
      - weight: 1
        text: "Стало тепло, теперь переживаю по другим поводам."
      - weight: 1
        text: "Летние заботы, куда ж без них."
      - weight: 1
        text: "Мама быстренько кое-что скажет."
      - weight: 1
        text: "Пока ты на весь день не пропадёшь."
      - weight: 1
        text: "Ты же меня знаешь, я всё наперёд продумываю."
      - weight: 1
        text: "Дай я тебя по-человечески соберу."
      - weight: 1
        text: "Солнышко, буквально минутку."
      - weight: 1
        text: "У меня для тебя маленький совет."
      - weight: 1
        text: "Ну-ка, посмотрим, всё ли готово."
    advice:
      - weight: 1
        text: "Шорты и футболку — ладно, можно.\nНо очки и крем от солнца обязательно, кожу беречь надо смолоду."
      - weight: 1
        text: "Надевай лёгкое, чтобы ткань дышала.\nИ воду возьми — именно воду, а то ты опять одним кофе обойдёшься."
      - weight: 1
        text: "Одевайся полегче, незачем париться.\nНадолго идёшь — панаму возьми, я и за твою макушку переживаю, не спрашивай."
      - weight: 1
        text: "Свободную льняную рубашку и лёгкие брюки.\nВ узких джинсах весь день на улице сидеть — удовольствие сомнительное."
      - weight: 1
        text: "Воздушное платье и сандалии с хорошими застёжками.\nОставь ногам немного места, в тепле они могут отекать."
      - weight: 1
        text: "Для тренировки — быстросохнущую футболку и беговые шорты.\nОтдыхай в тени, солнышко, рекордов от тебя никто не требует."
      - weight: 1
        text: "На солнечную прогулку — тонкую рубашку с длинным рукавом.\nПлечи прикрой, особенно если они с прошлого августа солнца не видели."
      - weight: 1
        text: "По делам — хлопковую блузку без подкладки и лёгкую юбку.\nСостав ткани посмотри, а то иная красота совсем воздух не пропускает."
      - weight: 1
        text: "На целый день пешком — удобную обувь и дышащие носки.\nНовую пару сначала возле дома разноси, не с каждой мозолью я смогу тебя забрать."
      - weight: 1
        text: "На экскурсию — свободную футболку и мягкие шорты подлиннее.\nЕсли бёдра натирает, проверь швы заранее, чтобы прогулка не закончилась к обеду."
    sting:
      - weight: 1
        text: "Воду пей. Я серьёзно, не только кофе."
      - weight: 1
        text: "Крем от солнца, солнышко. Не ворчу я, просто лицо у тебя любимое."
      - weight: 1
        text: "С шоколадкой в сумке пора что-то решать. Скоро она сама решит."
      - weight: 1
        text: "Стул в тени я уже заняла. Должны же быть у старших какие-то преимущества."
      - weight: 1
        text: "Обед из машины сразу забери. Это тебе не мультиварка."
      - weight: 1
        text: "Папа щипцы для мангала достал. Всё, у всей семьи теперь планы."
      - weight: 1
        text: "На горячую лавочку сначала полотенце постели. Голые ноги температуру безошибочно определяют."
      - weight: 1
        text: "Можно просто зайти и отдохнуть. Признаваться, что силы кончились, необязательно."
      - weight: 1
        text: "Я дыню купила. Заходи, пока я не решила, что нарезать её — уже достаточно дел на сегодня."
      - weight: 1
        text: "Отдыхай в удовольствие. Всё лето за один день прожить всё равно не получится."

  hot:
    intro:
      - weight: 2
        text: "Ох, жара, ещё одна моя головная боль."
      - weight: 1
        text: "Пожалуйста, побереги себя, я сейчас серьёзно."
      - weight: 1
        text: "В такую жару я правда за тебя переживаю."
      - weight: 1
        text: "Солнышко, перед выходом минутку."
      - weight: 1
        text: "Дай маме один совет дать."
      - weight: 1
        text: "Я на улицу выглянула, послушай."
      - weight: 1
        text: "Ты же знаешь, мне важно всё предусмотреть."
      - weight: 1
        text: "Давай сначала немного подумаем."
      - weight: 1
        text: "Потерпи, пока я тут покудахчу."
      - weight: 1
        text: "Вот что я думаю, солнышко."
    advice:
      - weight: 1
        text: "Надевай самую лёгкую одежду и возьми воду с запасом.\nОчки и крем от солнца — и то и другое, я потом спрошу."
      - weight: 1
        text: "Широкополую шляпу и что-нибудь свободное и тонкое.\nЕсли закружится голова, сразу зайди в прохладное место, пообещай мне."
      - weight: 1
        text: "Надевай лёгкое и держись тени, где возможно.\nИ ещё раз: воду пей, одним холодным кофе не обходись."
      - weight: 1
        text: "Светлую льняную рубашку и просторные шорты.\nПлотные джинсы пусть до другой погоды отдохнут, переживут."
      - weight: 1
        text: "Свободное хлопковое платье и сандалии без каблука с регулируемыми ремешками.\nНоги отекают — ослабь застёжки, незачем ради пряжки мучиться."
      - weight: 1
        text: "Если уж тренироваться, то в дышащем топе и быстросохнущих шортах.\nВыбирай часы попрохладнее и нагрузку убавь, пожалуйста."
      - weight: 1
        text: "На улицу — тонкую свободную рубашку с защитой от ультрафиолета.\nРуки прикроет, а лишнего тепла не добавит, как плотная одежда."
      - weight: 1
        text: "Для ходьбы — лёгкие сетчатые кроссовки и тонкие спортивные носки.\nНа целый день возьми сменную пару носков, во влажных ноги натирает."
      - weight: 1
        text: "Свободную майку и мягкие шорты, чтобы бёдра не тёрлись.\nПеред долгой прогулкой швы проверь, солнышко."
      - weight: 1
        text: "На работу — блузку без подкладки и свободную юбку.\nЗапасной верх прихвати, если в дороге сильно вспотеешь."
    sting:
      - weight: 1
        text: "Не надрывайся в такую жару. Я серьёзно."
      - weight: 1
        text: "Станет нехорошо — сразу в прохладу. А то я начну переживать уже без шуточек."
      - weight: 1
        text: "Жары я больше мороза боюсь, и сто раз объясняла почему."
      - weight: 1
        text: "На ужин будет что-нибудь холодное. С духовкой мы сегодня в ссоре."
      - weight: 1
        text: "Огород оставь, солнышко. У сорняков записи на сегодня нет."
      - weight: 1
        text: "Сиденье в машине сначала потрогай. И пряжку ремня тоже — она особенно коварная."
      - weight: 1
        text: "Вентилятор у нас общий. Прописываться перед ним не надо."
      - weight: 1
        text: "Бабушке потом позвони. Скажет «всё хорошо», а сама опять в жару бельё гладит."
      - weight: 1
        text: "Фрукты в холодильнике. Да, надо ещё и ящик открыть, одной дверцы мало."
      - weight: 1
        text: "Не обязательно все дела сегодня переделать. Завтра я тобой не меньше гордиться буду."

  windy_cold:
    intro:
      - weight: 2
        text: "И холод, и ветер, ну давай без геройства."
      - weight: 1
        text: "Вот это сочетание я особенно не люблю."
      - weight: 1
        text: "Утепляйся, ветер сегодня не шуточный."
      - weight: 1
        text: "Погоди, солнышко, сначала соберёмся."
      - weight: 1
        text: "Мама прогноз уже посмотрела."
      - weight: 1
        text: "Прежде чем скажешь «да всё нормально будет»."
      - weight: 1
        text: "Давай-ка подумаем хорошенько."
      - weight: 1
        text: "Немного маминых наставлений."
      - weight: 1
        text: "У двери минутку задержись."
      - weight: 1
        text: "Мне же хочется тебя спокойно отпустить."
    advice:
      - weight: 1
        text: "Непродуваемую куртку, а не просто какую попало, я серьёзно.\nЗастегни до верха, пусть в щели ветер не гуляет."
      - weight: 1
        text: "Уши и шею закрой, пожалуйста.\nС ветром холоднее, чем градусник показывает."
      - weight: 1
        text: "Одевайся слоями, а сверху — защиту от ветра.\nИ перчатки, руки у тебя быстрее мёрзнут, чем ты признаёшься."
      - weight: 1
        text: "Шапку на флисе и закреплённый капюшон поверх.\nПодгони так, чтобы по сторонам видеть, особенно на переходах."
      - weight: 1
        text: "Плотные длинные брюки, а если надолго — под них термобельё.\nРваные джинсы оставь для помещений со стенами, солнышко."
      - weight: 1
        text: "Закрытые ботинки и носки с шерстью, не впритык.\nПрежде чем замшу обувать, проверь, не обещают ли ещё и дождь."
      - weight: 1
        text: "Бафф по размеру заправь под воротник.\nНа велосипеде длинные концы шарфа возле колёс нам не нужны."
      - weight: 1
        text: "Термокофту, тёплый средний слой и непродуваемую куртку.\nВ горку станет жарко — приоткрой молнию, на остановке снова застегни."
      - weight: 1
        text: "Утеплённые варежки с манжетами поверх рукавов.\nДома попробуй ключами пользоваться, чтобы на пороге голые пальцы не морозить."
      - weight: 1
        text: "Удлинённую парку, подгони её на талии и по низу.\nДвигаться должно быть удобно, но поддувать в спину — необязательно."
    sting:
      - weight: 1
        text: "В такую погоду особенно легко продрогнуть, уж я насмотрелась."
      - weight: 1
        text: "Как зайдёшь в тепло, сразу напиши."
      - weight: 1
        text: "Я говорила, что тонкой куртки мало. Ну ведь говорила."
      - weight: 1
        text: "Дверь машины придерживай, солнышко. Ветер за ремонт платить не собирается."
      - weight: 1
        text: "У причёски сегодня свои планы. Пусть себе."
      - weight: 1
        text: "Иди там, где меньше продувает. За короткую дорогу медалей не выдают."
      - weight: 1
        text: "Горшки с цветами я домой занесла. И ни один не спорил."
      - weight: 1
        text: "Чеки в сумке спрячь, пока она не начала раздавать их всему району."
      - weight: 1
        text: "Горячий обед тебя дождётся. Не торопись."
      - weight: 1
        text: "От болтающихся вывесок держись подальше. Меню потом прочитаешь."

  windy_frost:
    intro:
      - weight: 2
        text: "Сегодня без шуток, солнышко, это серьёзно."
      - weight: 1
        text: "Пожалуйста, очень тебя прошу, побереги себя."
      - weight: 1
        text: "Из-за такой погоды я и ночью места себе не нахожу."
      - weight: 1
        text: "Давай помогу тебе собраться."
      - weight: 1
        text: "Послушай меня минутку."
      - weight: 1
        text: "Тут мы торопиться не будем."
      - weight: 1
        text: "Вот тебе мамин совет на сегодня."
      - weight: 1
        text: "Прежде чем за дверную ручку браться."
      - weight: 1
        text: "Давай вместе всё продумаем."
      - weight: 1
        text: "Я прошу тебя дослушать, солнышко."
    advice:
      - weight: 1
        text: "Закрой всю кожу, какую только можно.\nВысокий ворот, тёплые перчатки и шапка, которая уши целиком закрывает."
      - weight: 1
        text: "Самую тёплую куртку, сегодня никаких уступок.\nЕсли можно пока не выходить, побудь дома, очень тебя прошу."
      - weight: 1
        text: "Несколько тёплых слоёв и ни одной щели.\nНа таком морозе с ветром можно и не заметить, как сильно замёрзнешь."
      - weight: 1
        text: "Утеплённые ботинки и толстые шерстяные носки без тесноты.\nПальцам место оставь, солнышко, кровь должна нормально ходить."
      - weight: 1
        text: "Флисовую маску на лицо, поверх — тёплый закреплённый капюшон.\nЕсли от дыхания намокнет, замени на сухую."
      - weight: 1
        text: "Тонкие перчатки, а на них непродуваемые варежки с длинными манжетами.\nРади фотографии руки не оголяй, я и так поверю, что красиво."
      - weight: 1
        text: "Термоштаны под утеплённые непродуваемые брюки.\nНоги тоже беречь надо, хоть от маминых глаз они и дальше."
      - weight: 1
        text: "Бельё, которое отводит влагу, потом шерсть или флис и защитную куртку.\nТемп сбавь до того, как вспотеешь, иначе на остановке станет совсем холодно."
      - weight: 1
        text: "Длинную тёплую парку с плотным воротом и закрытой планкой молнией.\nЗастёжки дома проверь, пока пальцы ещё слушаются."
      - weight: 1
        text: "Плотную зимнюю шапку и защитные очки, без зазоров у маски.\nКожа немеет или белеет — сразу в тепло, солнышко."
    sting:
      - weight: 1
        text: "Я не просто так прошу утеплиться. Правда."
      - weight: 1
        text: "Обморожение — не страшилка, солнышко. Тут я уже не преувеличиваю."
      - weight: 1
        text: "Сразу позвони, как зайдёшь в помещение. Я телефон из рук не выпущу."
      - weight: 1
        text: "Одну прогулку пропустить можно. Друзья за это из жизни не исчезнут."
      - weight: 1
        text: "Скажи кому-нибудь, куда идёшь и какой дорогой. Да, мама тоже считается."
      - weight: 1
        text: "Телефон перед выходом заряди. Двенадцать процентов — мне таких переживаний не надо."
      - weight: 1
        text: "Заходи, погоду вместе поругаем. С правильной стороны окна."
      - weight: 1
        text: "Поберечь себя — не значит струсить. Значит, и в следующий раз погулять получится."
      - weight: 1
        text: "Ключи положи поближе. На таком морозе раскопки в сумке ни к чему."
      - weight: 1
        text: "Нужно подвезти — попроси. Сначала до слёз замерзать необязательно."

  windy_hot:
    intro:
      - weight: 1
        text: "Хоть ветерок есть, и на том спасибо."
      - weight: 1
        text: "Ветер немного спасает, но расслабляться рано."
      - weight: 1
        text: "Ветерок ветерком, а жара никуда не делась."
      - weight: 1
        text: "Перед выходом давай кое-что учтём."
      - weight: 1
        text: "У мамы, разумеется, есть предложение."
      - weight: 1
        text: "Давай соберём тебя, солнышко."
      - weight: 1
        text: "Пока ты от меня не отмахнёшься."
      - weight: 1
        text: "Дай немного о тебе позаботиться."
      - weight: 1
        text: "Я бы сегодня вот что выбрала."
      - weight: 1
        text: "Небольшой мамин совет."
    advice:
      - weight: 1
        text: "Всё равно надевай лёгкое, ветер жару не отменяет.\nШляпу, если сдувает, можно заменить панамой на завязках, а вот крем от солнца не пропускай."
      - weight: 1
        text: "Лёгкую дышащую одежду, даже если ветер приятно обдувает.\nВоду пей регулярно, солнышко, по ощущениям жара может быть обманчивой."
      - weight: 1
        text: "Светлую льняную рубашку и просторные хлопковые шорты.\nТяжёлую куртку оставь, от каждого дуновения прятаться незачем."
      - weight: 1
        text: "Панаму с вентиляцией и регулируемым шнурком под подбородком.\nЗакрепи заранее, бегать за ней мы в план тренировок не включали."
      - weight: 1
        text: "На пыльную дорогу — плотно сидящие очки с защитой от ультрафиолета.\nПесок в глаз попадёт — грязными руками не три."
      - weight: 1
        text: "Лёгкий комбинезон вместо свободной юбки с запахом.\nИ руки свободны, и подол ловить каждые пять шагов не придётся."
      - weight: 1
        text: "Надолго на улицу — воздушную кофту с длинным рукавом и защитой от солнца.\nКрем на открытые запястья и сзади на шею тоже нанеси."
      - weight: 1
        text: "Для города — сандалии с ремешком на пятке.\nЕсли пойдёшь по песку, пусть подошва не будет совсем гладкой."
      - weight: 1
        text: "Для велосипеда — дышащую спортивную футболку и облегающие велошорты.\nБолтающиеся завязки к колёсам не подпускай, пожалуйста."
      - weight: 1
        text: "На пляж — быстросохнущую накидку поверх купальника.\nПеред дорогой домой переоденься в сухое, смену сразу в сумку положи."
    sting:
      - weight: 1
        text: "Не забудь крем от солнца только потому, что ветерком обдувает."
      - weight: 1
        text: "Тебе прохладнее, а солнце всё равно печёт. Оно скидок на ветер не делает."
      - weight: 1
        text: "Салфетки чем-нибудь прижми, пока наш обед не разлетелся на весь двор."
      - weight: 1
        text: "Волосы собери. Бутерброд с чёлкой в заказ не входил."
      - weight: 1
        text: "В тени садись подальше от надломленных веток. Мне семья целая нужна."
      - weight: 1
        text: "Пляжный зонт хорошо закрепи. На одном «да нормально стоит» он не удержится."
      - weight: 1
        text: "Бельё перед уходом сними. Не хочется свои полотенца по чужим дворам опознавать."
      - weight: 1
        text: "Если объявили пожарную опасность, никакого открытого огня. Пообедаем и без шашлыка."
      - weight: 1
        text: "Окно прикрой, пока двери хлопать не начали. А то папа опять петли пойдёт чинить."
      - weight: 1
        text: "Зайди передохнуть в прохладу. Не обязательно ждать, пока совсем сил не останется."

  rain:
    intro:
      - weight: 2
        text: "Зонт возьми, нормальный, не тот сломанный."
      - weight: 1
        text: "Дождь идёт, пожалуйста, осторожнее там."
      - weight: 1
        text: "На улице мокро, а ты же знаешь, как неприятно потом дрожать."
      - weight: 1
        text: "Давай тебя соберём, солнышко."
      - weight: 1
        text: "Перед выходом немного подготовимся."
      - weight: 1
        text: "Мама уже на улицу посмотрела."
      - weight: 1
        text: "Прежде чем убежишь, минутку."
      - weight: 1
        text: "Дай я тебе помогу."
      - weight: 1
        text: "Вот что я сегодня предлагаю."
      - weight: 1
        text: "Мне же хочется тебя спокойно отпустить."
    advice:
      - weight: 1
        text: "Дождевик с капюшоном, пожалуйста, а не один зонт, который ветром вывернет.\nИ непромокаемую обувь, ходить с мокрыми ногами — то ещё удовольствие."
      - weight: 1
        text: "Возьми хороший зонт, который я тебе подарила, не хлипкий.\nИ не беги, пожалуйста, скользко ведь, а ты вечно торопишься."
      - weight: 1
        text: "Надевай что-нибудь с капюшоном, с ним руки свободны.\nИ сухие носки в сумку положи, просто сделай маме приятно."
      - weight: 1
        text: "Быстросохнущие брюки, чтобы штанины по земле не волочились.\nНе надо все лужи на подворотах домой приносить."
      - weight: 1
        text: "На грязные дорожки — резиновые сапоги с нескользкой подошвой.\nПрежде чем в воду шагать, проверь, не зальётся ли она через верх."
      - weight: 1
        text: "Если тепло, надень дышащий дождевик на лёгкую футболку.\nСтанет жарко — открой вентиляцию, незачем ещё и изнутри мокнуть."
      - weight: 1
        text: "Куртку от дождя подлиннее, застегни её до конца.\nИз наружных карманов убери всё, чему мокнуть нельзя."
      - weight: 1
        text: "На велосипед — непромокаемые штаны поверх обычных.\nВнизу закрепи, чтобы в цепь не затянуло, пожалуйста."
      - weight: 1
        text: "Для дороги — яркую куртку со светоотражателями.\nУ водителей стёкла тоже в каплях, солнышко, пусть тебя хорошо видят."
      - weight: 1
        text: "Кепку с козырьком под капюшон дождевика.\nПодгони так, чтобы на очки не капало, но обзор оставался свободным."
    sting:
      - weight: 1
        text: "Не торопись и не поскользнись, пожалуйста, я за это переживаю."
      - weight: 1
        text: "Как будешь дома в сухом, напиши. Я дождусь."
      - weight: 1
        text: "Надеюсь, зонт не остался дома опять? Только честно."
      - weight: 1
        text: "Телефон в непромокаемый чехол убери. Рису и без него есть чем заняться в кастрюле."
      - weight: 1
        text: "Выйди пораньше. Лучше я обед подогрею, чем ты будешь бегом добираться."
      - weight: 1
        text: "От края тротуара отойди, солнышко. Вон тот автобус сейчас волну поднимет."
      - weight: 1
        text: "Придёшь — вещи развесь. Мокрая куча на стуле сама себя не высушит."
      - weight: 1
        text: "Собаке полотенце у входа приготовь. Отряхиваться она любит сразу на всех."
      - weight: 1
        text: "Через затопленные места не ходи. Найти другую дорогу — вполне разумное решение."
      - weight: 1
        text: "Заходи переждать, пока стихнет. Для тебя место всегда найдётся."

  heavy_rain:
    intro:
      - weight: 2
        text: "Это уже не дождик, солнышко, это целое дело."
      - weight: 1
        text: "Пожалуйста, сегодня без промокания, побереги мамины нервы."
      - weight: 1
        text: "Я правда переживаю, когда ты в такую погоду на улице."
      - weight: 1
        text: "Давай немного подумаем, прежде чем выходить."
      - weight: 1
        text: "Прежде чем скажешь «да тут недалеко»."
      - weight: 1
        text: "Мама хочет с тобой кое-что обсудить."
      - weight: 1
        text: "Сначала подготовимся, пожалуйста."
      - weight: 1
        text: "Дай помогу тебе собраться."
      - weight: 1
        text: "Вот что я советую перед выходом."
      - weight: 1
        text: "Минутка у нас на это найдётся."
    advice:
      - weight: 1
        text: "Длинный дождевик и непромокаемые сапоги, сегодня без полумер.\nЕсли можно остаться дома, солнышко, останься, я по-хорошему прошу."
      - weight: 1
        text: "Если выходить необходимо, надень непромокаемую куртку и обувь.\nСменную одежду возьми, пожалуйста, я серьёзно."
      - weight: 1
        text: "Всё непромокаемое и без спешки.\nОдним зонтиком не обойдёшься, надо как следует одеться."
      - weight: 1
        text: "Непромокаемые штаны с проклеенными швами, штанины поверх сапог.\nПусть вода на землю стекает, солнышко, а не к тебе в носки."
      - weight: 1
        text: "Дождевую куртку с защитной планкой над молнией.\nЗастегни ещё в подъезде, на улице переодеваться будет некогда."
      - weight: 1
        text: "Непромокаемые ботинки с хорошим сцеплением и фиксацией голеностопа.\nНа залитые ступеньки не наступай, под мутной водой не видно, что там."
      - weight: 1
        text: "Яркий дождевик со светоотражающими полосами.\nИди через переход, даже если дальше, — машинам на мокром дольше тормозить."
      - weight: 1
        text: "Капюшон с козырьком, подогнанный вокруг лица.\nПроверь, чтобы по сторонам смотреть можно было, а не только прямо под ноги."
      - weight: 1
        text: "Быстросохнущую футболку под дышащую защиту от дождя.\nСтанет жарко — открой прикрытые вентиляционные клапаны, не парься внутри."
      - weight: 1
        text: "Для велосипеда — непромокаемые штаны с узкими манжетами и капюшон под размер шлема.\nПроверь, чтобы слышать машины и свободно поворачивать голову."
    sting:
      - weight: 1
        text: "Пожалуйста, осторожнее добирайся в такой дождь. Я серьёзно."
      - weight: 1
        text: "Как окажешься в сухом безопасном месте, сразу позвони."
      - weight: 1
        text: "Не люблю, когда ты в такую погоду на улице. Говорила и ещё скажу."
      - weight: 1
        text: "Дорогу залило — поворачивай обратно, солнышко. Ужин подождёт."
      - weight: 1
        text: "Перед выходом проверь, что с транспортом. Лучше здесь посидеть, чем на платформе мокнуть."
      - weight: 1
        text: "От разлившихся ручьёв держись подальше. Фото поближе нам не нужно."
      - weight: 1
        text: "Сменную одежду упакуй в непромокаемый мешок. Иначе просто лишнее мокрое домой принесёшь."
      - weight: 1
        text: "В подвал, который заливает, не спускайся. Никакие вещи не стоят того, чтобы там застрять."
      - weight: 1
        text: "У двери полотенце положила. Хорошее, так что можешь оценить серьёзность намерений."
      - weight: 1
        text: "Нужно отменить встречу — отмени. Хорошие люди поймут."

  rain_cold:
    intro:
      - weight: 2
        text: "Солнышко, там холодно и мокро."
      - weight: 1
        text: "Зонтик захвати, пожалуйста."
      - weight: 1
        text: "Послушай свою маму."
      - weight: 1
        text: "Дай взгляну на тебя перед выходом."
      - weight: 1
        text: "Лучше сейчас немного позаботиться."
      - weight: 1
        text: "Я тут о твоей дороге думаю."
      - weight: 1
        text: "Давай тебя соберём по-человечески."
      - weight: 1
        text: "Один полезный совет, солнышко."
      - weight: 1
        text: "Пока ты не скажешь «да всё у меня есть»."
      - weight: 1
        text: "Маме минутку внимания."
    advice:
      - weight: 1
        text: "Тёплый свитер, непромокаемую куртку и шапку не забудь.\nИ нормальную обувь, не тряпичные кеды, очень тебя прошу."
      - weight: 1
        text: "Тёплую куртку с капюшоном, а зонт возьми с собой.\nВ такой сырости быстро продрогнешь."
      - weight: 1
        text: "Под непромокаемую куртку надень несколько тёплых слоёв.\nИ сухие носки в сумку, я не шучу."
      - weight: 1
        text: "Носки с шерстью и непромокаемые ботинки с нескользкой подошвой.\nПальцам оставь место — лишние носки не помогут, если обувь жмёт."
      - weight: 1
        text: "Флисовый бафф заправь под воротник.\nПусть дождевик и его прикрывает, а то все капли соберёт."
      - weight: 1
        text: "Утеплённые влагостойкие перчатки, манжеты под рукава куртки.\nКлючи положи поближе, чтобы на холоде голыми руками не искать."
      - weight: 1
        text: "Непромокаемые штаны поверх тёплых длинных брюк.\nШтанины поверх обуви, солнышко, чтобы вода внутрь не стекала."
      - weight: 1
        text: "Термокофту под флиску, а сверху дождевую куртку.\nНе гони до седьмого пота, тебе потом ещё в этой одежде на остановке стоять."
      - weight: 1
        text: "Плотную шапку, а поверх — подогнанный капюшон.\nДаже втянув голову в плечи, на переходе по сторонам смотри."
      - weight: 1
        text: "Удлинённое утеплённое пальто от дождя с прикрытой молнией.\nДома присядь в нём, проверь, что поясница всё ещё закрыта."
    sting:
      - weight: 1
        text: "Не буду пилить, но я ведь предупреждала."
      - weight: 1
        text: "Ноги промокнут, а мне потом слушать, как ты там замерзаешь."
      - weight: 1
        text: "Позвони, как доберёшься, хорошо?"
      - weight: 1
        text: "Автобус дома по расписанию проверь. У остановки крыша есть, отопления нет."
      - weight: 1
        text: "Чайник за пару минут вскипает. Уговорить тебя, чтобы подвезли, — гораздо дольше."
      - weight: 1
        text: "Сумку на стул поставь, когда придёшь. Лужа под столом не для неё приготовлена."
      - weight: 1
        text: "Как придёшь — сразу заходи. На сад и через стекло полюбуемся."
      - weight: 1
        text: "Луже ничего доказывать не нужно, солнышко. Обойди её."
      - weight: 1
        text: "Сухое полотенце ждёт. Сначала вытрись, а потом уже всем мокрым дождевиком обниматься."
      - weight: 1
        text: "Знобит — зайди согреться. «Почти дошли» — это всё ещё на улице."

  heavy_rain_cold:
    intro:
      - weight: 2
        text: "Солнышко, там льёт и холодно."
      - weight: 1
        text: "Это тебе не мелкий дождик."
      - weight: 1
        text: "Переживаю я за тебя в такую погоду."
      - weight: 1
        text: "Давай немного заранее подумаем."
      - weight: 1
        text: "Прежде чем скажешь «всего десять минут»."
      - weight: 1
        text: "Мама просит минутку внимания."
      - weight: 1
        text: "Сначала подготовимся, солнышко."
      - weight: 1
        text: "Дай помогу, пока ты ещё дома."
      - weight: 1
        text: "Вот что я тебе предложу."
      - weight: 1
        text: "Уделим минуту, чтобы всё предусмотреть."
    advice:
      - weight: 1
        text: "Непромокаемую куртку, под неё тёплую кофту и хорошие сапоги.\nОбычный зонт такого может не выдержать, крепко держи и при сильном ветре сложи."
      - weight: 1
        text: "Пальто с капюшоном, которое действительно держит дождь, и шапку.\nЕсли можно остаться дома, пожалуйста, останься."
      - weight: 1
        text: "Всё непромокаемое: куртку, обувь и чехол на рюкзак.\nВымокнуть и продрогнуть — сомнительное удовольствие."
      - weight: 1
        text: "Штаны от дождя с проклеенными швами поверх брюк на флисе.\nШтанины на сапоги натяни, если только воду собирать не собираешься."
      - weight: 1
        text: "Носки с шерстью и просторные тёплые непромокаемые ботинки.\nПодошву проверь, пока до мокрых ступенек не дошло дело."
      - weight: 1
        text: "Тонкое термобельё, флиску и дышащую куртку от дождя.\nСбавь темп, прежде чем вспотеешь, внутри нам тоже сухость нужна."
      - weight: 1
        text: "Непромокаемые варежки с тёплой подкладкой.\nМанжеты под рукава заправь, чтобы вода в них не затекала."
      - weight: 1
        text: "Шапку по голове и капюшон с регулируемым козырьком.\nПроверь, чтобы голову поворачивать и машины видеть было удобно."
      - weight: 1
        text: "Яркий утеплённый дождевик со светоотражателями.\nДо нормального перехода дойди, я лучше обед тёплым подержу."
      - weight: 1
        text: "Флисовый бафф целиком заправь в высокий застёгнутый ворот.\nНамокнет — замени, не держи мокрую ткань у кожи."
    sting:
      - weight: 1
        text: "В хороших туфлях только не выходи, пожалуйста."
      - weight: 1
        text: "Напиши, как спокойно доберёшься домой."
      - weight: 1
        text: "Я суп сварила. Просто к слову."
      - weight: 1
        text: "Полный комплект сухого в пакет положи. И бельё тоже, давай уж до конца подумаем."
      - weight: 1
        text: "Вода закрыла дорогу — возвращайся. Встречу можно перенести."
      - weight: 1
        text: "Перед выходом проверь, ничего не отменили? Не надо ради бумажки «закрыто» насквозь мокнуть."
      - weight: 1
        text: "Сначала переоденься, потом рассказывай. Я и сухую версию истории прекрасно послушаю."
      - weight: 1
        text: "Задрожишь — это знак зайти в тепло, а не побыстрее мимо пробежать."
      - weight: 1
        text: "Телефон убери туда, где сухо и легко достать. Дно сумки не подходит ни по одному пункту."
      - weight: 1
        text: "Нужно подвезти — попроси. Из-за плохой погоды обузой ты не становишься."

  snow:
    intro:
      - weight: 2
        text: "Снег идёт, пожалуйста, поосторожнее."
      - weight: 1
        text: "Ох уж этот снег, ещё один повод маме поволноваться."
      - weight: 1
        text: "Одевайся тепло, там вовсю сыплет."
      - weight: 1
        text: "Перед выходом покажись мне, солнышко."
      - weight: 1
        text: "Давай сначала немного подумаем."
      - weight: 1
        text: "У мамы несколько предложений."
      - weight: 1
        text: "Прежде чем скажешь «всё предусмотрено»."
      - weight: 1
        text: "Давай как следует соберём тебя."
      - weight: 1
        text: "Удели своей маме минутку."
      - weight: 1
        text: "Я бы сегодня вот что выбрала."
    advice:
      - weight: 1
        text: "Ботинки с хорошим протектором, а не те любимые гладкие.\nВарежки, шапку — порядок тебе знаком, не первую зиму живём."
      - weight: 1
        text: "Под непромокаемую куртку надень несколько слоёв.\nСтупай осторожно, под снегом льда не видно, солнышко."
      - weight: 1
        text: "Утеплись с головы до ног, сегодня без хитростей.\nЕсли дороги плохие, лучше дома побудь, мне же спокойнее будет."
      - weight: 1
        text: "Носки с шерстью и утеплённые ботинки, чтобы пальцам не тесно было.\nЗапасную пару в сумку положи, слякоть лазейку найдёт."
      - weight: 1
        text: "Непромокаемые варежки с длинными манжетами поверх рукавов.\nСнежки лепить начнёшь — снег внутрь не набивай, я же тебя знаю."
      - weight: 1
        text: "Термокофту, флиску и зимнюю куртку.\nНа подъёме заранее открой вентиляцию, а остановишься — снова закрой."
      - weight: 1
        text: "Для игр на улице — зимние штаны или непромокаемые поверх обычных.\nВ джинсах после первого сугроба уже неуютно будет."
      - weight: 1
        text: "Шапку, закрывающую уши, и регулируемый капюшон.\nУбедись, что по сторонам видно, особенно перед переходом."
      - weight: 1
        text: "Тёплый бафф заправь под воротник.\nНа санки длинный шарф не надевай, солнышко, концы могут зацепиться."
      - weight: 1
        text: "На дорогу домой — яркую куртку со светоотражателями.\nМашинам сложнее тормозить, дождись полной остановки, прежде чем переходить."
    sting:
      - weight: 1
        text: "Не упади, пожалуйста. Я правда за это переживаю."
      - weight: 1
        text: "Позвони, как доберёшься, не заставляй меня сидеть и ждать."
      - weight: 1
        text: "Я до сих пор тот прошлогодний гололёд помню. Осторожнее, пожалуйста."
      - weight: 1
        text: "Руки из карманов вынь, солнышко. На скользком ими равновесие держат."
      - weight: 1
        text: "Выйди заранее. Тротуар под твой график подстраиваться не обещал."
      - weight: 1
        text: "Автобусы перед выходом проверь. Лучше возле моего печенья подождать."
      - weight: 1
        text: "Снег с себя у двери стряхни. В прихожей нам своя оттепель не нужна."
      - weight: 1
        text: "Санки — на горку подальше от дороги. У хорошего спуска и конец безопасный."
      - weight: 1
        text: "Любуйся, как красиво. Глубину каждого сугроба проверять необязательно."
      - weight: 1
        text: "Снеговика своего мне сфотографируй. Мне всё ещё интересно, что у тебя получается."

  storm:
    intro:
      - weight: 2
        text: "Если можно, останься дома, солнышко."
      - weight: 1
        text: "Из-за этой бури я уже всерьёз волнуюсь."
      - weight: 1
        text: "Совсем мне эта погода не нравится, прямо тебе говорю."
      - weight: 1
        text: "Послушай меня внимательно минутку."
      - weight: 1
        text: "Давай вместе всё обдумаем."
      - weight: 1
        text: "Прежде чем ключи брать, солнышко."
      - weight: 1
        text: "Маме есть что сказать."
      - weight: 1
        text: "Сначала немного подготовимся, пожалуйста."
      - weight: 1
        text: "Дай помогу тебе всё разумно спланировать."
      - weight: 1
        text: "Прежде чем решать, дослушай меня."
    advice:
      - weight: 1
        text: "Если выходить необходимо, надень непромокаемое и непродуваемое, без исключений.\nНо лучше останься дома, если можешь, я прямо тебя прошу."
      - weight: 1
        text: "Надёжный капюшон и крепкую обувь, если уж без выхода никак.\nЗонт оставь, его вывернет, а тебя ещё и за ним понесёт."
      - weight: 1
        text: "Всё закрепи и одевайся с расчётом на худшее.\nИ пожалуйста, очень тебя прошу, будь осторожнее."
      - weight: 1
        text: "Если поездку не отменить, надень яркую дождевую куртку со светоотражателями.\nЖди машину под надёжным укрытием, солнышко, водителям сейчас плохо видно."
      - weight: 1
        text: "Непромокаемые штаны, края закрепи выше земли.\nЧерез затопленные места не ходи, даже если дом уже через дорогу."
      - weight: 1
        text: "Закрытую обувь с глубоким протектором, если выйти всё-таки придётся.\nСмотри, что под ногами и вокруг, а не беги уткнувшись в землю."
      - weight: 1
        text: "Дышащий нижний слой и дождевую куртку по температуре.\nЕсли тепло, толстый утеплитель ни к чему, перегреваться нам тоже незачем."
      - weight: 1
        text: "Капюшон по размеру, чтобы боковой обзор оставался свободным.\nУслышишь гром — зайди в капитальное здание, остановка не спасёт."
      - weight: 1
        text: "Куртку с плотными манжетами и прикрытыми карманами на молнии.\nТелефон держи в сухом месте поближе, не закапывай под остальные вещи."
      - weight: 1
        text: "Верхнюю одежду без болтающихся шнурков и длинного шарфа.\nОт плохо закреплённых вывесок и надломленных веток держись подальше."
    sting:
      - weight: 1
        text: "Как окажешься в безопасном помещении, сразу напиши. Я буду ждать."
      - weight: 1
        text: "Очень прошу сегодня остаться дома. Разве я так много прошу?"
      - weight: 1
        text: "Вот в такие дни я больше всего переживаю, ты же знаешь."
      - weight: 1
        text: "Местные предупреждения о погоде проверь. Семейный чат — не официальный прогноз."
      - weight: 1
        text: "Заряди телефон, пока электричество есть. Ленту полистаешь, когда аккумулятор поест."
      - weight: 1
        text: "Упавшие провода не трогай, солнышко. Даже тихий провод может быть под напряжением."
      - weight: 1
        text: "Садовая мебель подождёт, пока станет безопасно. Ты мне значительно дороже."
      - weight: 1
        text: "Если снаружи что-то летает, от окон отойди. На клумбы потом посмотрим."
      - weight: 1
        text: "Свет отключат — возьми фонарик. Свечей нам для полного счастья ещё не хватало."
      - weight: 1
        text: "Нужно отменить приезд — отменяй. Чтобы маму любить, через бурю ехать необязательно."

expand:
  trigger:
