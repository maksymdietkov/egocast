conditions:
  frost:
    intro:
      - weight: 2
        text: "Oh so NOW you'll listen to me."
      - weight: 1
        text: "I've been saying this since October."
      - weight: 1
        text: "This is exactly what I warned you about."
      - weight: 1
        text: "Fine, don't listen to me, see what happens."
      - weight: 1
        text: "Come here, let me look at you."
      - weight: 1
        text: "Before you go rushing out the door."
      - weight: 1
        text: "Sweetheart, just humour your mother."
      - weight: 1
        text: "A little advice from someone who loves you."
      - weight: 1
        text: "You know I only fuss because I care."
      - weight: 1
        text: "Right, darling, one last thing."
    advice:
      - weight: 1
        text: "The big coat, sweetie, the one you called 'embarrassing.'\nWear it anyway — frostbite is more embarrassing, trust me."
      - weight: 1
        text: "Gloves, hat, the works, like I taught you.\nYour cousin Dima wears three layers and he's never once been sick."
      - weight: 1
        text: "Everything warm you own, all at once.\nI don't care how you look, I care that you come home with all ten fingers."
      - weight: 1
        text: "Thermal layer, sweater, real coat — not negotiable today.\nCall me the second you're inside somewhere warm, I mean it."
      - weight: 1
        text: "Lined boots and wool socks, darling.\nMake sure your toes can wiggle — squeezing them in won't keep them warmer."
      - weight: 1
        text: "A scarf or neck warmer tucked into your jacket, please.\nCover your nose and cheeks if the cold starts biting."
      - weight: 1
        text: "Insulated mittens with cuffs over your sleeves.\nIf your fingers go numb, get indoors — errands can wait."
      - weight: 1
        text: "Warm trousers with long johns underneath.\nThat bus stop has no sympathy for bare knees, sweetheart."
      - weight: 1
        text: "A fleece under a windproof outer layer.\nUnzip a little if you get sweaty — damp clothes will chill you when you stop."
      - weight: 1
        text: "An ear-covering cap and a hood that stays put.\nSave the headphones for indoors so everything fits snugly, love."
    sting:
      - weight: 1
        text: "I'm not saying I told you so. I'm just saying I did tell you so."
      - weight: 1
        text: "This is how people end up in the hospital, you know."
      - weight: 1
        text: "Your grandmother survived three winters in less clothing than you're about to wear. Wear more anyway."
      - weight: 1
        text: "Did you eat? Because cold on an empty stomach is how it really starts."
      - weight: 1
        text: "Being a grown-up means you can finally admit your mother was right about long underwear."
      - weight: 1
        text: "I've put a tissue in your pocket. No, the other pocket."
      - weight: 1
        text: "The kettle's on. That's my emergency response plan."
      - weight: 1
        text: "Yes, I'll still be checking the window until you get here."
      - weight: 1
        text: "A weather app tells you once. Your mother offers unlimited reminders."
      - weight: 1
        text: "You can roll your eyes, sweetheart. I can hear it over the phone."

  cold:
    intro:
      - weight: 2
        text: "It's cold, and I worry, so."
      - weight: 1
        text: "I already texted you twice about this."
      - weight: 1
        text: "Sweetie. Sweetie. Listen."
      - weight: 1
        text: "I'm only going to say this once, probably."
      - weight: 1
        text: "Before you tell me you've got it handled."
      - weight: 1
        text: "Darling, spare your mother a minute."
      - weight: 1
        text: "You can thank me later, love."
      - weight: 1
        text: "Let me fuss for a moment."
      - weight: 1
        text: "A quick word before you leave."
      - weight: 1
        text: "All right, my independent little grown-up."
    advice:
      - weight: 1
        text: "The real coat. Not the 'fashion' one that does nothing.\nGloves too — cold hands are how it starts, then it's a whole thing."
      - weight: 1
        text: "Layer up properly, like I've told you a hundred times.\nA scarf isn't optional, it's basic self-preservation."
      - weight: 1
        text: "Warm socks, real coat, something on your head.\nI know you hate hats. I don't care. Wear the hat."
      - weight: 1
        text: "A long jacket that covers your lower back, sweetheart.\nBend down once before leaving — let's check you're still covered."
      - weight: 1
        text: "Closed shoes with sturdy soles, please.\nThose thin little flats won't do much between you and the cold pavement."
      - weight: 1
        text: "A fleece with a windproof shell over it.\nThat breeze gets straight through a knitted jumper, however lovely it is."
      - weight: 1
        text: "Full-length trousers and socks that reach them.\nYour ankles haven't done anything to deserve being left outside."
      - weight: 1
        text: "A breathable base layer under your sweater.\nIf you're walking fast, open a zip before you get sweaty, love."
      - weight: 1
        text: "An extra cardigan under your outerwear if you'll be sitting outside.\nWatching a match doesn't keep you warm like playing one does."
      - weight: 1
        text: "A high-neck top with sleeves that reach your wrists.\nCheck the cuffs aren't damp before you go — use the spare one if they are."
    sting:
      - weight: 1
        text: "Call me when you're home. I will worry until you do."
      - weight: 1
        text: "You never listen about the scarf, and then guess who gets sick for a week."
      - weight: 1
        text: "I made soup just in case. There's always soup."
      - weight: 1
        text: "The forecast said cold. Your mother said it with three exclamation marks."
      - weight: 1
        text: "I know you're thirty. I also know where you keep the spare blankets."
      - weight: 1
        text: "There's a hot drink in the flask. Try bringing the flask home this time."
      - weight: 1
        text: "Your friend being underdressed doesn't make it a group discount on warmth."
      - weight: 1
        text: "I've stopped asking whether you're warm. Now I ask why you're shivering."
      - weight: 1
        text: "Yes, I packed a snack. Worrying is hungry work for both of us."
      - weight: 1
        text: "You used to let me dress you without a debate. Admittedly, you were two."

  chilly:
    intro:
      - weight: 2
        text: "Not frost, but I still worry."
      - weight: 1
        text: "A little chilly, which means bundle up anyway."
      - weight: 1
        text: "This is exactly the kind of weather people underestimate."
      - weight: 1
        text: "Let your mum have her little say."
      - weight: 1
        text: "Before you give me that look, darling."
      - weight: 1
        text: "One small request from your mother."
      - weight: 1
        text: "You know what I'm going to say, love."
      - weight: 1
        text: "Just a little motherly interference."
      - weight: 1
        text: "I've checked outside for you, sweetheart."
      - weight: 1
        text: "Take a moment before you dash off."
    advice:
      - weight: 1
        text: "A real jacket, please, not that thin one.\nBring a scarf even if you 'probably won't need it.'"
      - weight: 1
        text: "Layer a sweater under something warm.\nGloves too — I know you'll say I'm being dramatic. I'm not."
      - weight: 1
        text: "Dress warm now so you don't regret it later.\nYour sister always dresses warm and she never complains. Just saying."
      - weight: 1
        text: "A long-sleeved top with a cardigan you can take off.\nYou can adjust when you get there, sweetheart."
      - weight: 1
        text: "Full-length trousers today, please.\nSitting on a chilly bench in shorts gets old very quickly."
      - weight: 1
        text: "Trainers and socks that cover your ankles.\nSave the sandals for a day your toes can actually enjoy."
      - weight: 1
        text: "A fleece with a light windbreaker over it if it's breezy.\nThose lovely knitted sleeves let more air through than you think."
      - weight: 1
        text: "A breathable shirt under a zip-up hoodie for a brisk walk.\nOpen it a little if you get hot — no need to arrive all sweaty."
      - weight: 1
        text: "A light quilted vest over your sweatshirt if you'll be moving about.\nYour middle stays cosy without making your arms feel bundled up."
      - weight: 1
        text: "A rain jacket over your usual layers if showers are coming.\nCheck the hood fits before you leave, love, while there's still a mirror."
    sting:
      - weight: 1
        text: "This is exactly how colds happen, you know."
      - weight: 1
        text: "I'm not being dramatic, I'm being a mother."
      - weight: 1
        text: "Bring the scarf. Even if you don't wear it. Just bring it."
      - weight: 1
        text: "That patch of sunshine has made you terribly confident."
      - weight: 1
        text: "I've put an extra layer by the door. What a coincidence, it's your size."
      - weight: 1
        text: "Standing in the doorway saying 'it's fine' doesn't count as a weather report."
      - weight: 1
        text: "You don't have to admit I was right. A quiet thank-you will do."
      - weight: 1
        text: "The dog came straight back inside, and he normally has terrible judgment."
      - weight: 1
        text: "I can hear your teeth chattering through that brave little smile."
      - weight: 1
        text: "Of course you can make your own decisions. I've left the sensible option on the chair."

  cool:
    intro:
      - weight: 2
        text: "Not bad, but I still have opinions."
      - weight: 1
        text: "A little cool, nothing a jacket won't fix."
      - weight: 1
        text: "See, I'm not always telling you to panic."
      - weight: 1
        text: "Here's my little suggestion, sweetheart."
      - weight: 1
        text: "Since you've caught me in a reasonable mood."
      - weight: 1
        text: "Just a thought before you head out."
      - weight: 1
        text: "Come on, love, let's get you ready."
      - weight: 1
        text: "Your mother has considered the situation."
      - weight: 1
        text: "Nothing complicated today, darling."
      - weight: 1
        text: "If I may offer my usual two cents."
    advice:
      - weight: 1
        text: "A light jacket is fine, I won't lecture you today.\nMaybe a scarf anyway, just to make me happy."
      - weight: 1
        text: "This is easy weather, wear what you want.\nI'm still going to remind you it can turn on you fast."
      - weight: 1
        text: "Layer a shirt under something light.\nText me if it gets colder than expected, please."
      - weight: 1
        text: "A T-shirt with an open cardigan, sweetheart.\nTake it off if you warm up — that's why we invented buttons."
      - weight: 1
        text: "A long-sleeved top and jeans should do nicely.\nTry a minute outside before deciding to roll those sleeves up."
      - weight: 1
        text: "Trainers with ordinary socks, love.\nPick the comfortable pair if you're walking far, even if they don't match."
      - weight: 1
        text: "A breathable tee under a zip-up hoodie for your bike ride.\nLeave room to move your shoulders — give the handlebars a little test."
      - weight: 1
        text: "A thin windbreaker over your usual outfit if it's breezy.\nFasten it by the water, darling; it feels cooler along the river."
      - weight: 1
        text: "A light pullover with full-length trousers for sitting outdoors.\nYou'll feel the cool more once you stop moving."
      - weight: 1
        text: "A cotton blouse under a denim jacket for a day out.\nKeep the outer layer with you if you'll be coming back after sunset."
    sting:
      - weight: 1
        text: "See, I don't always worry. Just usually."
      - weight: 1
        text: "I'll allow this one without a lecture. You're welcome."
      - weight: 1
        text: "Look at us, agreeing on an outfit before breakfast."
      - weight: 1
        text: "Go enjoy yourself, sweetheart. The washing-up will still be here."
      - weight: 1
        text: "My advice is free. The biscuits are conditional on a visit."
      - weight: 1
        text: "You look lovely. There, a second opinion you didn't have to ask for."
      - weight: 1
        text: "Take the scenic route for once. You can't call the supermarket a day out."
      - weight: 1
        text: "I nearly sent you a reminder, then remembered I was standing next to you."
      - weight: 1
        text: "If you pass the bakery, you know which one I like."
      - weight: 1
        text: "Have a nice time, love. A proper nice time, with your phone in your pocket."

  mild:
    intro:
      - weight: 2
        text: "Pleasant, for once."
      - weight: 1
        text: "I have nothing to worry about today, miracle of miracles."
      - weight: 1
        text: "Easy day, don't ruin it by underdressing anyway."
      - weight: 1
        text: "Well, sweetheart, this looks promising."
      - weight: 1
        text: "A little guidance, since I'm here."
      - weight: 1
        text: "You've picked a lovely day to go out."
      - weight: 1
        text: "All right, love, here's my suggestion."
      - weight: 1
        text: "Before we get on with our day."
      - weight: 1
        text: "Nothing to make a fuss over, darling."
      - weight: 1
        text: "Let's keep things simple today."
    advice:
      - weight: 1
        text: "Whatever's comfortable, I'm not going to fight you on this one.\nMaybe a light layer for later, just to be safe."
      - weight: 1
        text: "This is cardigan weather, easy and simple.\nNo lecture today, I'm taking the day off."
      - weight: 1
        text: "Dress how you like, I trust your judgment today.\nDon't get used to it."
      - weight: 1
        text: "A cotton T-shirt and light trousers, sweetheart.\nChoose a waistband you can sit down in — we're getting lunch, not taking photographs."
      - weight: 1
        text: "A thin long-sleeved shirt with cuffs you can roll back.\nAdjust as you warm up, love; no need to decide for the whole day."
      - weight: 1
        text: "Comfortable trainers and breathable socks for a walk.\nWear the pair you've broken in — let's keep the afternoon blister-free."
      - weight: 1
        text: "A loose dress with soft leggings if your legs feel cool.\nYou know your own comfort better than the number on the forecast."
      - weight: 1
        text: "A polo shirt and chinos will do nicely.\nCheck you can bend and reach comfortably before you leave, darling."
      - weight: 1
        text: "A quick-drying top and flexible bottoms for cycling.\nSkip the thick sweatshirt if you're working up a sweat."
      - weight: 1
        text: "A breathable blouse with a light overshirt for indoors.\nThat café turns the air conditioning up as if it's storing cheese."
    sting:
      - weight: 1
        text: "I'll let you dress yourself today. Enjoy the freedom."
      - weight: 1
        text: "See? I don't always have something to say."
      - weight: 1
        text: "Leave yourself time to sit somewhere nice. Every outing doesn't need a receipt."
      - weight: 1
        text: "I've opened the windows. Your father has already started his investigation."
      - weight: 1
        text: "Take a picture if you see something lovely. I do enjoy your little updates."
      - weight: 1
        text: "The laundry's outside, so naturally I'm feeling rather adventurous."
      - weight: 1
        text: "Have your lunch before you leave. A mint from the bottom of your bag doesn't count."
      - weight: 1
        text: "You can pop round without an occasion, you know. I don't require a birthday."
      - weight: 1
        text: "Don't spend the whole afternoon choosing somewhere to spend the afternoon."
      - weight: 1
        text: "Bring that book you keep meaning to read. It deserves a trip out too."

  comfortable:
    intro:
      - weight: 2
        text: "A genuinely nice day, sweetie."
      - weight: 1
        text: "I have literally nothing to complain about."
      - weight: 1
        text: "Go outside and enjoy this, it won't last."
      - weight: 1
        text: "Well, darling, isn't this lovely."
      - weight: 1
        text: "You've got your mother's blessing today."
      - weight: 1
        text: "Here's a little thought before you go."
      - weight: 1
        text: "Even I can keep this brief, love."
      - weight: 1
        text: "Come on, sweetheart, the day's waiting."
      - weight: 1
        text: "Let's get you out the door, then."
      - weight: 1
        text: "Just between us, I'd say you're all set."
    advice:
      - weight: 1
        text: "Wear whatever makes you happy today, seriously.\nA t-shirt is perfectly fine, I promise I won't say anything."
      - weight: 1
        text: "Short sleeves, no notes.\nMaybe a light layer for later, but that's it from me."
      - weight: 1
        text: "Days like this are why I don't worry every single day.\nGo enjoy it, call me later and tell me about your day."
      - weight: 1
        text: "A breezy cotton dress and comfortable sandals, sweetheart.\nCheck the straps don't rub before you wander too far."
      - weight: 1
        text: "A linen shirt with relaxed trousers will be lovely.\nLet it crease, darling — you're having a day out, not posing in a shop window."
      - weight: 1
        text: "A breathable top and stretchy shorts for your bike ride.\nKeep loose hems clear of the chain, please."
      - weight: 1
        text: "A polo and lightweight chinos for lunch outside.\nLeave a little room at the waist; you know they do pudding."
      - weight: 1
        text: "A sun hat with whatever outfit you've chosen.\nNice temperatures don't stop your nose catching the sun, love."
      - weight: 1
        text: "Trainers and moisture-wicking socks if you're walking all afternoon.\nTrim any scratchy labels now, while the scissors are handy."
      - weight: 1
        text: "A light overshirt over your usual tee for the office.\nTake it off outside if you like — it's for that chilly air conditioning."
    sting:
      - weight: 1
        text: "I'll stop worrying for one whole day. Savor it."
      - weight: 1
        text: "Days like this make my job easy. I could get used to this."
      - weight: 1
        text: "Look at that, you and the weather are both on your best behavior."
      - weight: 1
        text: "I've put the good cushions on the garden chairs. Apparently we're entertaining ourselves."
      - weight: 1
        text: "Go on, have the ice cream. You don't need a special occasion for two scoops."
      - weight: 1
        text: "Your chores have waited this long. I doubt another hour will upset them."
      - weight: 1
        text: "I'd join you, but someone has to explain the new bird feeder to your father."
      - weight: 1
        text: "Don't just send me a photo of your coffee. Let me see your lovely face."
      - weight: 1
        text: "I've packed enough sandwiches for company. Making a friend is now your department."
      - weight: 1
        text: "Put your feet up somewhere, love. Being busy isn't a competition you have to win."

  warm:
    intro:
      - weight: 2
        text: "Warming up, which means new worries."
      - weight: 1
        text: "It's warm, so now I worry about different things."
      - weight: 1
        text: "Summer worries, my favorite kind."
      - weight: 1
        text: "A quick word from your mum, darling."
      - weight: 1
        text: "Before you disappear for the afternoon."
      - weight: 1
        text: "You know me, always thinking ahead."
      - weight: 1
        text: "Let me send you off properly, love."
      - weight: 1
        text: "Just give me a moment, sweetheart."
      - weight: 1
        text: "I've got a little suggestion for you."
      - weight: 1
        text: "Right then, let's see you ready."
    advice:
      - weight: 1
        text: "Shorts and a t-shirt, fine.\nBut sunglasses and sunscreen, non-negotiable — your skin isn't getting any younger."
      - weight: 1
        text: "Light, breathable fabrics.\nAnd water — actual water, not just coffee, you forget to drink enough."
      - weight: 1
        text: "Dress light, stay cool.\nA hat if you'll be out long, I worry about your scalp, don't ask why."
      - weight: 1
        text: "A loose linen shirt with airy trousers, sweetheart.\nLeave the tight jeans at home if you'll be sitting outside all afternoon."
      - weight: 1
        text: "A breezy dress and sandals with secure straps.\nGive your feet a little room — they can swell when it's warm."
      - weight: 1
        text: "A quick-drying top and running shorts for exercise.\nTake your breaks in the shade, love; you don't owe anyone a personal best."
      - weight: 1
        text: "A thin long-sleeved overshirt for a sunny walk.\nKeep your shoulders covered, especially if they haven't seen daylight since last August."
      - weight: 1
        text: "An unlined cotton blouse and a light skirt for errands.\nCheck the label, darling — some of those pretty fabrics barely let any air through."
      - weight: 1
        text: "Walking shoes with breathable socks for a day on your feet.\nTry those new shoes on a shorter outing first; I can't collect you from every blister."
      - weight: 1
        text: "A relaxed tee with soft, longer shorts for sightseeing.\nChoose smooth seams if your thighs rub — let's keep you comfortable past lunchtime."
    sting:
      - weight: 1
        text: "Drink water. I mean it, not just coffee."
      - weight: 1
        text: "Sunscreen, sweetie. I'm not nagging, I'm saying it because I love your face."
      - weight: 1
        text: "The chocolate in your bag would like a decision about its future."
      - weight: 1
        text: "I've claimed the shady chair. Seniority has to count for something."
      - weight: 1
        text: "Take your lunch out of the car when you arrive. It isn't a slow cooker."
      - weight: 1
        text: "Your father has brought out the barbecue tongs. We're all apparently on standby."
      - weight: 1
        text: "Put a towel on that bench before you sit, love. Bare legs make a very honest thermometer."
      - weight: 1
        text: "You can come in for a rest without admitting you're tired."
      - weight: 1
        text: "I bought melon. Come over before I decide cutting it up was enough exercise for today."
      - weight: 1
        text: "Enjoy yourself, darling. You don't have to fit the whole summer into one afternoon."

  hot:
    intro:
      - weight: 2
        text: "Oh no, the heat, my other nemesis."
      - weight: 1
        text: "Please be careful, I mean it this time."
      - weight: 1
        text: "This heat has me genuinely worried."
      - weight: 1
        text: "Sweetheart, a moment before you go."
      - weight: 1
        text: "Let your mother make one suggestion."
      - weight: 1
        text: "I've had a look outside, darling."
      - weight: 1
        text: "You know I like you properly prepared."
      - weight: 1
        text: "A little planning first, love."
      - weight: 1
        text: "Bear with me while I fuss."
      - weight: 1
        text: "Here's what I'm thinking, sweetheart."
    advice:
      - weight: 1
        text: "The lightest clothes you own, and drink more water than feels necessary.\nSunglasses and sunscreen — both, no shortcuts, I will ask."
      - weight: 1
        text: "A wide hat and something loose and light.\nCome inside the second you feel dizzy, promise me right now."
      - weight: 1
        text: "Stay in shade whenever you can.\nAnd for the last time, drink the water, not just the iced coffee."
      - weight: 1
        text: "A pale linen shirt and roomy shorts, darling.\nSave the thick denim for another day; it can manage without you."
      - weight: 1
        text: "A loose cotton dress with flat, adjustable sandals.\nLoosen the straps if your feet swell — no suffering for a pretty buckle."
      - weight: 1
        text: "A breathable sports top and quick-drying bottoms if you must exercise.\nGo in the cooler hours and ease the pace, love."
      - weight: 1
        text: "An airy long-sleeved shirt with UV protection for time outdoors.\nCover your arms without wrapping yourself in anything heavy."
      - weight: 1
        text: "Light mesh trainers with thin, moisture-wicking socks for walking.\nTake a spare pair if you'll be out all day; damp feet rub."
      - weight: 1
        text: "A relaxed sleeveless top with soft shorts long enough to prevent chafing.\nCheck the seams before a long outing, sweetheart."
      - weight: 1
        text: "An unlined blouse with a flowing skirt for work.\nKeep a spare top handy if your commute leaves you soaked in sweat."
    sting:
      - weight: 1
        text: "Please don't overdo it in this heat. I mean it."
      - weight: 1
        text: "Come inside if you feel unwell. I will actually worry, not the fun kind."
      - weight: 1
        text: "Heat scares me more than cold, and I've told you why a hundred times."
      - weight: 1
        text: "I'm serving something cold for dinner. The oven and I aren't speaking."
      - weight: 1
        text: "Leave the gardening, sweetheart. The weeds haven't got an appointment."
      - weight: 1
        text: "Check the car seat before you sit down. Those buckles hold grudges."
      - weight: 1
        text: "The fan is for everyone, darling. Try not to establish a private residence in front of it."
      - weight: 1
        text: "Ring your gran later. She'll say she's fine, then admit she's been ironing."
      - weight: 1
        text: "There's fresh fruit in the fridge. Open the drawer, not just the fridge door."
      - weight: 1
        text: "You don't have to finish every errand today. I'll still be proud of you tomorrow."

  windy_cold:
    intro:
      - weight: 2
        text: "Cold AND windy, be honest with me here."
      - weight: 1
        text: "This is exactly the combination I hate."
      - weight: 1
        text: "Bundle up, the wind means business today."
      - weight: 1
        text: "Hold on, sweetheart, a little preparation."
      - weight: 1
        text: "Your mum has checked the forecast."
      - weight: 1
        text: "Before you tell me you'll be fine."
      - weight: 1
        text: "Let's think this through, darling."
      - weight: 1
        text: "A bit of motherly guidance for you."
      - weight: 1
        text: "Give me a minute at the door, love."
      - weight: 1
        text: "You know I like to see you sorted."
    advice:
      - weight: 1
        text: "A windproof coat, not just any coat, I mean it this time.\nZip it all the way — every gap is an invitation for a cold."
      - weight: 1
        text: "Cover your ears and your neck, please.\nThe wind makes everything worse than the thermometer says."
      - weight: 1
        text: "Layers under something windproof.\nGloves too, your hands get cold faster than you admit."
      - weight: 1
        text: "A fleece-lined cap with a hood secured over it, sweetheart.\nAdjust it so you can still see to either side before crossing roads."
      - weight: 1
        text: "Full-length, tightly woven trousers over a thermal base if you're out for long.\nSave the ripped jeans for somewhere with walls, love."
      - weight: 1
        text: "Closed boots and wool-blend socks with room for your toes.\nCheck the forecast for rain too before choosing that lovely suede pair."
      - weight: 1
        text: "A fitted neck warmer tucked inside your collar.\nNo trailing scarf ends near your bicycle wheels, please."
      - weight: 1
        text: "A breathable undershirt beneath a warm midlayer and shell.\nEase a zip open if you start sweating uphill, then close it when you stop."
      - weight: 1
        text: "Insulated mittens with cuffs that overlap your sleeves.\nTry using your keys before leaving so you won't need bare fingers at the door."
      - weight: 1
        text: "A longer parka with the waist and hem adjusted snugly.\nYou want room to move, darling, without a draft up your back."
    sting:
