server:
  port: 8080
  # Бэк стоит за Nginx: берём схему/хост из X-Forwarded-*, иначе redirect_uri для Google будет http://
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 30d

spring:
  application:
    name: weather-advisor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:weather_advisor}
    username: ${DB_USER:weather_advisor}
    password: ${DB_PASSWORD:weather_advisor}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # схему меняет только Flyway, Hibernate лишь сверяет
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  session:
    timeout: 30d
    jdbc:
      initialize-schema: never # таблицы spring_session создаёт Flyway (V1__baseline.sql)

  flyway:
    # существующие базы без flyway_schema_history (прод, локалка) помечаются как V1,
    # V1__baseline.sql на них не выполняется; на пустой базе выполняется всё
    baseline-on-migrate: true
    baseline-version: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing-client-secret}
            scope: openid,profile,email

egocast:
  # email-ы админов через запятую (env ADMIN_EMAILS), им доступен /api/v1/stats/summary
  admin-emails: ${ADMIN_EMAILS:}
  stats:
    zone: Europe/Prague # по какой таймзоне считаем «день» в статистике

weather:
  open-meteo:
    base-url: https://api.open-meteo.com

logging:
  level:
    app.egocast.weather: DEBUG