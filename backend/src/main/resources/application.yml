server:
  port: 8080
  # Бэк стоит за Nginx: берём схему/хост из X-Forwarded-*, иначе redirect_uri для Google будет http://
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 30d

spring:
  application:
    name: weather-advisor-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:weather_advisor}
    username: ${DB_USER:weather_advisor}
    password: ${DB_PASSWORD:weather_advisor}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # миграции руками, как в MyCarLog — без сюрпризов
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  session:
    timeout: 30d
    jdbc:
      initialize-schema: always # таблицы spring_session создаются автоматически

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing-client-secret}
            scope: openid,profile,email

weather:
  open-meteo:
    base-url: https://api.open-meteo.com

logging:
  level:
    app.egocast.weather: DEBUG