version: "3.9"

# Локальная разработка — билдим бэкенд из исходников (build: .),
# как договаривались по опыту MyCarLog, чтобы не тянуть статичный образ.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather_advisor
      POSTGRES_USER: weather_advisor
      POSTGRES_PASSWORD: weather_advisor
    ports:
      - "5432:5432"
    volumes:
      - weather_advisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_advisor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: weather_advisor
      DB_USER: weather_advisor
      DB_PASSWORD: weather_advisor
    depends_on:
      db:
        condition: service_healthy

volumes:
  weather_advisor_pgdata:
